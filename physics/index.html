            solution: EQ(`(a) <em>P</em> = ${int(M)} × 9.81 × ${fix(v, 1)} = <strong>${num(P0, 3)} kW</strong>`) +
              EQ(`(b) <em>P</em> = (${int(M)} − ${int(Mc)}) × 9.81 × ${fix(v, 1)} = <strong>${num(Pc, 3)} kW</strong>`) +
              EQ(`(c) (1 − ${num(Pc, 3)}/${num(P0, 3)}) × 100 = <strong>${fix(red, 1)}%</strong>`) +
              P('When the car is nearly empty, the counterweight is heavier than the car and the motor works as a brake instead, which is when regenerative drives can return energy.')
          };
        }
      }
    ]
  });

  /* ======================================================================
     OSCILLATIONS
     ====================================================================== */

  /* ---------- osc-pendulum: T = 2π√(L/g) ---------- */
  register({
    id: 'osc-pendulum', topic: 'oscillations', title: 'Pendulum timing', fields: ['tech', 'earth', 'engineering'], sim: 'home-pendulum',
    principle: { name: 'Period of a simple pendulum', text: P('For small swings, a pendulum’s period (one full swing out and back) is <em>T</em> = 2π√(<em>L</em>/<em>g</em>), where <em>L</em> is the length from the pivot to the center of the bob. It does not depend on the mass, and barely on the size of the swing if that stays small. Measure <em>T</em> and <em>L</em> and you can work out <em>g</em>.') },
    history: { year: '1656–1673', who: 'Christiaan Huygens', text: P('Galileo noticed around 1602 that a pendulum’s swings take about the same time whether they are wide or narrow. In 1656 the Dutch scientist Christiaan Huygens built the first pendulum clock, which improved timekeeping from errors of about 15 minutes a day to about 15 seconds. In his 1673 book <em>Horologium Oscillatorium</em> he published the formula for the period of a pendulum.') },
    contexts: [
      {
        key: 'clock', title: 'Regulating a pendulum clock',
        applications: {
          now: P('Clockmakers regulate pendulum clocks by moving the bob up or down a few millimetres; tower clocks such as the Great Clock of Westminster (Big Ben) are fine-tuned by adding or removing small weights.'),
          next: P('The best atomic clocks are now so precise they can sense the change in gravity between two heights a few centimetres apart, and may become instruments for mapping Earth’s gravity.')
        },
        careers: ['Clockmaker (horologist)', 'Metrologist', 'Precision engineer'],
        build(rng, college) {
          const T0 = rnd(rng, 0.80, 2.00, 0.02), L = G * T0 * T0 / (4 * Math.PI * Math.PI);
          const context = P(`A clockmaker is building a pendulum clock whose pendulum should have a period of ${fix(T0, 2)} s (one complete swing out and back). ${gTxt}`);
          if (!college) {
            return {
              context, given: { T0 },
              parts: [numPart('a', 'How long should the pendulum be, from the pivot to the center of the bob?', L, 'm', 3),
                numPart('b', 'How many complete swings does the pendulum make in one hour?', 3600 / T0, 'swings', 4)],
              hints: [P('Use <em>T</em> = 2π√(<em>L</em>/<em>g</em>) and solve for <em>L</em>.'),
                P('Square both sides: <em>T</em><sup>2</sup> = 4π<sup>2</sup><em>L</em>/<em>g</em>, so <em>L</em> = <em>gT</em><sup>2</sup>/(4π<sup>2</sup>).'),
                P('Swings per hour = 3,600 s ÷ period.')],
              solution: P('(a) Solve the period formula for the length:') + EQ(`<em>L</em> = <em>gT</em><sup>2</sup>/(4π<sup>2</sup>) = 9.81 × ${fix(T0, 2)}<sup>2</sup>/(4π<sup>2</sup>) = <strong>${num(L, 3)} m</strong>`) +
                P('(b) Swings in an hour:') + EQ(`3,600 / ${fix(T0, 2)} = <strong>${num(3600 / T0, 4)}</strong>`) +
                P('A “seconds pendulum”, which ticks once per second (a 2.0 s period), is just under a metre long, which is why grandfather clocks are so tall.')
            };
          }
          const dL = rnd(rng, 0.5, 3.0, 0.5), lost = 86400 * (1 - Math.sqrt(L / (L + dL / 1000)));
          return {
            context: context + P(`After assembly, the pendulum turns out to be ${fix(dL, 1)} mm too long.`),
            given: { T0, dL },
            parts: [numPart('a', 'What length was intended?', L, 'm', 3),
              numPart('b', 'How many seconds per day does the clock lose because of the extra length?', lost, 's', 3),
              mcq(rng, 'c', 'How should the clockmaker correct it?', 'Raise the bob slightly (shorten the pendulum)', ['Lower the bob slightly (lengthen the pendulum)', 'Use a heavier bob', 'Make the swings wider'])],
            hints: [P('<em>L</em> = <em>gT</em><sup>2</sup>/(4π<sup>2</sup>).'),
              P('A longer pendulum has a longer period, so the clock counts fewer ticks per real day. Its count of a real day is 86,400 × <em>T</em><sub>0</sub>/<em>T</em><sub>new</sub> seconds.'),
              P('<em>T</em><sub>0</sub>/<em>T</em><sub>new</sub> = √(<em>L</em>/(<em>L</em> + Δ<em>L</em>)). Seconds lost = 86,400 × (1 − √(<em>L</em>/(<em>L</em> + Δ<em>L</em>))).')],
            solution: EQ(`(a) <em>L</em> = 9.81 × ${fix(T0, 2)}<sup>2</sup>/(4π<sup>2</sup>) = <strong>${num(L, 4)} m</strong>`) +
              P('(b) The clock counts real time at the rate <em>T</em><sub>0</sub>/<em>T</em><sub>new</sub>:') +
              EQ(`lost = 86,400 × (1 − √(${fix(L, 4)}/${fix(L + dL / 1000, 4)})) = <strong>${num(lost, 3)} s per day</strong>`) +
              P(`(c) A longer pendulum swings more slowly, so <strong>raise the bob</strong> to shorten it. Mass and swing size hardly matter. A useful rule: the fractional change in period is half the fractional change in length, here ½ × ${fix(dL, 1)} mm / ${num(L * 1000, 4)} mm.`)
          };
        }
      },
      {
        key: 'measure-g', title: 'Measuring gravity with a pendulum', fields: ['earth', 'tech'],
        applications: {
          now: P('Geophysicists measure tiny differences in <em>g</em> (about one part in a billion) with absolute gravimeters, which time a mirror falling in a vacuum, to track groundwater, find mineral deposits and watch magma move under volcanoes.'),
          next: P('Quantum gravimeters that use clouds of laser-cooled atoms as falling test masses are now commercial and portable, and are being tested for mapping underground water and spotting buried tunnels and voids.')
        },
        careers: ['Geophysicist', 'Geodetic surveyor', 'Physics teacher'],
        build(rng, college) {
          const L = rnd(rng, 0.40, 1.50, 0.05), gTrue = rnd(rng, 9.78, 9.83, 0.01);
          const t10 = Math.round(10 * 2 * Math.PI * Math.sqrt(L / gTrue) * 100) / 100, T = t10 / 10, gm = 4 * Math.PI * Math.PI * L / (T * T);
          const context = P(`A student hangs a small heavy bob from a string, measures the length from the pivot to the bob’s center as ${fix(L, 2)} m, and times 10 small swings with a stopwatch: ${fix(t10, 2)} s.`);
          if (!college) {
            return {
              context, given: { L, t10 },
              parts: [numPart('a', 'What is the period of the pendulum?', T, 's', 3),
                numPart('b', 'What value of <em>g</em> do these measurements give?', gm, 'm/s²', 3, { abs: 0.03 })],
              hints: [P('The period is the time for one complete swing.'),
                P('Rearrange <em>T</em> = 2π√(<em>L</em>/<em>g</em>) for <em>g</em>.'),
                P('<em>g</em> = 4π<sup>2</sup><em>L</em>/<em>T</em><sup>2</sup>.')],
              solution: P('(a) One swing:') + EQ(`<em>T</em> = ${fix(t10, 2)} s / 10 = <strong>${fix(T, 3)} s</strong>`) +
                P('(b) Rearranging the period formula:') + EQ(`<em>g</em> = 4π<sup>2</sup> × ${fix(L, 2)} / ${fix(T, 3)}<sup>2</sup> = <strong>${fix(gm, 2)} m/s<sup>2</sup></strong>`) +
                P('Real values of <em>g</em> range from about 9.78 m/s<sup>2</sup> at the equator to 9.83 m/s<sup>2</sup> at the poles. Try it at home with the pendulum lab.')
            };
          }
          const dg = gm * 2 * 0.2 / t10;
          return {
            context: context + P('Starting and stopping the stopwatch by hand adds an uncertainty of about ±0.2 s to the 10-swing time.'),
            given: { L, t10 },
            parts: [numPart('a', 'What value of <em>g</em> do these measurements give?', gm, 'm/s²', 3, { abs: 0.03 }),
              numPart('b', 'Ignoring any error in the length, what uncertainty (±) in <em>g</em> does the timing uncertainty cause?', dg, 'm/s²', 2, { tol: 0.06 }),
              mcq(rng, 'c', 'Why time 10 swings instead of 1?', 'The reaction-time error is the same for the whole timing, so spreading it over 10 periods makes the period’s uncertainty 10 times smaller', ['A pendulum swings more regularly after the first few swings', 'One swing is too fast for any stopwatch to record', 'Ten swings average out changes in the length'])],
            hints: [P('<em>T</em> = (10-swing time)/10, then <em>g</em> = 4π<sup>2</sup><em>L</em>/<em>T</em><sup>2</sup>.'),
              P('Because <em>g</em> ∝ 1/<em>T</em><sup>2</sup>, a small fractional error in <em>T</em> makes twice that fractional error in <em>g</em>.'),
              P(`Fractional timing error = 0.2/${fix(t10, 2)}. Δ<em>g</em> = <em>g</em> × 2 × 0.2/${fix(t10, 2)}.`)],
            solution: EQ(`(a) <em>T</em> = ${fix(T, 3)} s, <em>g</em> = 4π<sup>2</sup> × ${fix(L, 2)} / ${fix(T, 3)}<sup>2</sup> = <strong>${fix(gm, 2)} m/s<sup>2</sup></strong>`) +
              P('(b) <em>g</em> depends on 1/<em>T</em><sup>2</sup>, so the fractional uncertainty doubles:') +
              EQ(`Δ<em>g</em> = ${fix(gm, 2)} × 2 × (0.2/${fix(t10, 2)}) = <strong>±${fix(dg, 2)} m/s<sup>2</sup></strong>`) +
              P('(c) The ±0.2 s comes from starting and stopping, once each, however many swings you count, so <strong>timing more swings shrinks the error per swing</strong>. Timing 50 swings would do even better, as long as the swings stay small.')
          };
        }
      }
    ]
  });

  /* ---------- osc-spring: f = (1/2π)√(k/m) ---------- */
  register({
    id: 'osc-spring', topic: 'oscillations', title: 'Springs that bounce', fields: ['transport', 'engineering', 'earth'], sim: 'spring-lab',
    principle: { name: 'Mass on a spring (simple harmonic motion)', text: P('A spring pulls back with a force proportional to its stretch, <em>F</em> = −<em>kx</em> (Hooke’s law). A mass on such a spring oscillates with period <em>T</em> = 2π√(<em>m</em>/<em>k</em>), or frequency <em>f</em> = (1/2π)√(<em>k</em>/<em>m</em>): stiffer springs bounce faster, heavier masses slower. Hung vertically, the mass sags by <em>mg</em>/<em>k</em> but oscillates with the same period.') },
    history: { year: '1678', who: 'Robert Hooke', text: P('Robert Hooke, curator of experiments at London’s Royal Society, published his law of springs in 1678 in <em>Lectures de Potentia Restitutiva</em>, summarized in Latin as <em>ut tensio, sic vis</em> (“as the extension, so the force”). He had announced it two years earlier as a scrambled-letter anagram to claim priority without revealing the idea. A century later, Sophie Germain won the Paris Academy’s 1816 prize for a theory of how elastic plates vibrate.') },
    contexts: [
      {
        key: 'suspension', title: 'Tuning a car’s suspension', fields: ['transport', 'engineering'],
        applications: {
          now: P('Suspension engineers choose spring stiffness so the body bounces at roughly 1–1.5 times a second, slow enough to feel comfortable, then add shock absorbers (dampers) to stop the bouncing after one or two cycles.'),
          next: P('Active suspensions read the road ahead with cameras and adjust each wheel before it reaches a bump; Mercedes-Benz introduced one in 2013, and electric-motor versions are now in production.')
        },
        careers: ['Vehicle dynamics engineer', 'Suspension design engineer', 'Motorsport engineer'],
        build(rng, college) {
          const m = rnd(rng, 300, 450, 10), k = rnd(rng, 20000, 40000, 1000);
          const x = m * G / k * 100, f = Math.sqrt(k / m) / (2 * Math.PI);
          const context = P(`Each corner of a car carries ${m} kg of the car’s body, supported by a coil spring with stiffness ${int(k)} N/m. ${gTxt}`);
          if (!college) {
            return {
              context, given: { m, k },
              parts: [numPart('a', 'How far is each spring compressed by the car’s weight? Give the answer in centimetres.', x, 'cm', 3),
                numPart('b', 'After a bump, at what frequency does that corner of the car bounce (ignoring the shock absorbers)?', f, 'Hz', 3)],
              hints: [P('At rest, the spring force <em>kx</em> balances the weight <em>mg</em>.'),
                P('A mass on a spring oscillates at <em>f</em> = (1/2π)√(<em>k</em>/<em>m</em>).'),
                P(`<em>x</em> = ${m} × 9.81 / ${int(k)} m; multiply by 100 for cm.`)],
              solution: P('(a) Static balance, Hooke’s law:') + EQ(`<em>x</em> = <em>mg</em>/<em>k</em> = ${m} × 9.81 / ${int(k)} = ${fix(x / 100, 4)} m = <strong>${num(x, 3)} cm</strong>`) +
                P('(b) Natural frequency:') + EQ(`<em>f</em> = (1/2π)√(${int(k)}/${m}) = <strong>${num(f, 3)} Hz</strong>`) +
                P('Around 1–1.5 Hz feels comfortable to most people; sports cars use stiffer springs and bounce faster.')
            };
          }
          const dm = rnd(rng, 60, 120, 10), f2 = Math.sqrt(k / (m + dm)) / (2 * Math.PI), sag = dm * G / k * 100;
          return {
            context: context + P(`Then passengers and luggage add ${dm} kg to that corner.`),
            given: { m, k, dm },
            parts: [numPart('a', 'What is the natural bounce frequency of that corner when the car is empty?', f, 'Hz', 3),
              numPart('b', 'What is it with the added load?', f2, 'Hz', 3),
              numPart('c', 'How many extra centimetres does the loaded corner sit lower?', sag, 'cm', 3)],
            hints: [P('<em>f</em> = (1/2π)√(<em>k</em>/<em>m</em>), with <em>m</em> the mass the spring supports.'),
              P('Adding mass lowers the frequency by the factor √(<em>m</em>/(<em>m</em> + Δ<em>m</em>)).'),
              P('Extra sag = Δ<em>m g</em>/<em>k</em>.')],
            solution: EQ(`(a) <em>f</em> = (1/2π)√(${int(k)}/${m}) = <strong>${num(f, 3)} Hz</strong>`) +
              EQ(`(b) <em>f</em> = (1/2π)√(${int(k)}/${m + dm}) = <strong>${num(f2, 3)} Hz</strong>`) +
              EQ(`(c) Δ<em>x</em> = ${dm} × 9.81 / ${int(k)} = <strong>${num(sag, 3)} cm</strong>`) +
              P('A loaded car rides lower and bounces more slowly, which is why some vehicles have self-levelling suspension.')
          };
        }
      },
      {
        key: 'tmd', title: 'A skyscraper’s giant pendulum', fields: ['engineering', 'earth'],
        applications: {
          now: P('Tall buildings use tuned mass dampers to reduce swaying in strong winds and earthquakes. Taipei 101’s 660-tonne steel sphere hangs from the 92nd floor down to the 87th; the Shanghai Tower’s damper weighs about 1,000 tonnes and uses magnets to absorb energy.'),
          next: P('Active and semi-active dampers that adjust themselves in real time are being fitted to slender towers, long footbridges and wind turbines.')
        },
        careers: ['Structural engineer', 'Wind engineer', 'Earthquake engineer'],
        build(rng, college) {
          const Tb = rnd(rng, 4.0, 8.0, 0.5), m = rnd(rng, 300, 700, 20);
          const fb = 1 / Tb, k = 4 * Math.PI * Math.PI * m * 1000 / (Tb * Tb) / 1000, Lp = G * Tb * Tb / (4 * Math.PI * Math.PI);
          const context = P(`A tall tower sways back and forth in the wind with a natural period of ${fix(Tb, 1)} s. Engineers plan a tuned mass damper: a ${m}-tonne mass that should oscillate with the same period, so it moves out of step with the building and soaks up its motion. (1 tonne = 1,000 kg.)`);
          if (!college) {
            return {
              context, given: { Tb, m },
              parts: [numPart('a', 'What is the building’s natural sway frequency?', fb, 'Hz', 3),
                numPart('b', 'If the damper mass rides on springs, what total spring stiffness (in kN/m) gives it the same period?', k, 'kN/m', 3)],
              hints: [P('Frequency is the inverse of the period: <em>f</em> = 1/<em>T</em>.'),
                P('For a mass on a spring, <em>T</em> = 2π√(<em>m</em>/<em>k</em>). Solve for <em>k</em>.'),
                P(`<em>k</em> = 4π<sup>2</sup><em>m</em>/<em>T</em><sup>2</sup> with <em>m</em> in kg (${int(m * 1000)} kg). Divide N/m by 1,000 for kN/m.`)],
              solution: EQ(`(a) <em>f</em> = 1/${fix(Tb, 1)} = <strong>${num(fb, 3)} Hz</strong>`) +
                P('(b) Match the damper’s period to the building’s:') + EQ(`<em>k</em> = 4π<sup>2</sup> × ${int(m * 1000)} / ${fix(Tb, 1)}<sup>2</sup> = ${num(k * 1000, 3)} N/m = <strong>${num(k, 3)} kN/m</strong>`) +
                P('A damper tuned to the wrong period barely helps, which is why engineers measure the finished building’s sway before final tuning.')
            };
          }
          return {
            context, given: { Tb, m },
            parts: [numPart('a', 'If the damper rides on springs, what total spring stiffness (in kN/m) gives it the building’s period?', k, 'kN/m', 3),
              numPart('b', `If instead the mass hangs as a simple pendulum, how long must the pendulum be? ${gTxt}`, Lp, 'm', 3),
              mcq(rng, 'c', 'Why does the pendulum’s length not depend on the damper’s mass?','For a pendulum, gravity’s pull and the inertia both scale with the mass, so the mass cancels from the period', ['Heavy masses swing too slowly for the mass to matter', 'The length was chosen first and the mass adjusted to fit', 'Only the building’s mass affects the period'])],
            hints: [P('Spring: <em>T</em> = 2π√(<em>m</em>/<em>k</em>), so <em>k</em> = 4π<sup>2</sup><em>m</em>/<em>T</em><sup>2</sup>.'),
              P('Pendulum: <em>T</em> = 2π√(<em>L</em>/<em>g</em>), so <em>L</em> = <em>gT</em><sup>2</sup>/(4π<sup>2</sup>).'),
              P('Compare the two formulas: which one contains the mass?')],
            solution: EQ(`(a) <em>k</em> = 4π<sup>2</sup> × ${int(m * 1000)} / ${fix(Tb, 1)}<sup>2</sup> = <strong>${num(k, 3)} kN/m</strong>`) +
              EQ(`(b) <em>L</em> = 9.81 × ${fix(Tb, 1)}<sup>2</sup>/(4π<sup>2</sup>) = <strong>${num(Lp, 3)} m</strong>`) +
              P('(c) In a pendulum the restoring force (from gravity) and the inertia are both proportional to the mass, so <strong>the mass cancels</strong>. A long period needs a long pendulum; designers sometimes fold the length with linkages to fit it inside a few floors.')
          };
        }
      }
    ]
  });

  if (typeof module !== 'undefined' && module.exports) module.exports = T;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/sims/projectile-lab.js */
/* Physics Discovery Lab · Projectile Lab (simulation)
   Launch a real ball at a chosen speed, angle and height and watch its path, with or
   without air. Without air the motion is exact: steady horizontal speed plus uniformly
   accelerated fall, so the path is a parabola. With air the drag force is ½ρC_dAv²,
   opposite the velocity, integrated step by step (RK4); the drag coefficient is held
   constant and spin is ignored. The model and problem code is DOM-free and exported for Node. */
(function (root) {
  'use strict';
  const ADL = root.ADL = root.ADL || {};

  /* ======================= Model (pure, DOM-free) ======================= */

  const PC = (ADL.physics && ADL.physics.C) || {};
  const G = PC.g || 9.80665;          // m/s²
  const RHO = PC.rhoAir || 1.20;      // kg/m³
  const LIM = Object.freeze({ vMin: 1, vMax: 50, aMin: 0, aMax: 89, hMin: 0, hMax: 20 });

  /* Masses and diameters from the rules of each sport; drag coefficients are typical
     values at these speeds (real ones vary with speed, seams and spin). */
  const OBJECTS = {
    baseball: { id: 'baseball', name: 'Baseball', mass: 0.145, d: 0.074, cd: 0.35, v0: 35, angle: 30, h0: 1,
      note: 'A baseball is 142–149 g and about 7.4 cm across. Its raised seams and spin make real drag vary; this lab uses a constant C<sub>d</sub> = 0.35.' },
    soccer: { id: 'soccer', name: 'Soccer ball (size 5)', mass: 0.43, d: 0.22, cd: 0.20, v0: 25, angle: 35, h0: 0,
      note: 'A size 5 ball is 410–450 g and about 22 cm across. At kicking speeds its drag coefficient is low, about 0.2; it roughly doubles once the ball slows below about 10–15 m/s, which this lab leaves out.' },
    shot: { id: 'shot', name: 'Shot put (7.26 kg)', mass: 7.26, d: 0.12, cd: 0.47, v0: 13, angle: 38, h0: 2,
      note: 'The men’s shot is 7.26 kg of metal about 12 cm across. It is so heavy for its size that air barely slows it.' },
    pingpong: { id: 'pingpong', name: 'Ping-pong ball', mass: 0.0027, d: 0.040, cd: 0.5, v0: 12, angle: 45, h0: 0.8,
      note: 'A table-tennis ball is 2.7 g and 40 mm across. It is so light for its size that air resistance dominates its flight.' }
  };
  const obj = id => OBJECTS[id] || OBJECTS.baseball;
  const dragK = o => 0.5 * RHO * o.cd * Math.PI * o.d * o.d / 4 / o.mass;   // drag acceleration = k v², k in 1/m
  const terminalSpeed = o => Math.sqrt(G / dragK(o));
  const rad = deg => deg * Math.PI / 180;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  /* Exact no-air results. g may be overridden (problems use 9.81). */
  function noAir(s, g) {
    g = g || G;
    const th = rad(s.angle), vx = s.v0 * Math.cos(th), vy = s.v0 * Math.sin(th), h = s.h0;
    const t = (vy + Math.sqrt(vy * vy + 2 * g * h)) / g;
    const tPeak = vy > 0 ? vy / g : 0, maxH = h + (vy > 0 ? vy * vy / (2 * g) : 0);
    const vyEnd = vy - g * t;
    return { t, range: vx * t, maxH, tPeak, impactSpeed: Math.hypot(vx, vyEnd), impactAngle: Math.atan2(-vyEnd, vx) * 180 / Math.PI, vx, vy };
  }

  /* Step-by-step flight. Returns the same summary plus path samples [t, x, y, vx, vy]. */
  function flight(s, drag) {
    const o = obj(s.object), k = drag ? dragK(o) : 0;
    const th = rad(s.angle);
    let t = 0, x = 0, y = s.h0, vx = s.v0 * Math.cos(th), vy = s.v0 * Math.sin(th);
    const path = [[0, x, y, vx, vy]];
    const est = noAir(s).t;
    if (!(est > 0)) return { t: 0, range: 0, maxH: s.h0, tPeak: 0, impactSpeed: s.v0, impactAngle: 0, path, drag: !!drag };
    const dt = clamp(est / 3000, 2e-5, 0.002), every = Math.max(1, Math.round(est / dt / 500));
    let maxH = y, tPeak = 0;
    const acc = (ux, uy) => { const v = Math.hypot(ux, uy); return [-k * v * ux, -G - k * v * uy]; };
    for (let i = 1; t < 120; i++) {
      const [a1x, a1y] = acc(vx, vy);
      const [a2x, a2y] = acc(vx + a1x * dt / 2, vy + a1y * dt / 2);
      const [a3x, a3y] = acc(vx + a2x * dt / 2, vy + a2y * dt / 2);
      const [a4x, a4y] = acc(vx + a3x * dt, vy + a3y * dt);
      const nx = x + dt * (vx + dt / 6 * (a1x + a2x + a3x)), ny = y + dt * (vy + dt / 6 * (a1y + a2y + a3y));
      const nvx = vx + dt / 6 * (a1x + 2 * a2x + 2 * a3x + a4x), nvy = vy + dt / 6 * (a1y + 2 * a2y + 2 * a3y + a4y);
      if (ny < 0) {   // landed during this step: interpolate to y = 0
        const f = y / (y - ny);
        t += f * dt; x += f * (nx - x); vx += f * (nvx - vx); vy += f * (nvy - vy); y = 0;
        path.push([t, x, 0, vx, vy]);
        break;
      }
      t += dt; x = nx; y = ny; vx = nvx; vy = nvy;
      if (y > maxH) { maxH = y; tPeak = t; }
      if (i % every === 0) path.push([t, x, y, vx, vy]);
    }
    return { t, range: x, maxH, tPeak, impactSpeed: Math.hypot(vx, vy), impactAngle: Math.atan2(-vy, vx) * 180 / Math.PI, path, drag: !!drag };
  }

  /* Position and velocity at time t, interpolated from the path */
  function at(path, t) {
    if (t <= 0) return path[0];
    const last = path[path.length - 1];
    if (t >= last[0]) return last;
    let lo = 0, hi = path.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (path[mid][0] <= t) lo = mid; else hi = mid; }
    const a = path[lo], b = path[hi], f = (t - a[0]) / (b[0] - a[0]);
    return a.map((v, i) => v + f * (b[i] - v));

  const LETTERS = 'abcdefgh';

  function choice(rng, correct, wrong) {

  function makeProblem(state, rng, level) {

    const parts = [
      { prompt: `<p>Ignoring air resistance and using g = 9.81 m/s², how long is the ball in the air before it hits the ground?</p>`, type: 'number', answer: na.t, unit: 's', tol: 0.02, digits: 3 },

    steel: { id: 'steel', name: 'Steel on steel (dry)', ms: 0.74, mk: 0.57, note: 'Clean, dry steel. A film of oil lowers these values several times over, which is the whole point of lubrication.' },

    }
    parts.forEach((p, i) => { p.id = LETTERS[i]; });
    const dText = s.push ? `mg sin θ − (push up the slope) = ${sig(r.par, 4)} N − (${s.push > 0 ? s.push : '−' + (-s.push)} N) = ${sig(r.D, 4)} N` : `mg sin θ = ${sig(r.par, 4)} N`;
    const solution =
      `<p>The weight is mg = ${s.mass} kg × 9.81 m/s² = ${sig(r.W, 4)} N.</p>` +
      `<p><strong>(a)</strong> Nothing accelerates it into or out of the surface, so</p><div class="eq">N = mg cos θ = ${sig(r.W, 4)} N × cos ${s.angle}° = ${sig(r.N, 3)} N</div>` +
      `<p><strong>(b)</strong></p><div class="eq">mg sin θ = ${sig(r.W, 4)} N × sin ${s.angle}° = ${sig(r.par, 3)} N</div>` +
      `<p><strong>(c)</strong> Before friction, the net push along the slope is ${dText}${r.D < 0 ? ' (negative means up the slope)' : ''}. Static friction can supply up to μ<sub>s</sub>N = ${sf.ms} × ${sig(r.N, 4)} N = ${sig(r.fsMax, 3)} N. ` +
      (r.state === 'rest' ? `Since ${sig(Math.abs(r.D), 3)} N ≤ ${sig(r.fsMax, 3)} N, friction holds it: ${ch.options[ch.answer].toLowerCase()}.</p>` : `Since ${sig(Math.abs(r.D), 3)} N > ${sig(r.fsMax, 3)} N, friction cannot hold it: ${ch.options[ch.answer].toLowerCase()}.</p>`) +
      (r.state === 'rest'
        ? `<p><strong>(d)</strong> Static friction supplies only what is needed, ${sig(Math.abs(r.friction), 3)} N, pointing ${r.D > 0 ? 'up' : r.D < 0 ? 'down' : 'along'} the slope, not its maximum.</p>`
        : `<p><strong>(d)</strong> Sliding, kinetic friction μ<sub>k</sub>N = ${sf.mk} × ${sig(r.N, 4)} N = ${sig(r.fk, 3)} N opposes the motion:</p><div class="eq">a = (${sig(Math.abs(r.D), 4)} N − ${sig(r.fk, 4)} N) ÷ ${s.mass} kg = ${sig(Math.abs(r.a), 3)} m/s²</div>`) + extra;
    return {
      id: `ramp-lab-${s.surface}-${rng.seed !== undefined ? rng.seed : Math.floor(rng.uniform() * 1e9)}`,
      templateId: `ramp-lab-${s.surface}`, topic: 'forces', level: college ? 'college' : 'hs', title: sc.title, fields: sc.fields,
      context: `<p>A ${s.mass} kg ${sc.obj} rests on ${sc.where}, tilted at ${s.angle}° to the horizontal.${pushText} These are the numbers from your Ramp & Friction Lab setup${s.adjusted ? ' (your ramp was nearly flat, so this problem tilts it to 15°)' : ''}. Friction coefficients for ${sf.name.toLowerCase()} are about μ<sub>s</sub> = ${sf.ms} (starting to slide) and μ<sub>k</sub> = ${sf.mk} (while sliding).</p>`,
      parts,
      hints: [
        '<p>Draw a free-body diagram: gravity straight down, the normal force perpendicular to the ramp, friction along the ramp, and any push along the ramp.</p>',
        '<p>Tilt your axes to match the ramp. Gravity’s parts are mg sin θ along the slope and mg cos θ into it. Compare what is pushing it along the slope with the most static friction can give, μ<sub>s</sub>N.</p>',
        `<p>N = mg cos θ = ${sig(r.N, 3)} N and the most static friction can supply is ${sig(r.fsMax, 3)} N. The net push along the slope before friction is ${sig(r.D, 3)} N.</p>`
      ],
      solution, principle: PRINCIPLE, history: HISTORY,
      applications: { now: sc.now, next: sc.next }, careers: sc.careers, sim: { id: 'ramp-lab' }, given
    };
  }

  /* ======================= The simulation (DOM) ======================= */

  function mount(el, ctx) {
    const h = ADL.h, ui = ADL.ui, css = ADL.charts.css;
    const st = { angle: 20, mass: 5, surface: 'wood', push: 0, comps: true, table: false };
    let r = solve(st), slideT = 0, raf = 0, destroyed = false, capTimer = 0, tilting = 0, colorCache = null, lastSlip = null;

    const sc = ui.scope('Ramp & Friction Lab: a block on a tilted ramp with its free-body diagram');
    sc.tag('Ramp drawn at its true angle');
    const caption = h('p', { class: 'sim-caption', 'aria-live': 'polite' });
    const chart = h('canvas', { class: 'chart', role: 'img', 'aria-label': 'Graph of forces along the slope against ramp angle' });
    const tableBox = h('div', { hidden: true });
    const tableT = ui.toggle({ label: 'Show as table', value: false, onInput: v => { st.table = v; tableBox.hidden = !v; renderTable(); } });
    const graphPanel = ui.panel('Will it slide? Forces along the slope at every angle', chart,
      h('p', null, h('small', null, 'Solid: what pushes the block along the slope before friction (positive = down the slope). Dashed: the most static friction can hold, in either direction. The block stays put wherever the solid line is between the dashed lines. The ring marks your current angle.')),
      tableT.el, tableBox);

    const angSl = ui.slider({ label: 'Ramp angle', min: LIM.angleMin, max: LIM.angleMax, step: 0.5, value: st.angle, unit: '°', digits: 1, onInput: v => { stopTilt(); st.angle = v; changed(); } });
    const mSl = ui.slider({ label: 'Mass of the block', min: LIM.mMin, max: LIM.mMax, step: 0.5, value: st.mass, unit: 'kg', digits: 1, onInput: v => { st.mass = v; changed(); } });
    const sSel = ui.select({ label: 'Surfaces (approximate coefficients)', value: st.surface, options: Object.values(SURFACES).map(sf => ({ value: sf.id, label: `${sf.name}: μs ${sf.ms}, μk ${sf.mk}` })), onInput: v => { stopTilt(); st.surface = v; changed(); } });
    const pSl = ui.slider({ label: 'Your push along the ramp', min: -LIM.pushMax, max: LIM.pushMax, step: 1, value: st.push, unit: 'N', digits: 0, help: 'Positive pushes up the slope; negative pushes down it.', onInput: v => { st.push = v; changed(); } });
    const compT = ui.toggle({ label: 'Show gravity’s parts along and into the ramp', value: st.comps, onInput: v => { st.comps = v; drawScene(); } });
    const releaseBtn = ui.button('Release again', () => { stopTilt(); slideT = 0; play(); });
    const tiltBtn = ui.button('Tilt until it slips', tiltUntilSlip, 'primary');
    const slipOut = h('p', { class: 'note', hidden: true, 'aria-live': 'polite' });
    const ro = ui.readouts([
      { key: 'W', label: 'Weight mg', unit: 'N' }, { key: 'par', label: 'Pull down the slope, mg sin θ', unit: 'N' },
      { key: 'N', label: 'Normal force, N = mg cos θ', unit: 'N' }, { key: 'fs', label: 'Most static friction can hold, μs N', unit: 'N' },
      { key: 'f', label: 'Friction now' }, { key: 'net', label: 'Net force along the slope', unit: 'N' },
      { key: 'a', label: 'Acceleration' }, { key: 'state', label: 'Result' }, { key: 'slip', label: 'Slips without a push at', unit: '°' }
    ]);
    const whatP = h('p'), surfP = h('p');
    el.append(h('div', { class: 'sim' },
      h('div', { class: 'sim-main' }, sc.el, caption, graphPanel),
      h('div', { class: 'sim-side' },
        ui.panel('Controls', angSl.el, mSl.el, sSel.el, pSl.el, compT.el, h('div', { class: 'btn-row' }, tiltBtn, releaseBtn), slipOut),
        ui.panel('Measurements', ro.el),
        ui.panel('What is happening', whatP, surfP,
          h('p', null, h('small', null, 'Arrows in the free-body diagram are drawn to scale: a force twice as big gets an arrow twice as long. Each arrow is also labeled with its name and size.'))))));

    function changed() {
      r = solve(st); slideT = 0;
      updateReadouts(); updateWhat(); drawChart(); if (st.table) renderTable(); scheduleCaption(); play();
    }
    const stateText = x => x.state === 'rest' ? 'stays put' : x.state === 'down' ? 'slides down the slope' : 'slides up the slope';
    function updateReadouts() {
      const sf = surf(st.surface);
      ro.set('W', sig(r.W, 3)); ro.set('par', sig(r.par, 3)); ro.set('N', sig(r.N, 3)); ro.set('fs', sig(r.fsMax, 3));
      ro.set('f', r.kind === 'static' ? (Math.abs(r.friction) < 0.005 ? 'static, 0 N (nothing to resist)' : `static, ${sig(Math.abs(r.friction), 3)} N ${r.friction < 0 ? 'up' : 'down'} the slope`) : `kinetic, ${sig(r.fk, 3)} N ${r.state === 'down' ? 'up' : 'down'} the slope`);
      ro.set('net', sig(r.net, 3)); ro.set('a', r.state === 'rest' ? '0 m/s²' : `${sig(Math.abs(r.a), 3)} m/s² ${r.state === 'down' ? 'down' : 'up'} the slope`);
      ro.set('state', r.state === 'rest' ? 'Stays put' : r.state === 'down' ? `Slides down: 1 m in ${sig(r.tSlide, 2)} s` : `Slides up: 1 m in ${sig(r.tSlide, 2)} s`);
      ro.set('slip', `${sig(slipAngle(st.surface), 3)} (tan θ = μs = ${sf.ms})`);
    }
    function updateWhat() {
      const sf = surf(st.surface);
      whatP.innerHTML = r.state === 'rest'
        ? `<strong>Holding.</strong> Static friction is supplying ${sig(Math.abs(r.friction), 3)} N, just what is needed to cancel the other forces along the slope. It could give up to ${sig(r.fsMax, 3)} N, so the block stays put. Static friction is a “just enough” force: it is not always μ<sub>s</sub>N.`
        : `<strong>Sliding.</strong> The forces along the slope (${sig(Math.abs(r.D), 3)} N) beat the most static friction can give (${sig(r.fsMax, 3)} N). Now kinetic friction, a smaller ${sig(r.fk, 3)} N, opposes the motion, leaving a net ${sig(Math.abs(r.net), 3)} N to accelerate ${st.mass} kg at ${sig(Math.abs(r.a), 3)} m/s².`;
      surfP.textContent = `${sf.name}: ${sf.note} Without a push, the mass cancels out: every block on this surface starts to slip at the same angle.`;
    }
    function captionText() {
      return `A ${st.mass} kg block on a ${st.angle}° ramp, ${surf(st.surface).name.toLowerCase()}${st.push ? `, pushed ${Math.abs(st.push)} N ${st.push > 0 ? 'up' : 'down'} the slope` : ''}: it ${stateText(r)}` +
        (r.state === 'rest' ? `. Static friction supplies ${sig(Math.abs(r.friction), 3)} N of a possible ${sig(r.fsMax, 3)} N.` : ` with an acceleration of ${sig(Math.abs(r.a), 3)} m/s².`) +
        ` Normal force ${sig(r.N, 3)} N.`;
    }
    function scheduleCaption() { clearTimeout(capTimer); capTimer = setTimeout(() => { if (!destroyed) caption.textContent = captionText(); }, 300); }

    /* ---- the tilt experiment ---- */
    function tiltUntilSlip() {
      stopTilt();
      const found = findSlip(st);
      if (!found) { ui.toast('It holds even at 60°. Try a more slippery surface or push it.'); return; }
      const report = () => {
        lastSlip = found;
        slipOut.hidden = false;
        slipOut.textContent = st.push
          ? `It started to ${found.state === 'down' ? 'slide down' : 'slide up'} at ${sig(found.angle, 3)}°. With a push the angle is no longer just tan⁻¹ μs: set the push to 0 to measure friction.`
          : `It started to slip at ${sig(found.angle, 3)}°. tan ${sig(found.angle, 3)}° = ${sig(Math.tan(rad(found.angle)), 3)}, so μs ≈ ${sig(Math.tan(rad(found.angle)), 2)}. The handbook value used here is ${surf(st.surface).ms}.`;
        ctx.announce(slipOut.textContent);
      };
      if (ctx.reducedMotion() || found.angle - st.angle < 0.6) { st.angle = Math.min(LIM.angleMax, Math.ceil(found.angle * 2) / 2); angSl.set(st.angle, true); changed(); report(); return; }
      let last = performance.now();
      const step = now => {
        if (destroyed) return;
        if (now - last > 90) {
          last = now;
          const next = Math.min(LIM.angleMax, +(st.angle + 0.5).toFixed(1));
          st.angle = next; angSl.set(next, true); r = solve(st); slideT = 0; updateReadouts(); updateWhat(); drawChart(); drawScene();
          if (r.state !== 'rest' || next >= LIM.angleMax) { tilting = 0; changed(); report(); return; }
        }
        tilting = requestAnimationFrame(step);
      };
      tilting = requestAnimationFrame(step);
    }
    function stopTilt() { if (tilting) cancelAnimationFrame(tilting); tilting = 0; }

    /* ---- chart and table ---- */
    function drawChart() {
      if (destroyed) return;
      const cv = curves(st);
      const ymax = Math.max(5, ...cv.map(p => Math.max(Math.abs(p.D), p.fsMax))) * 1.1;
      const series = [
        { kind: 'line', color: '--chart-1', width: 2.5, label: 'Push along slope', data: cv.map(p => [p.a, p.D]) },
        { kind: 'line', color: '--chart-2', width: 1.8, dash: [6, 4], label: 'Static friction limit ±μs N', data: cv.map(p => [p.a, p.fsMax]) },
        { kind: 'line', color: '--chart-2', width: 1.8, dash: [6, 4], data: cv.map(p => [p.a, -p.fsMax]) },
        { kind: 'points', shape: 'circle', hollow: true, color: '--ink', size: 5.5, data: [[st.angle, r.D]] }
      ];
      const slip = findSlip(Object.assign({}, st, { angle: 0 }));
      ADL.charts.plot(chart, {
        x: { min: 0, max: 60, label: 'Ramp angle (°)', ticks: [0, 10, 20, 30, 40, 50, 60] }, y: { min: -ymax, max: ymax, label: 'Force along slope (N)' }, series,
        vlines: slip ? [{ x: slip.angle, color: '--chart-3', label: `slides from ${sig(slip.angle, 3)}°` }] : []
      });
      chart.setAttribute('aria-label', `Forces along the slope from 0 to 60 degrees. ${slip ? `The block first slides at ${sig(slip.angle, 3)} degrees.` : 'The block never slides in this range.'} The current angle, ${st.angle} degrees, is marked.`);
    }
    function renderTable() {
      tableBox.replaceChildren();
      const rows = [];
      for (let a = 0; a <= 60; a += 5) { const x = solve(Object.assign({}, st, { angle: a })); rows.push([a, x.D, x.fsMax, x.state === 'rest' ? 'stays' : x.state === 'down' ? 'slides down' : 'slides up', x.a]); }
      tableBox.append(h('table', { class: 'data-table' },
        h('thead', null, h('tr', null, ['Angle', 'Push along slope (N)', 'μs N (N)', 'Result', 'a (m/s²)'].map(c => h('th', { scope: 'col' }, c)))),
        h('tbody', null, rows.map(x => h('tr', { class: x[0] === Math.round(st.angle / 5) * 5 ? 'changed' : null }, h('th', { scope: 'row' }, `${x[0]}°`), h('td', null, sig(x[1], 3)), h('td', null, sig(x[2], 3)), h('td', null, x[3]), h('td', null, sig(Math.abs(x[4]), 3)))))));
    }

    /* ---- drawing ---- */
    function colors() {
      if (colorCache) return colorCache;
      const font = getComputedStyle(document.documentElement).getPropertyValue('--font-data').trim() || 'ui-monospace, monospace';
      colorCache = { bg: css('--scope-bg'), grid: css('--scope-grid'), ink: css('--scope-ink'), dim: css('--scope-dim'), glow: css('--glow'),
        grav: css('--c-photon'), normal: css('--c-ion'), fric: css('--c-neutron'), push: css('--glow'), vel: css('--c-electron'), net: css('--c-alpha'), wood: css('--scope-brass'), font };
      return colorCache;
    }
    function text(g, s, x, y, color, align, size, weight) {
      g.fillStyle = color; g.textAlign = align || 'left'; g.textBaseline = 'middle'; g.font = `${weight || ''} ${size || 12}px ${colors().font}`.trim(); g.fillText(s, x, y);
    }
    function arrow(g, x0, y0, dx, dy, color, w, dash) {
      const L = Math.hypot(dx, dy);
      if (L < 3) return;
      const ux = dx / L, uy = dy / L, hd = Math.min(10, L * 0.4), x1 = x0 + dx, y1 = y0 + dy;
      g.strokeStyle = color; g.fillStyle = color; g.lineWidth = w || 2.5; g.setLineDash(dash || []);
      g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1 - ux * hd * 0.7, y1 - uy * hd * 0.7); g.stroke(); g.setLineDash([]);
      g.beginPath(); g.moveTo(x1, y1); g.lineTo(x1 - ux * hd - uy * hd * 0.55, y1 - uy * hd + ux * hd * 0.55); g.lineTo(x1 - ux * hd + uy * hd * 0.55, y1 - uy * hd - ux * hd * 0.55); g.closePath(); g.fill();
    }

    function drawScene() {
      if (destroyed) return;
      const { ctx: g, w, h: H } = ui.fit(sc.canvas);
      const c = colors(), compact = w < 560, th = rad(st.angle);
      g.fillStyle = c.bg; g.fillRect(0, 0, w, H);
      // ramp: high end at the left, bottom end at the right
      const base = { x: w * (compact ? 0.56 : 0.6), y: H - 30 };
      const Lpx = Math.min(w * (compact ? 0.5 : 0.52) / Math.max(0.2, Math.cos(th)), (H - 70) / Math.max(1e-3, Math.sin(th)), w * 0.6);
      const top = { x: base.x - Lpx * Math.cos(th), y: base.y - Lpx * Math.sin(th) };
      g.fillStyle = c.grid; g.beginPath(); g.moveTo(top.x, top.y); g.lineTo(base.x, base.y); g.lineTo(top.x, base.y); g.closePath(); g.fill();
      g.strokeStyle = c.wood; g.lineWidth = 3; g.beginPath(); g.moveTo(top.x, top.y); g.lineTo(base.x, base.y); g.stroke();
      g.strokeStyle = c.dim; g.lineWidth = 1.5; g.beginPath(); g.moveTo(8, base.y); g.lineTo(w * 0.66, base.y); g.stroke();
      if (st.angle > 0.4) {   // angle marker at the bottom end
        g.strokeStyle = c.dim; g.lineWidth = 1; g.beginPath(); g.arc(base.x, base.y, 34, Math.PI, Math.PI + th); g.stroke();
        text(g, `${st.angle}°`, base.x - 44, base.y - 10, c.ink, 'right', 13, '600');
      }
      text(g, surf(st.surface).name, top.x + 4, base.y + 16, c.dim);
      // block position along the ramp
      const d = { x: Math.cos(th), y: Math.sin(th) };            // down-slope unit vector on screen
      const n = { x: Math.sin(th), y: -Math.cos(th) };           // outward surface normal
      const bs = clamp(Lpx * 0.13, 22, 44);
      const edge = bs / 2 / Lpx, pos = clamp(positionAt(r, slideT) / RAMP_LENGTH, edge, 1 - edge);   // 0 = bottom, 1 = top; keep the block on the ramp
      const px = base.x - d.x * Lpx * pos, py = base.y - d.y * Lpx * pos;
      const cx = px + n.x * bs / 2, cy = py + n.y * bs / 2;
      g.save(); g.translate(cx, cy); g.rotate(th);
      g.fillStyle = c.net; g.globalAlpha = 0.85; g.fillRect(-bs / 2, -bs / 2, bs, bs); g.globalAlpha = 1;
      g.strokeStyle = c.bg; g.lineWidth = 1.5; g.strokeRect(-bs / 2, -bs / 2, bs, bs);
      g.restore();
      text(g, bs < 36 ? `${st.mass}` : `${st.mass} kg`, cx, cy, c.bg, 'center', 12, '700');
      if (r.state !== 'rest') {
        const sgn = r.state === 'down' ? 1 : -1, len = 26 + Math.min(40, Math.abs(r.a) * 6);
        arrow(g, cx + sgn * d.x * (bs * 0.7), cy + sgn * d.y * (bs * 0.7) + n.y * bs * 0.9, sgn * d.x * len, sgn * d.y * len, c.vel, 2.5);
        text(g, `a = ${sig(Math.abs(r.a), 2)} m/s²`, cx + n.x * bs * 1.6, cy + n.y * bs * 1.6 - 4, c.vel, 'center');
      } else text(g, 'at rest', cx + n.x * bs * 1.3, cy + n.y * bs * 1.3 - 6, c.dim, 'center');
      drawFbd(g, c, w, H, compact, th, d, n);
    }

    // Free-body diagram in the upper right, forces to scale
    function drawFbd(g, c, w, H, compact, th, d, n) {
      const box = compact ? { x: w * 0.5, y: 4, w: w * 0.5 - 4, h: H * 0.72 } : { x: w * 0.64, y: 6, w: w * 0.36 - 8, h: H - 12 };
      g.fillStyle = c.bg; g.globalAlpha = 0.9; g.fillRect(box.x, box.y, box.w, box.h); g.globalAlpha = 1;
      g.strokeStyle = c.grid; g.lineWidth = 1; g.strokeRect(box.x + 0.5, box.y + 0.5, box.w - 1, box.h - 1);
      text(g, compact ? 'Forces (N)' : 'Free-body diagram', box.x + 8, box.y + 12, c.ink, 'left', 12, '600');
      const ox = box.x + box.w / 2, oy = box.y + box.h * 0.52;
      const forces = [
        { name: 'gravity', short: 'mg', v: r.W, dx: 0, dy: 1, color: c.grav },
        { name: 'normal', short: 'N', v: r.N, dx: n.x, dy: n.y, color: c.normal },
        { name: r.kind === 'static' ? 'static friction' : 'kinetic friction', short: 'f', v: Math.abs(r.friction), dx: d.x * Math.sign(r.friction || 0), dy: d.y * Math.sign(r.friction || 0), color: c.fric },
        { name: 'push', short: 'push', v: Math.abs(st.push), dx: -d.x * Math.sign(st.push), dy: -d.y * Math.sign(st.push), color: c.push }
      ];
      const fmax = Math.max(...forces.map(f => f.v), 1e-6), R = Math.min(box.w, box.h) * (compact ? 0.36 : 0.38);
      const k = R / fmax;
      if (st.comps && st.angle > 0.4) {
        arrow(g, ox, oy, d.x * r.par * k, d.y * r.par * k, c.grav, 1.5, [5, 4]);
        arrow(g, ox, oy, -n.x * r.N * k, -n.y * r.N * k, c.grav, 1.5, [5, 4]);
        if (!compact) {
          text(g, 'mg sin θ', ox + d.x * r.par * k + 4, oy + d.y * r.par * k + 10, c.grav);
          text(g, 'mg cos θ', ox - n.x * r.N * k - 4, oy - n.y * r.N * k + 10, c.grav, 'right');
        }
      }
      g.fillStyle = c.net; g.beginPath(); g.arc(ox, oy, 5, 0, 2 * Math.PI); g.fill();
      for (const f of forces) {
        if (f.v < fmax * 0.015) continue;
        const L = f.v * k;
        arrow(g, ox, oy, f.dx * L, f.dy * L, f.color, 2.5);
        const lx = ox + f.dx * (L + 12), ly = oy + f.dy * (L + 12);
        const align = f.dx > 0.3 ? 'left' : f.dx < -0.3 ? 'right' : 'center';
        text(g, compact ? `${f.short} ${sig(f.v, 2)}` : `${f.name} ${sig(f.v, 3)} N`, clamp(lx, box.x + 4, box.x + box.w - 4), clamp(ly, box.y + 24, box.y + box.h - 8), f.color, align);
      }
    }

    /* ---- sliding animation ---- */
    function play() {
      cancelAnimationFrame(raf); raf = 0;
      if (r.state === 'rest' || ctx.reducedMotion()) { slideT = 0; drawScene(); return; }
      const tEnd = Math.sqrt(2 * (r.state === 'down' ? START : RAMP_LENGTH - START) / Math.abs(r.a));
      let t0 = null;
      const frame = now => {
        if (destroyed) return;
        if (t0 === null) t0 = now;
        slideT = Math.min(tEnd, (now - t0) / 1000);
        drawScene();
        raf = slideT < tEnd ? requestAnimationFrame(frame) : 0;
      };
      raf = requestAnimationFrame(frame);
    }

    const resizeObs = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(() => { if (!destroyed) { drawScene(); drawChart(); } }) : null;
    if (resizeObs) { resizeObs.observe(sc.canvas); resizeObs.observe(chart); }
    changed();
    caption.textContent = captionText();

    return {
      destroy() { destroyed = true; cancelAnimationFrame(raf); stopTilt(); clearTimeout(capTimer); if (resizeObs) resizeObs.disconnect(); },
      getState() { return { angle: st.angle, mass: st.mass, surface: st.surface, push: st.push, lastSlip: lastSlip ? lastSlip.angle : null }; }
    };
  }

<script>/* js/sims/spring-lab.js */
/* Physics Discovery Lab · Spring & Pendulum Lab (simulation)
   Two oscillators. A mass on a spring obeys Hooke's law, F = −kx; a pendulum's bob is
   pulled back toward the bottom by gravity, with the exact restoring term −(g/L) sin θ (no
   small-angle shortcut), so wide swings really do take longer. Both are integrated step by
   step (RK4), with optional damping proportional to speed. Energy bars show where the
   energy is at each instant. The model and problem code is DOM-free and exported for Node. */
(function (root) {
  'use strict';
  const ADL = root.ADL = root.ADL || {};

  /* ======================= Model (pure, DOM-free) ======================= */

  const G = (ADL.physics && ADL.physics.C && ADL.physics.C.g) || 9.80665;
  const LIM = Object.freeze({
    k: [5, 200], m: [0.1, 5], A: [0.02, 0.30], bS: [0, 3],
    L: [0.1, 3], mp: [0.05, 5], th: [2, 170], bP: [0, 0.5]
  });
  const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  /* p: spring {k, m, A, b} (A in m) or pendulum {L, m, theta0, b} (theta0 in degrees) */
  function accel(mode, p, x, v) {
    return mode === 'pendulum' ? -(G / p.L) * Math.sin(x) - (p.b / p.m) * v : -(p.k / p.m) * x - (p.b / p.m) * v;
  }
  function rk4(mode, p, x, v, dt) {
    const a1 = accel(mode, p, x, v);
    const a2 = accel(mode, p, x + v * dt / 2, v + a1 * dt / 2);
    const a3 = accel(mode, p, x + (v + a1 * dt / 2) * dt / 2, v + a2 * dt / 2);
    const a4 = accel(mode, p, x + (v + a2 * dt / 2) * dt, v + a3 * dt);
    return [x + dt * (v + dt / 6 * (a1 + a2 + a3)), v + dt / 6 * (a1 + 2 * a2 + 2 * a3 + a4)];
  }
  const startX = (mode, p) => mode === 'pendulum' ? rad(p.theta0) : p.A;
  function energies(mode, p, x, v) {
    return mode === 'pendulum'
      ? { ke: 0.5 * p.m * p.L * p.L * v * v, pe: p.m * G * p.L * (1 - Math.cos(x)) }

  }
  const releaseEnergy = (mode, p) => energies(mode, p, startX(mode, p), 0).pe;
  // Time step small enough for any setting in range
  const stepFor = (mode, p) => Math.min(0.002, (mode === 'pendulum' ? smallAnglePeriod(p.L) : springPeriod(p.m, p.k)) / 400);
  function simulate(mode, p, tEnd, dt) {
    dt = dt || stepFor(mode, p);
    let x = startX(mode, p), v = 0, t = 0;
    const out = [[0, x, v]], every = Math.max(1, Math.round(0.01 / dt));
    for (let i = 1; t < tEnd - 1e-12; i++) { [x, v] = rk4(mode, p, x, v, dt); t = i * dt; if (i % every === 0) out.push([t, x, v]); }
    return out;
  }
  // Times when the motion passes the middle heading toward negative x (once per cycle)
  function crossings(samples) {
    const out = [];
    for (let i = 1; i < samples.length; i++) {
      const [t0, x0] = samples[i - 1], [t1, x1] = samples[i];
      if (x0 > 0 && x1 <= 0) out.push(t0 + (t1 - t0) * x0 / (x0 - x1));
    }
    return out;
  }
  function measuredPeriod(samples) {
    const c = crossings(samples);
    if (c.length < 2) return null;
    return (c[c.length - 1] - c[0]) / (c.length - 1);
  }
  const springPeriod = (m, k) => 2 * Math.PI * Math.sqrt(m / k);
  const smallAnglePeriod = L => 2 * Math.PI * Math.sqrt(L / G);
  // Exact period of an undamped pendulum: T = 4√(L/g) K(sin(θ0/2)), with K from the arithmetic–geometric mean
  function exactPendulumPeriod(L, theta0deg) {
    const k = Math.sin(rad(theta0deg) / 2);
    let a = 1, b = Math.sqrt(1 - k * k);
    for (let i = 0; i < 30 && Math.abs(a - b) > 1e-15; i++) { const an = (a + b) / 2; b = Math.sqrt(a * b); a = an; }

  const maxSpeed = (mode, p) => mode === 'pendulum' ? Math.sqrt(2 * G * p.L * (1 - Math.cos(rad(p.theta0)))) : p.A * Math.sqrt(p.k / p.m);

  /* ======================= Practice problems (pure) ======================= */

  const LETTERS = 'abcdefgh';
  const g81 = 9.81;
  const pick = (rng, arr) => arr[Math.min(arr.length - 1, Math.floor(rng.uniform() * arr.length))];
  function choice(rng, correct, wrong) {
    const opts = [correct].concat(wrong);
    for (let i = opts.length - 1; i > 0; i--) { const j = Math.floor(rng.uniform() * (i + 1)); const t = opts[i]; opts[i] = opts[j]; opts[j] = t; }

    if (v === 0) return '0';
    const r = Number(v.toPrecision(n)), p = Math.floor(Math.log10(Math.abs(r)));
    return r.toFixed(Math.max(0, n - 1 - p)).replace('-', '−');
  }
  const r2 = (v, d) => Math.round(v * Math.pow(10, d)) / Math.pow(10, d);
  function normState(s) {
    s = s || {};
    return {
      mode: s.mode === 'pendulum' ? 'pendulum' : 'spring',
      k: Math.round(clamp(+s.k || 20, LIM.k[0], LIM.k[1])), m: r2(clamp(+s.m || 0.5, LIM.m[0], LIM.m[1]), 1), A: r2(clamp(+s.A || 0.1, LIM.A[0], LIM.A[1]), 2), bS: r2(clamp(+s.bS || 0, LIM.bS[0], LIM.bS[1]), 2),

    };
  }

  const SPRING_PRINCIPLE = {
    name: 'Hooke’s law and simple harmonic motion',
    text: '<p>A spring pulls back with a force proportional to how far it is stretched or squeezed, F = −kx. That makes a mass on the spring oscillate with period T = 2π√(m/k), the same for small and large swings. Energy trades back and forth between motion (½mv²) and the spring (½kx²).</p>'
  };
  const SPRING_HISTORY = {
    year: '1678', who: 'Robert Hooke',
    text: '<p>Robert Hooke published his law of springs in 1678 in <em>Lectures de Potentia Restitutiva, or of Spring</em>. Two years earlier he had announced it as a scrambled Latin anagram, “ceiiinosssttuv”, which unscrambles to <em>ut tensio, sic vis</em>: as the extension, so the force. He tested it on coiled springs, long wires and wooden beams. Hooke also proposed using a spring to regulate a watch; Christiaan Huygens built a spring-balance watch in 1675, and the two argued over who had the idea first.</p>'
  };
  const PEND_PRINCIPLE = {
    name: 'The pendulum: period from length and gravity',
    text: '<p>For small swings a pendulum’s period is T = 2π√(L/g). It depends on the length and on gravity, but not on the bob’s mass, and only slightly on how wide it swings: a 20° swing takes about 0.8% longer than a tiny one, a 90° swing about 18% longer. Energy trades between motion (½mv²) and height (mgh).</p>'
  };
  const PEND_HISTORY = {
    year: '1638; 1656', who: 'Galileo Galilei; Christiaan Huygens',
    text: '<p>In <em>Two New Sciences</em> (1638) Galileo reported that a pendulum’s swing time grows with the square root of its length and hardly depends on the bob’s weight or on the width of the swing. Christiaan Huygens built the first pendulum clock in 1656, improving the best clocks from errors of around 15 minutes a day to around 15 seconds. In 1673 he published the period formula and proved that wide swings take slightly longer, which is why good clocks swing through small arcs.</p>'
  };

  function springProblem(s, rng, college) {
    const T = springPeriod(s.m, s.k), vmax = s.A * Math.sqrt(s.k / s.m);
    const M = pick(rng, [300, 350, 400, 450]), K = pick(rng, [20000, 25000, 30000, 35000]);
    const f = Math.sqrt(K / M) / (2 * Math.PI);
    const ch = choice(rng, 'It goes down: more mass on the same springs bounces more slowly', ['It goes up: the springs are squeezed harder, so they push back faster', 'It stays the same: a spring’s frequency depends only on the spring']);
    const parts = [
      { prompt: `<p><strong>In your lab.</strong> A ${s.m} kg mass on a frictionless track is attached to a spring with k = ${s.k} N/m. Ignoring damping, what is its period?</p>`, type: 'number', answer: T, unit: 's', tol: 0.02, digits: 3 },
      { prompt: `<p>You pull it ${sig(s.A * 100, 2)} cm from equilibrium and let go. What is its greatest speed?</p>`, type: 'number', answer: vmax, unit: 'm/s', tol: 0.02, digits: 3 },
      { prompt: `<p>At one corner of a car, about ${M} kg rests on a suspension spring with an effective spring constant of ${K.toLocaleString('en-US')} N/m. At what frequency does that corner bounce after a bump, ignoring the shock absorber?</p>`, type: 'number', answer: f, unit: 'Hz', tol: 0.02, digits: 3 },

      extra = `<p><strong>(e)</strong> Rearranging f = (1/2π)√(k/m):</p><div class="eq">k = m(2πf)² = ${M} kg × (2π × 1.2 Hz)² = ${sig(Kt, 3)} N/m</div>`;
    }
    parts.forEach((p, i) => { p.id = LETTERS[i]; });
    return {
      templateId: 'spring-lab-suspension', topic: 'oscillations', title: 'Why cars bounce at about one beat per second', fields: ['transport', 'engineering'],
      context: '<p>Every car rides on springs. Hit a bump and each corner bobs up and down like a mass on a spring until the shock absorbers (dampers) calm it. Engineers tune the springs so the bounce is slow enough to feel smooth, but not so slow that the car wallows like a boat. Part (a) uses the numbers from your Spring & Pendulum Lab setup.</p>',
      parts,
      hints: [
        '<p>A mass on a spring has a period set by the mass and the spring constant only. A stiffer spring is faster; a heavier mass is slower.</p>',
        '<p>Use T = 2π√(m/k) and f = 1/T. For the greatest speed, all the stored energy ½kA² becomes kinetic energy ½mv² at the middle, so v<sub>max</sub> = A√(k/m).</p>',
        `<p>√(k/m) for your lab spring is ${sig(Math.sqrt(s.k / s.m), 3)} per second. For the car, √(K/M) = ${sig(Math.sqrt(K / M), 3)} per second; divide by 2π for the frequency.</p>`
      ],
      solution:
        `<p><strong>(a)</strong></p><div class="eq">T = 2π√(m/k) = 2π√(${s.m} kg ÷ ${s.k} N/m) = ${sig(T, 3)} s</div>` +
        `<p><strong>(b)</strong> Energy stored at the end of the swing becomes motion at the middle: ½kA² = ½mv², so</p><div class="eq">v<sub>max</sub> = A√(k/m) = ${sig(s.A, 2)} m × ${sig(Math.sqrt(s.k / s.m), 3)} s⁻¹ = ${sig(vmax, 3)} m/s</div>` +
        `<p><strong>(c)</strong></p><div class="eq">f = (1/2π)√(k/m) = (1/2π)√(${K} N/m ÷ ${M} kg) = ${sig(f, 3)} Hz</div><p>About ${sig(f, 2)} bounces a second, close to the range of 1 to 1.5 Hz that many passenger cars are designed for.</p>` +
        `<p><strong>(d)</strong> ${ch.options[ch.answer]}. f ∝ 1/√m, so a heavier car on the same springs bounces more slowly.</p>` + extra,
      principle: SPRING_PRINCIPLE, history: SPRING_HISTORY,
      applications: {
        now: '<p>Car and bike suspensions, the tiny silicon springs and masses inside every phone’s accelerometer, and seismometers that record earthquakes are all spring–mass oscillators. Tall buildings such as Taipei 101 add huge tuned masses that sway against the wind to cut the motion people feel.</p>',
        next: '<p>Active suspensions that read the road ahead with cameras and adjust each corner before the bump are reaching production cars. Researchers are also building tiny vibrating harvesters that turn the shaking of machines and bridges into electricity for wireless sensors.</p>'

  function pendulumProblem(s, rng, college) {

      ? { prompt: '<p>In 1851 Léon Foucault hung a 28 kg bob on a 67 m wire from the dome of the Panthéon in Paris. What was its period for small swings?</p>', answer: 2 * Math.PI * Math.sqrt(67 / g81), unit: 's', given: { L2: 67 } }
      : { prompt: '<p>A “seconds pendulum” takes exactly one second for each swing from one side to the other, so its full period is 2.000 s. How long must it be? (Treat it as a simple pendulum.)</p>', answer: g81 * Math.pow(2 / (2 * Math.PI), 2), unit: 'm', given: { T2: 2 } };

      { prompt: `<p><strong>In your lab.</strong> Your pendulum is ${s.L} m long. Using the small-angle formula and g = 9.81 m/s², what is its period?</p>`, type: 'number', answer: T0, unit: 's', tol: 0.02, digits: 3 },
      { prompt: `<p>You release the bob from rest at ${s.theta0}° from vertical. Ignoring air resistance, how fast is it moving at the bottom of the swing?</p>`, type: 'number', answer: vmax, unit: 'm/s', tol: 0.02, digits: 3 },
      { prompt: real.prompt, type: 'number', answer: real.answer, unit: real.unit, tol: 0.02, digits: 3 },
      { prompt: '<p>If you replaced the bob with one twice as heavy, same size and same string, what would happen to the period?</p>', type: 'choice', options: ch.options, answer: ch.answer }
    ];
    const given = Object.assign({ mode: 'pendulum', L: s.L, theta0: s.theta0, scene, g: g81 }, real.given);
    let extra = '';

    }
    parts.forEach((p, i) => { p.id = LETTERS[i]; });
    const realSol = scene === 'foucault'
      ? `<div class="eq">T = 2π√(67 m ÷ 9.81 m/s²) = ${sig(real.answer, 3)} s</div><p>Each swing across took about 8 seconds. Over hours, visitors watched the swing’s direction slowly turn: the floor, with the Earth, was rotating underneath it.</p>`
      : `<p>Rearrange T = 2π√(L/g):</p><div class="eq">L = g(T/2π)² = 9.81 × (2.000/2π)² = ${sig(real.answer, 3)} m</div><p>That is why tall “grandfather” clocks are tall: a seconds pendulum is about a metre long.</p>`;
    return {
      templateId: `spring-lab-pendulum-${scene}`, topic: 'oscillations', title: scene === 'foucault' ? 'The pendulum that showed the Earth turning' : 'How long is a clock’s pendulum?',
      fields: scene === 'foucault' ? ['earth', 'space'] : ['tech', 'engineering'],
      context: scene === 'foucault'
        ? '<p>A pendulum keeps swinging in the same plane while the Earth turns beneath it, so over hours its swing seems to rotate. That is the idea behind Foucault’s famous demonstration, repeated in science museums around the world. Parts (a) and (b) use the numbers from your Spring & Pendulum Lab setup.</p>'
        : '<p>For almost 300 years, from the 1650s until quartz clocks in the 1930s, the most accurate clocks in the world were pendulum clocks. Their timekeeping comes from one fact: a pendulum’s period is set by its length and by gravity. Parts (a) and (b) use the numbers from your Spring & Pendulum Lab setup.</p>',

        `<p>For your pendulum, √(L/g) = ${sig(Math.sqrt(s.L / g81), 3)} s and the drop is h = ${s.L} × (1 − cos ${s.theta0}°) = ${sig(s.L * (1 - Math.cos(rad(s.theta0))), 3)} m.</p>`

        `<p><strong>(b)</strong> The bob falls h = L(1 − cos θ<sub>0</sub>) = ${sig(s.L * (1 - Math.cos(rad(s.theta0))), 3)} m. Energy is conserved: mgh = ½mv², and the mass cancels:</p><div class="eq">v = √(2gh) = √(2 × 9.81 × ${sig(s.L * (1 - Math.cos(rad(s.theta0))), 3)}) = ${sig(vmax, 3)} m/s</div>` +
        `<p><strong>(c)</strong></p>${realSol}` +
        `<p><strong>(d)</strong> ${ch.options[ch.answer]}. Gravity’s pull and the bob’s inertia both grow in proportion to the mass, so they cancel, as they do for falling objects.</p>` + extra,

      applications: {
        now: '<p>Taipei 101 hangs a 660-tonne steel ball as a pendulum between its 87th and 92nd floors; it sways against the wind to reduce the building’s motion. Foucault pendulums swing in science museums worldwide, and pendulums still regulate many mechanical clocks.</p>',

      },
      careers: scene === 'foucault' ? ['Geophysicist', 'Science museum educator', 'Structural engineer'] : ['Horologist (clockmaker)', 'Precision instrument engineer', 'Metrologist (measurement scientist)'], given

  function makeProblem(state, rng, level) {
    const s = normState(state), college = level === 'college';
    const p = s.mode === 'pendulum' ? pendulumProblem(s, rng, college) : springProblem(s, rng, college);
    const seed = rng.seed !== undefined ? rng.seed : Math.floor(rng.uniform() * 1e9);
    return Object.assign({ id: `${p.templateId}-${seed}`, level: college ? 'college' : 'hs', sim: { id: 'spring-lab' } }, p);
  }

  /* ======================= The simulation (DOM) ======================= */

  function mount(el, ctx) {

    const sc = ui.scope('Spring & Pendulum Lab: an oscillator with energy bars');
    const caption = h('p', { class: 'sim-caption', 'aria-live': 'polite' });
    const chart = h('canvas', { class: 'chart', role: 'img', 'aria-label': 'Graph of position against time' });
    const tableBox = h('div', { hidden: true });
    const tableT = ui.toggle({ label: 'Show as table', value: false, onInput: v => { st.table = v; tableBox.hidden = !v; renderTable(); } });
    const graphPanel = ui.panel('Position over time', chart, tableT.el, tableBox);
    const graphTitle = graphPanel.querySelector('.panel-title');

    const modeSeg = ui.seg({ label: 'Oscillator', value: st.mode, options: [{ value: 'spring', label: 'Mass on a spring' }, { value: 'pendulum', label: 'Pendulum' }], onInput: v => { st.mode = v; showMode(); restart(); } });
    const kSl = ui.slider({ label: 'Spring constant k', min: LIM.k[0], max: LIM.k[1], step: 1, value: st.k, unit: 'N/m', digits: 0, help: 'How many newtons it takes to stretch the spring 1 m.', onInput: v => { st.k = v; restart(); } });
    const mSl = ui.slider({ label: 'Mass', min: LIM.m[0], max: LIM.m[1], step: 0.1, value: st.m, unit: 'kg', digits: 1, onInput: v => { st.m = v; restart(); } });
    const aSl = ui.slider({ label: 'Pull it out by (amplitude)', min: LIM.A[0] * 100, max: LIM.A[1] * 100, step: 1, value: st.A * 100, unit: 'cm', digits: 0, onInput: v => { st.A = v / 100; restart(); } });
    const bsSl = ui.slider({ label: 'Damping (friction and air)', min: LIM.bS[0], max: LIM.bS[1], step: 0.05, value: st.bS, unit: 'kg/s', digits: 2, help: '0 means no energy is lost at all, which no real spring manages.', onInput: v => { st.bS = v; restart(); } });
    const LSl = ui.slider({ label: 'String length', min: LIM.L[0], max: LIM.L[1], step: 0.05, value: st.L, unit: 'm', digits: 2, help: 'From the pivot to the center of the bob.', onInput: v => { st.L = v; restart(); } });
    const mpSl = ui.slider({ label: 'Bob mass', min: LIM.mp[0], max: LIM.mp[1], step: 0.05, value: st.mp, unit: 'kg', digits: 2, onInput: v => { st.mp = v; restart(); } });
    const thSl = ui.slider({ label: 'Release angle', min: LIM.th[0], max: LIM.th[1], step: 1, value: st.theta0, unit: '°', digits: 0, help: 'From straight down. Above 90° the string would go slack in real life; here it acts like a stiff rod.', onInput: v => { st.theta0 = v; restart(); } });
    const bpSl = ui.slider({ label: 'Damping (air resistance)', min: LIM.bP[0], max: LIM.bP[1], step: 0.01, value: st.bP, unit: 'kg/s', digits: 2, onInput: v => { st.bP = v; restart(); } });
    const ghostT = ui.toggle({ label: 'Compare with the small-angle prediction', value: st.ghost, help: 'A dashed bob that follows T = 2π√(L/g) exactly.', onInput: v => { st.ghost = v; drawScene(); drawChart(true); } });
    const slowT = ui.toggle({ label: 'Slow motion (¼ speed)', value: st.slow, onInput: v => { st.slow = v; } });
    const releaseBtn = ui.button('Release again', restart, 'primary');
    const pauseBtn = ui.button('Pause', () => { paused = !paused; pauseBtn.textContent = paused ? 'Play' : 'Pause'; if (!paused) kick(); });
    const springBox = h('div', null, kSl.el, mSl.el, aSl.el, bsSl.el);
    const pendBox = h('div', null, LSl.el, mpSl.el, thSl.el, bpSl.el, ghostT.el);
    const ro = ui.readouts([
      { key: 'meas', label: 'Period, measured from the motion', unit: 's' }, { key: 'formula', label: 'Period from the formula', unit: 's' },
      { key: 'exact', label: 'Exact period for this swing', unit: 's' }, { key: 'f', label: 'Frequency', unit: 'Hz' },
      { key: 'vmax', label: 'Top speed (no damping)', unit: 'm/s' }, { key: 'E', label: 'Energy at release', unit: 'J' }, { key: 'lost', label: 'Energy lost to damping so far' }
    ]);
    const exactRow = ro.el.querySelectorAll('.readout')[2];
    const whatP = h('p');
    el.append(h('div', { class: 'sim' },
      h('div', { class: 'sim-main' }, sc.el, caption, graphPanel),
      h('div', { class: 'sim-side' },
        ui.panel('Controls', modeSeg.el, springBox, pendBox, slowT.el, h('div', { class: 'btn-row' }, releaseBtn, pauseBtn)),
        ui.panel('Measurements', ro.el),
        ui.panel('What is happening', whatP,
          h('p', null, h('small', null, 'The bars on the right of the picture show where the energy is right now: in motion (kinetic energy, KE), stored in the spring or as height (potential energy, PE), or turned into heat by damping. Their total never changes.'))))));

    function showMode() {
      springBox.hidden = st.mode !== 'spring'; pendBox.hidden = st.mode !== 'pendulum'; exactRow.hidden = st.mode !== 'pendulum';
      graphTitle.textContent = st.mode === 'pendulum' ? 'Angle over time' : 'Position over time';
      sc.tag(st.mode === 'pendulum' ? 'Side view' : 'Top view of a frictionless track');
    }

    /* ---- simulation state ---- */
    function restart() {
      p = params();
      sim = { t: 0, x: startX(st.mode, p), v: 0, trace: [[0, startX(st.mode, p)]], cross: [], dt: stepFor(st.mode, p), E0: releaseEnergy(st.mode, p) };
      if (ctx.reducedMotion()) {   // no animation: compute several cycles at once
        const T = st.mode === 'pendulum' ? exactPendulumPeriod(p.L, p.theta0) : springPeriod(p.m, p.k);
        const tEnd = Math.min(30, Math.max(4 * T, 2));
        const samples = simulate(st.mode, p, tEnd, sim.dt);
        sim.trace = samples.map(s => [s[0], s[1]]); sim.cross = crossings(samples);
        const lastS = samples[samples.length - 1]; sim.t = lastS[0]; sim.x = startX(st.mode, p); sim.v = 0; sim.static = true;
        sim.lostShown = sim.E0 - (() => { const e = energies(st.mode, p, lastS[1], lastS[2]); return e.ke + e.pe; })();
      }
      updateStatic(); drawScene(); drawChart(true); if (st.table) renderTable(); scheduleCaption(); kick();
    }
    function advance(dtReal) {
      const target = sim.t + dtReal * (st.slow ? 0.25 : 1);
      while (sim.t < target - 1e-12) {
        const x0 = sim.x;
        [sim.x, sim.v] = rk4(st.mode, p, sim.x, sim.v, sim.dt);
        sim.t += sim.dt;
        if (x0 > 0 && sim.x <= 0) sim.cross.push(sim.t - sim.dt + sim.dt * x0 / (x0 - sim.x));
      }
      sim.trace.push([sim.t, sim.x]);
      if (sim.trace.length > 2000) sim.trace.splice(0, sim.trace.length - 2000);
      if (sim.cross.length > 40) sim.cross.splice(0, sim.cross.length - 40);
    }
    const measured = () => sim.cross.length >= 2 ? (sim.cross[sim.cross.length - 1] - sim.cross[Math.max(0, sim.cross.length - 6)]) / (Math.min(sim.cross.length, 6) - 1) : null;
    function updateStatic() {
      const pend = st.mode === 'pendulum';
      const Tf = pend ? smallAnglePeriod(p.L) : springPeriod(p.m, p.k);
      ro.set('formula', `${sig(Tf, 3)} (${pend ? '2π√(L/g)' : '2π√(m/k)'})`);
      ro.set('exact', pend ? `${sig(exactPendulumPeriod(p.L, p.theta0), 4)} (${sig(100 * (exactPendulumPeriod(p.L, p.theta0) / Tf - 1), 2)}% longer)` : '—');
      ro.set('f', sig(1 / (pend ? exactPendulumPeriod(p.L, p.theta0) : Tf), 3));
      ro.set('vmax', sig(maxSpeed(st.mode, p), 3)); ro.set('E', sig(sim.E0, 3));
      whatP.innerHTML = pend
        ? `<strong>Pendulum.</strong> Gravity pulls the bob back toward the bottom with a force proportional to sin θ. For small angles sin θ ≈ θ and the period is 2π√(L/g) = ${sig(Tf, 3)} s, whatever the bob’s mass. At ${p.theta0}° the exact period is ${sig(100 * (exactPendulumPeriod(p.L, p.theta0) / Tf - 1), 2)}% longer${st.ghost ? ', so the real bob slowly falls behind the dashed one' : ''}.${overdamped(st.mode, p) ? ' The damping is so strong it never swings through.' : ''}`
        : `<strong>Mass on a spring.</strong> The spring pulls back with F = −kx, so the further it is stretched the harder it pulls. The period 2π√(m/k) = ${sig(Tf, 3)} s does not depend on how far you pull it out.${overdamped(st.mode, p) ? ' With this much damping it creeps back to the middle without ever oscillating (overdamped).' : p.b > 0 ? ` Damping takes energy out, so each swing is smaller, while the period stays almost the same (${sig(dampedPeriod(st.mode, p), 3)} s).` : ''}`;
    }
    function updateLive() {
      const T = measured();
      ro.set('meas', T ? sig(T, 4) : overdamped(st.mode, p) ? 'no oscillation' : 'measuring…');
      const e = energies(st.mode, p, sim.x, sim.v), lost = sim.static ? sim.lostShown : sim.E0 - e.ke - e.pe;
      ro.set('lost', p.b > 0 ? `${sig(Math.max(0, lost), 3)} J (${sig(100 * Math.max(0, lost) / sim.E0, 2)}%)` : '0 J (no damping)');
    }
    function captionText() {
      const pend = st.mode === 'pendulum', T = measured();
      return pend
        ? `A ${p.m} kg bob on a ${p.L} m string, released from ${p.theta0}°${p.b ? ' with air resistance' : ''}. Small-angle formula: ${sig(smallAnglePeriod(p.L), 3)} s per swing cycle; exact for this release: ${sig(exactPendulumPeriod(p.L, p.theta0), 3)} s.${T ? ` Measured so far: ${sig(T, 3)} s.` : ''}`
        : `A ${p.m} kg mass on a spring with k = ${p.k} N/m, pulled out ${sig(p.A * 100, 2)} cm${p.b ? ' with damping' : ''}. Formula period ${sig(springPeriod(p.m, p.k), 3)} s.${T ? ` Measured: ${sig(T, 3)} s.` : ''}`;
    }
    function scheduleCaption() { clearTimeout(capTimer); capTimer = setTimeout(() => { if (!destroyed) caption.textContent = captionText(); }, 400); }

    /* ---- chart and table ---- */
    function drawChart(force) {
      if (destroyed) return;
      const now = performance.now();
      if (!force && now - chartAt < 120) return;
      chartAt = now;
      const pend = st.mode === 'pendulum', conv = pend ? deg : (x => x * 100), win = 10;
      const t1 = Math.max(win, sim.t), t0 = t1 - win;
      const data = sim.trace.filter(q => q[0] >= t0).map(q => [q[0], conv(q[1])]);
      const amp = pend ? p.theta0 : p.A * 100;
      const series = [{ kind: 'line', color: '--chart-1', width: 2.2, label: pend ? 'Angle (°)' : 'Position (cm)', data }];
      if (pend && st.ghost) {
        const w0 = Math.sqrt(G / p.L), gd = [];
        for (let i = 0; i <= 300; i++) { const t = t0 + win * i / 300; if (t <= sim.t + 1e-9) gd.push([t, p.theta0 * Math.cos(w0 * t)]); }
        series.push({ kind: 'line', color: '--chart-3', width: 1.5, dash: [5, 4], label: 'Small-angle prediction', data: gd });
      }
      ADL.charts.plot(chart, { x: { min: t0, max: t1, label: 'Time (s)' }, y: { min: -amp * 1.15, max: amp * 1.15, label: pend ? 'Angle from vertical (°)' : 'Position (cm)' }, series,
        vlines: sim.cross.filter(t => t >= t0).slice(-6).map(t => ({ x: t, color: '--ink-2' })) });
      chart.setAttribute('aria-label', `${pend ? 'Angle' : 'Position'} over the last ${win} seconds. Dashed vertical lines mark each time it passes the middle heading the same way, one per cycle.`);
    }
    function renderTable() {
      tableBox.replaceChildren();
      const c = sim.cross;
      if (c.length < 2) { tableBox.append(h('p', null, h('small', null, 'Period measurements appear after two full cycles.'))); return; }
      const rows = [];
      for (let i = 1; i < c.length; i++) rows.push([i, c[i - 1], c[i] - c[i - 1]]);
      tableBox.append(h('table', { class: 'data-table' },
        h('thead', null, h('tr', null, ['Cycle', 'Started at (s)', 'Period (s)'].map(x => h('th', { scope: 'col' }, x)))),
        h('tbody', null, rows.slice(-12).map(r => h('tr', null, h('th', { scope: 'row' }, String(r[0])), h('td', null, r[1].toFixed(3)), h('td', null, r[2].toFixed(4)))))),
        h('p', null, h('small', null, 'Each cycle is timed between successive passes through the middle in the same direction.')));
    }

    /* ---- drawing ---- */
    function colors() {
      if (colorCache) return colorCache;
      const font = getComputedStyle(document.documentElement).getPropertyValue('--font-data').trim() || 'ui-monospace, monospace';
      colorCache = { bg: css('--scope-bg'), grid: css('--scope-grid'), ink: css('--scope-ink'), dim: css('--scope-dim'), glow: css('--glow'), brass: css('--scope-brass'),
        ke: css('--c-electron'), pe: css('--c-alpha'), heat: css('--c-proton'), bob: css('--c-alpha'), ghost: css('--c-photon'), font };
      return colorCache;
    }
    function text(g, s, x, y, color, align, size, weight) {
      g.fillStyle = color; g.textAlign = align || 'left'; g.textBaseline = 'middle'; g.font = `${weight || ''} ${size || 12}px ${colors().font}`.trim(); g.fillText(s, x, y);
    }
    function drawScene() {
      if (destroyed || !sim) return;
      const { ctx: g, w, h: H } = ui.fit(sc.canvas);
      const c = colors(), compact = w < 560;
      g.fillStyle = c.bg; g.fillRect(0, 0, w, H);
      const barW = compact ? w * 0.34 : w * 0.26, area = { x: 0, w: w - barW - 8 };
      if (st.mode === 'pendulum') drawPendulum(g, c, area, H); else drawSpring(g, c, area, H, compact);
      drawBars(g, c, { x: w - barW - 4, y: 8, w: barW, h: H - 16 }, compact);
      if (sim.static) text(g, compact ? 'Reduced motion: see graph' : 'Reduced motion: the graph below shows the motion', 10, 14, c.dim);
      else text(g, `t = ${sim.t.toFixed(1)} s${st.slow ? ' (slow motion)' : ''}${paused ? ' · paused' : ''}`, 10, 14, c.dim);
    }
    function drawSpring(g, c, area, H, compact) {
      const yTrack = H * 0.62, wallX = 22, eqX = area.x + area.w * 0.48, scale = (area.w * 0.4) / LIM.A[1];
      const bs = Math.max(26, Math.min(56, 26 + Math.cbrt(p.m) * 18));
      const bx = eqX + sim.x * scale;
      g.fillStyle = c.grid; g.fillRect(wallX - 10, yTrack - 70, 10, 90);
      g.strokeStyle = c.dim; g.lineWidth = 2; g.beginPath(); g.moveTo(wallX, yTrack + 1 + bs / 2); g.lineTo(area.x + area.w, yTrack + 1 + bs / 2); g.stroke();
      // scale and equilibrium marks
      for (let cm = -30; cm <= 30; cm += 10) { const x = eqX + cm / 100 * scale; g.strokeStyle = c.dim; g.lineWidth = 1; g.beginPath(); g.moveTo(x, yTrack + bs / 2 + 2); g.lineTo(x, yTrack + bs / 2 + (cm ? 7 : 12)); g.stroke(); if (cm % 20 === 0 || area.w > 500) text(g, cm ? `${cm}` : '0 cm', x, yTrack + bs / 2 + 20, c.dim, 'center'); }
      if (!compact) text(g, 'distance from the relaxed position', eqX, yTrack + bs / 2 + 36, c.dim, 'center');
      g.setLineDash([3, 4]); g.strokeStyle = c.dim; g.beginPath(); g.moveTo(eqX, yTrack - bs); g.lineTo(eqX, yTrack + bs / 2); g.stroke(); g.setLineDash([]);
      // spring zigzag
      const x0 = wallX, x1 = bx - bs / 2, coils = 14, amp = 9;
      g.strokeStyle = c.brass; g.lineWidth = 2; g.beginPath(); g.moveTo(x0, yTrack);
      for (let i = 1; i < coils * 2; i++) g.lineTo(x0 + (x1 - x0) * i / (coils * 2), yTrack + (i % 2 ? -amp : amp));
      g.lineTo(x1, yTrack); g.stroke();
      // block, velocity and force arrows
      g.fillStyle = c.bob; g.fillRect(bx - bs / 2, yTrack - bs / 2, bs, bs);
      text(g, `${p.m} kg`, bx, yTrack, c.bg, 'center', 12, '700');
      const F = -p.k * sim.x, Fmax = p.k * p.A, vmax = maxSpeed('spring', p);
      arrowH(g, bx, yTrack - bs / 2 - 14, sim.v / Math.max(vmax, 1e-9) * 60, c.ke, 'v');
      arrowH(g, bx, yTrack - bs / 2 - 34, F / Math.max(Fmax, 1e-9) * 60, c.pe, 'F = −kx');
    }
    function arrowH(g, x, y, dx, color, label) {
      if (Math.abs(dx) < 3) return;
      g.strokeStyle = color; g.fillStyle = color; g.lineWidth = 2.5;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + dx - Math.sign(dx) * 6, y); g.stroke();
      g.beginPath(); g.moveTo(x + dx, y); g.lineTo(x + dx - Math.sign(dx) * 9, y - 5); g.lineTo(x + dx - Math.sign(dx) * 9, y + 5); g.closePath(); g.fill();
      text(g, label, x + dx + Math.sign(dx) * 5, y, color, dx > 0 ? 'left' : 'right');
    }
    function drawPendulum(g, c, area, H) {
      // fit the whole swing: sideways reach, and the part above the pivot for releases past 90°
      const thm = rad(Math.min(p.theta0, 179)), up = Math.max(0, -Math.cos(thm)), side = Math.sin(Math.min(thm, Math.PI / 2));
      const full = Math.min((H - 64) / (1 + up), (area.w / 2 - 24) / Math.max(0.35, side));
      const Lpx = full * p.L / Math.max(p.L, 1), px = area.x + area.w * 0.5, py = 26 + full * up;
      g.fillStyle = c.grid; g.fillRect(px - 50, py - 10, 100, 8);
      if (st.ghost && !sim.static) text(g, 'dashed bob: small-angle prediction', 10, 32, c.ghost);
      // release arc and vertical reference
      g.setLineDash([3, 4]); g.strokeStyle = c.dim; g.lineWidth = 1; g.beginPath(); g.moveTo(px, py); g.lineTo(px, py + Lpx + 16); g.stroke();
      g.beginPath(); g.arc(px, py, Lpx, Math.PI / 2 - rad(p.theta0), Math.PI / 2 + rad(p.theta0)); g.stroke(); g.setLineDash([]);
      const br = Math.max(7, Math.min(16, 7 + Math.cbrt(p.m) * 6));
      if (st.ghost && !sim.static) {
        const th = rad(p.theta0) * Math.cos(Math.sqrt(G / p.L) * sim.t);
        const gx = px + Math.sin(th) * Lpx, gy = py + Math.cos(th) * Lpx;
        g.setLineDash([4, 3]); g.strokeStyle = c.ghost; g.lineWidth = 1.5; g.beginPath(); g.moveTo(px, py); g.lineTo(gx, gy); g.stroke();
        g.beginPath(); g.arc(gx, gy, br, 0, 2 * Math.PI); g.stroke(); g.setLineDash([]);
      }
      const bx = px + Math.sin(sim.x) * Lpx, by = py + Math.cos(sim.x) * Lpx;
      g.strokeStyle = c.ink; g.lineWidth = 1.5; g.beginPath(); g.moveTo(px, py); g.lineTo(bx, by); g.stroke();
      g.fillStyle = c.bob; g.beginPath(); g.arc(bx, by, br, 0, 2 * Math.PI); g.fill();
      g.fillStyle = c.ink; g.beginPath(); g.arc(px, py, 3, 0, 2 * Math.PI); g.fill();
      text(g, `${p.L} m`, px + 8, py + Lpx * 0.45, c.dim);
      text(g, `${deg(sim.x).toFixed(0)}°`, bx + (bx >= px ? br + 6 : -br - 6), by - br - 4, c.ink, bx >= px ? 'left' : 'right', 13, '600');
      const vmax = maxSpeed('pendulum', p), v = sim.v * p.L;
      if (Math.abs(v) > 0.02 * vmax) {   // velocity arrow along the swing
        const ux = Math.cos(sim.x), uy = -Math.sin(sim.x), L = v / Math.max(vmax, 1e-9) * 50;
        g.strokeStyle = c.ke; g.fillStyle = c.ke; g.lineWidth = 2.5; g.beginPath(); g.moveTo(bx, by); g.lineTo(bx + ux * L, by + uy * L); g.stroke();
        g.beginPath(); g.arc(bx + ux * L, by + uy * L, 3, 0, 2 * Math.PI); g.fill();
        text(g, 'v', bx + ux * (L + Math.sign(L) * 10), by + uy * (L + Math.sign(L) * 10), c.ke, 'center');
      }
    }
    function drawBars(g, c, b, compact) {
      const e = sim.static ? energies(st.mode, p, startX(st.mode, p), 0) : energies(st.mode, p, sim.x, sim.v);
      const lost = sim.static ? 0 : Math.max(0, sim.E0 - e.ke - e.pe);
      const items = compact ? [['KE', e.ke, c.ke], ['PE', e.pe, c.pe], ['Heat', lost, c.heat]] : [['Kinetic', e.ke, c.ke], [st.mode === 'pendulum' ? 'Height' : 'Spring', e.pe, c.pe], ['Heat', lost, c.heat]];

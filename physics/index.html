      if (l.x < X.min || l.x > X.max) continue;
      const x = tx(l.x); ctx.strokeStyle = color(l.color || '--ink-2'); ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, pad.t + ph); ctx.stroke(); ctx.setLineDash([]);
      if (l.label) { ctx.fillStyle = color(l.color || '--ink-2'); ctx.textAlign = x > pad.l + pw * 0.7 ? 'right' : 'left'; ctx.textBaseline = 'top'; ctx.fillText(l.label, x + (ctx.textAlign === 'right' ? -4 : 4), pad.t + 4); }
    }
    // legend
    const items = (spec.series || []).filter(s => s.label);
    if (spec.legend !== false && items.length) {
      let x = pad.l, y = 8; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      for (const s of items) {
        const tw = ctx.measureText(s.label).width + 30;
        if (x + tw > w - 6) { x = pad.l; y += 16; }
        const col = color(s.color); ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.setLineDash(s.dash || []);
        if (s.kind === 'points') { shape(ctx, s.shape, x + 8, y, 4); if (s.hollow) ctx.stroke(); else ctx.fill(); }
        else if (s.kind === 'bars') { ctx.globalAlpha = s.alpha || 0.85; ctx.fillRect(x + 2, y - 5, 12, 10); ctx.globalAlpha = 1; }
        else { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 16, y); ctx.stroke(); }
        ctx.setLineDash([]); ctx.fillStyle = ink; ctx.fillText(s.label, x + 20, y);
        x += tw;
      }
    }
  }

  function wrapText(ctx, text, x, y, maxW, lh) {
    const words = String(text).split(' '), lines = [];
    let line = '';
    for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
    if (line) lines.push(line);
    lines.forEach((l, i) => ctx.fillText(l, x, y + (i - (lines.length - 1) / 2) * lh));
  }

  ADL.charts = { plot, setupCanvas, css, color, linTicks, niceStep, shape, wrapText };
})(window);

</script>
<script>/* js/ui.js */
/* Physics Discovery Lab · shared UI widgets.
   Sliders (with typed entry), selects, segmented buttons, toggles, readouts and panels.
   Chapters, simulations and the problem studio all build their controls from these so
   the whole site looks and behaves the same, including keyboard and screen-reader use. */
(function (root) {
  'use strict';
  const ADL = root.ADL = root.ADL || {};
  const h = (...a) => ADL.h(...a);
  let uid = 0;
  const nextId = p => `${p || 'w'}-${++uid}`;

  function reducedMotion() {
    const pref = ADL.store && ADL.store.state.prefs.motion;
    if (pref === 'on') return true;
    if (pref === 'off') return false;
    return root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  /* Slider + number box. o: {id, label, min, max, step, value, unit, help, log, digits, onInput(v)} */
  function slider(o) {
    const id = o.id || nextId('s');
    const log = !!o.log;
    const toPos = v => log ? Math.round(1000 * (Math.log10(v) - Math.log10(o.min)) / (Math.log10(o.max) - Math.log10(o.min))) : v;
    const fromPos = p => log ? Math.pow(10, Math.log10(o.min) + (p / 1000) * (Math.log10(o.max) - Math.log10(o.min))) : +p;
    const clamp = v => Math.min(o.max, Math.max(o.min, v));
    const snap = v => {
      if (log) { const p = Math.pow(10, Math.floor(Math.log10(v)) - 2); return +(Math.round(v / p) * p).toPrecision(3); }
      const st = o.step || 1; return +(Math.round((v - o.min) / st) * st + o.min).toFixed(10);
    };
    const range = h('input', { type: 'range', id, min: log ? 0 : o.min, max: log ? 1000 : o.max, step: log ? 1 : (o.step || 1), value: toPos(o.value), 'aria-describedby': o.help ? id + '-help' : null });
    const num = h('input', { type: 'number', class: 'num', id: id + '-num', min: o.min, max: o.max, step: log ? 'any' : (o.step || 1), value: o.value, 'aria-label': `${o.label} value${o.unit ? ' in ' + o.unit : ''}` });
    const unit = h('span', { class: 'unit' }, o.unit || '');
    let value = o.value;
    const show = v => { num.value = o.digits !== undefined ? (+v).toFixed(o.digits) : String(+(+v).toPrecision(6)); };
    show(value);
    range.addEventListener('input', () => { value = snap(fromPos(range.value)); show(value); o.onInput && o.onInput(value); });
    num.addEventListener('change', () => {
      const v = parseFloat(num.value);
      if (!isFinite(v)) { show(value); return; }
      value = log ? clamp(v) : clamp(snap(v)); range.value = toPos(value); show(value); o.onInput && o.onInput(value);
    });
    const el = h('div', { class: 'control' },
      h('div', { class: 'control-head' }, h('label', { for: id }, o.label), h('span', { class: 'control-value' }, num, unit)),
      range,
      o.help ? h('p', { class: 'control-help', id: id + '-help' }, o.help) : null);
    return {
      el, input: range,
      get: () => value,
      set(v, silent) { value = clamp(v); range.value = toPos(value); show(value); if (!silent && o.onInput) o.onInput(value); },
      setUnit(u) { unit.textContent = u; },
      setRange(min, max, step) { o.min = min; o.max = max; if (step) o.step = step; range.min = log ? 0 : min; range.max = log ? 1000 : max; if (!log && step) range.step = step; num.min = min; num.max = max; this.set(Math.min(max, Math.max(min, value)), true); }
    };
  }

  /* Native select. o: {id, label, options:[{value,label}], value, help, onInput} */
  function select(o) {
    const id = o.id || nextId('sel');
    const sel = h('select', { class: 'select', id }, o.options.map(op => h('option', { value: op.value }, op.label)));
    sel.value = o.value;
    sel.addEventListener('change', () => o.onInput && o.onInput(sel.value));
    const el = h('div', { class: 'control' }, h('div', { class: 'control-head' }, h('label', { for: id }, o.label)), sel, o.help ? h('p', { class: 'control-help' }, o.help) : null);
    return { el, input: sel, get: () => sel.value, set(v, silent) { sel.value = v; if (!silent && o.onInput) o.onInput(v); } };
  }

  /* Segmented buttons for 2–4 choices. o: {label, options:[{value,label}], value, onInput} */
  function seg(o) {
    let value = o.value;
    const labelId = nextId('seg');
    const btns = o.options.map(op => h('button', { type: 'button', class: 'seg-btn', 'aria-pressed': String(op.value === value), onclick: () => api.set(op.value) }, op.label));
    const el = h('div', { class: 'control' },
      o.label ? h('div', { class: 'control-head' }, h('span', { class: 'control-label', id: labelId }, o.label)) : null,
      h('div', { class: 'seg', role: 'group', 'aria-labelledby': o.label ? labelId : null }, btns),
      o.help ? h('p', { class: 'control-help' }, o.help) : null);
    const api = {
      el, get: () => value,
      set(v, silent) { value = v; o.options.forEach((op, i) => btns[i].setAttribute('aria-pressed', String(op.value === v))); if (!silent && o.onInput) o.onInput(v); }
    };
    return api;
  }

  /* On/off switch. o: {id, label, value, help, onInput} */
  function toggle(o) {
    const id = o.id || nextId('t');
    const box = h('input', { type: 'checkbox', id, class: 'switch-input' });
    box.checked = !!o.value;
    box.addEventListener('change', () => o.onInput && o.onInput(box.checked));
    const el = h('div', { class: 'control control-toggle' },
      h('label', { class: 'switch', for: id }, box, h('span', { class: 'switch-track', 'aria-hidden': 'true' }), h('span', { class: 'switch-label' }, o.label)),
      o.help ? h('p', { class: 'control-help' }, o.help) : null);
    return { el, input: box, get: () => box.checked, set(v, silent) { box.checked = !!v; if (!silent && o.onInput) o.onInput(!!v); } };
  }

  /* Label/value list. items: [{key, label, unit}] */
  function readouts(items) {
    const vals = {};
    const el = h('dl', { class: 'readouts' }, items.map(it => {
      vals[it.key] = h('span', { class: 'readout-num' }, '—');
      return h('div', { class: 'readout' }, h('dt', null, it.label), h('dd', null, vals[it.key], it.unit ? h('span', { class: 'unit' }, ' ' + it.unit) : null));
    }));
    return { el, set(key, text) { if (vals[key]) vals[key].textContent = text; } };
  }

  const panel = (title, ...kids) => h('section', { class: 'sim-panel' }, title ? h('h3', { class: 'panel-title' }, title) : null, ...kids);
  const button = (label, onClick, cls) => h('button', { type: 'button', class: 'btn' + (cls ? ' ' + cls : ''), onclick: onClick }, label);

  /* A dark instrument window holding a canvas. Returns {el, canvas, tag(text)} */
  function scope(label) {
    const canvas = h('canvas', { class: 'scope-canvas', role: 'img', 'aria-label': label || 'Simulation view' });
    const tagEl = h('span', { class: 'scope-tag' });
    const el = h('div', { class: 'scope' }, canvas, tagEl);
    return { el, canvas, tag(t) { tagEl.textContent = t || ''; tagEl.hidden = !t; } };
  }

  /* Size a canvas to its CSS box at device resolution. Returns {ctx, w, h} in CSS pixels. */
  const fit = canvas => ADL.charts.setupCanvas(canvas);

  let liveEl = null;
  function announce(text) {
    if (!liveEl) liveEl = document.getElementById('live');
    if (!liveEl) return;
    liveEl.textContent = '';
    setTimeout(() => { liveEl.textContent = text; }, 30);
  }

  let toastTimer = null;
  function toast(text) {
    let el = document.getElementById('toast');
    if (!el) { el = h('div', { id: 'toast', class: 'toast', role: 'status' }); document.body.append(el); }
    el.textContent = text; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  /* In-page dialog (the artifact viewer blocks alert/confirm). Returns a Promise<boolean>. */
  function confirmDialog(title, body, okLabel, danger) {
    return new Promise(resolve => {
      const close = v => { wrap.remove(); document.removeEventListener('keydown', onKey); if (prev) prev.focus(); resolve(v); };
      const onKey = e => { if (e.key === 'Escape') close(false); };
      const prev = document.activeElement;
      const ok = h('button', { type: 'button', class: 'btn ' + (danger ? 'danger' : 'primary'), onclick: () => close(true) }, okLabel || 'Confirm');
      const wrap = h('div', { class: 'modal-wrap' },
        h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'dlg-t' },
          h('h2', { id: 'dlg-t' }, title), typeof body === 'string' ? h('p', null, body) : body,
          h('div', { class: 'modal-actions' }, h('button', { type: 'button', class: 'btn', onclick: () => close(false) }, 'Cancel'), ok)));
      wrap.addEventListener('click', e => { if (e.target === wrap) close(false); });
      document.addEventListener('keydown', onKey);
      document.body.append(wrap); ok.focus();
    });
  }

  /* Larger in-page sheet for content (exports, how-it-works). Returns close(). */
  function sheet(title, content, opts) {
    const prev = document.activeElement;
    const close = () => { wrap.remove(); document.removeEventListener('keydown', onKey); if (prev && prev.focus) prev.focus(); opts && opts.onClose && opts.onClose(); };
    const onKey = e => { if (e.key === 'Escape') close(); };
    const closeBtn = h('button', { type: 'button', class: 'btn ghost small', onclick: close, 'aria-label': 'Close' }, 'Close');
    const wrap = h('div', { class: 'modal-wrap' },
      h('div', { class: 'modal sheet' + (opts && opts.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
        h('div', { class: 'sheet-head' }, h('h2', null, title), closeBtn), h('div', { class: 'sheet-body' }, content)));
    wrap.addEventListener('click', e => { if (e.target === wrap) close(); });
    document.addEventListener('keydown', onKey);
    document.body.append(wrap); closeBtn.focus();
    return close;
  }

  ADL.ui = { slider, select, seg, toggle, readouts, panel, button, scope, fit, announce, toast, confirmDialog, sheet, reducedMotion, nextId };
})(window);

</script>
<script>/* js/glossary.js */
/* Physics Discovery Lab · glossary and in-text term links.
   Every glossary term that appears in the site's prose becomes a small button that opens its
   definition in a popup. A MutationObserver links text as pages render, so chapters, simulations,
   problems and sheets need no code of their own. The first mention of each term in a paragraph
   is linked; buttons, labels, headings, readouts and equations are left alone. Words with an
   everyday sense ("work", "power", "period", "force") are matched cautiously.
   Inside a campaign chapter that hasn't been solved yet, terms whose definitions would give the
   discovery away (uniform acceleration, the odd-number rule, free-fall acceleration …) stay plain text.
   DOM-free parts (the term list and the matcher) also load in Node for the tests. */
(function (root) {
  'use strict';
  const ADL = root.ADL = root.ADL || {};

  /* [term, definition, options]
     options.also   other spellings and irregular plurals (regular -s/-es plurals match on their own)
     options.match  replaces the term itself as the text to look for
     options.cs     match case exactly (newton, joule and watt the units, not the people)
     options.prev   text just before a match that means a different sense (tested against the preceding 40 characters)
     options.next   text just after a match that means a different sense
     options.near   link only when this also appears within 60 characters on either side (for words like
                    “period” whose physics sense needs context) */
  const OSC_NEAR = /pendul|oscillat|swing|bounc|vibrat|spring|cycle|wave|orbit|frequenc|hertz|\bHz\b|\bT\s*=/i;
  const RAW = {
    science: [
      ['Observation', 'Something seen, counted or measured, which people who disagree about the explanation can still agree on.'],
      ['Inference', 'A conclusion drawn from observations. It goes beyond what was directly seen.'],
      ['Hypothesis', 'A proposed explanation that makes testable predictions.', { also: ['hypotheses'] }],
      ['Prediction', 'A specific statement of what should happen in an experiment if a hypothesis is right, made before the result is known.'],
      ['Model', 'A simplified description (picture, equation or simulation) that captures how something behaves. Every model has limits.'],
      ['Theory', 'A well-tested explanation that ties together many observations. In science, “theory” means strongly supported, not a guess.', { also: ['theories'] }],
      ['Independent variable', 'The setting you deliberately change.'],
      ['Dependent variable', 'The quantity you measure to see the effect.'],
      ['Controlled variable', 'Settings kept the same so a comparison is fair.', { also: ['control variable'] }],
      ['Confounding', 'Changing two things at once, so you can’t tell which one caused the effect.', { also: ['confounded'] }],
      ['Replication', 'Repeating an experiment to see which results are stable and which vary.'],
      ['Uncertainty', 'The range within which the true value probably lies. Repeated timings scatter; their spread shows how far to trust the average.', { also: ['uncertainties'] }]
    ],
    motion: [
      ['Kinematics', 'The description of motion (position, velocity, acceleration and time) without asking what causes it.'],
      ['Distance', 'How far something travels along its path, whatever the direction, in metres (m).'],
      ['Displacement', 'The straight-line change in position from start to finish, with a direction. Walk 3 m east and then 3 m west: distance 6 m, displacement zero.', { next: /^\s+of\s+(?:people|families|residents|communities|workers|refugees)\b/i }],
      ['Speed', 'How fast something moves: distance per unit time, in metres per second (m/s). 1 m/s = 3.6 km/h, about 2.24 mph.'],
      ['Average speed', 'Total distance travelled divided by the total time taken.'],
      ['Instantaneous speed', 'The speed at one moment, which is what a speedometer shows.', { also: ['instantaneous velocity'] }],
      ['Velocity', 'Speed in a particular direction. Two cars at 20 m/s going opposite ways have the same speed but different velocities.', { also: ['velocities'] }],
      ['Acceleration', 'How quickly velocity changes: the change in velocity divided by the time it took, in m/s². Speeding up, slowing down and turning are all accelerations.'],
      ['Deceleration', 'Slowing down: an acceleration that points opposite to the motion.'],
      ['Free fall', 'Motion under gravity alone, with no air resistance or other forces acting. Astronauts in orbit are in free fall too.', { also: ['free-falling', 'falling freely'] }],
      ['Free-fall acceleration (g)', 'The acceleration of a freely falling object near Earth’s surface, about 9.8 m/s² downward and the same for every object regardless of its mass. It varies slightly with latitude and height; the standard value is 9.80665 m/s².', { match: ['free-fall acceleration', 'acceleration due to gravity', 'acceleration of gravity', 'gravitational acceleration'] }],
      ['Uniformly accelerated motion', 'Motion with constant acceleration: the velocity changes by equal amounts in equal times. Starting from rest, the distance then grows with the square of the time, d = ½at².', { also: ['uniform acceleration', 'constant acceleration', 'uniformly accelerated'] }],
      ['Odd-number rule', 'For uniformly accelerated motion from rest, the distances covered in successive equal time intervals go 1 : 3 : 5 : 7 …, the odd numbers.', { also: ['law of odd numbers', 'odd numbers rule'] }],
      ['Mean speed theorem', 'A 14th-century result from Merton College, Oxford: a body accelerating uniformly from rest covers the same distance as one moving steadily at half its final speed for the same time.', { also: ['Merton rule'] }],
      ['Water clock', 'A timer that measures time by how much water flows out of (or into) a container. Galileo weighed the water from a thin jet to time his rolling balls.', { also: ['clepsydra', 'clepsydrae'] }],
      ['Inclined plane', 'A flat surface tilted at an angle to the horizontal: a ramp. Galileo used one to slow motion down enough to time it.', { also: ['incline'] }],
      ['Projectile', 'Anything moving through the air under gravity after it has been thrown, launched or hit: a ball, a javelin, a jet of water.'],
      ['Projectile motion', 'The curved path of a projectile: steady horizontal motion combined with a downward pull of gravity. Without air resistance the path is a parabola.'],
      ['Trajectory', 'The path an object follows through space.', { also: ['trajectories'], prev: /(?:career|growth|economic|political|personal)\s+$/i }],
      ['Parabola', 'A symmetric U-shaped curve. A projectile without air resistance follows an upside-down parabola.', { also: ['parabolas', 'parabolae', 'parabolic'] }],
      ['Horizontal range', 'How far a projectile travels sideways before landing at its launch height. Without air resistance, a 45° launch gives the greatest range.'],
      ['Vector', 'A quantity with both size (magnitude) and direction, such as velocity, force or displacement. Drawn as an arrow.', { prev: /(?:disease|mosquito|insect|attack|viral|infection)\s+$/i }],
      ['Scalar', 'A quantity with size only and no direction, such as mass, time, speed or energy.'],
      ['Component (of a vector)', 'The part of a vector that points along a chosen direction. A ball launched at speed v and angle θ has a horizontal component v cos θ and a vertical component v sin θ.', { match: ['vector component', 'horizontal component', 'vertical component', 'x-component', 'y-component', 'parallel component', 'perpendicular component'] }],
      ['Reference frame', 'The point of view from which motion is measured, such as the ground or a moving train. Speeds and velocities depend on the frame.', { also: ['frame of reference', 'frames of reference'] }],
      ['Reaction time', 'The delay between noticing something and starting to respond: about 0.2–0.3 s for a prepared person, and often 1–1.5 s for a driver surprised by a hazard.'],
      ['Braking distance', 'The distance a vehicle travels while braking to a stop. At the same deceleration it grows with the square of the speed.'],
      ['Stopping distance', 'The distance travelled during the driver’s reaction time plus the braking distance.'],
      ['Air resistance', 'The drag force air exerts on a moving object, pointing opposite to its motion. At everyday speeds it grows roughly with the square of the speed.', { also: ['air drag', 'drag force', 'aerodynamic drag'] }],
      ['Drag coefficient', 'A number describing how streamlined a shape is (lower is more streamlined): about 0.47 for a sphere and 0.25–0.3 for a modern car. Drag force = ½ρC_dAv².', { also: ['coefficient of drag'] }],
      ['Terminal velocity', 'The steady speed reached when air resistance has grown to match the weight, so the net force and the acceleration drop to zero. Roughly 55 m/s (200 km/h) for a skydiver falling belly-down.', { also: ['terminal speed'] }],
      ['Accelerometer', 'A sensor that measures acceleration. Phones contain tiny MEMS accelerometers: a microscopic mass on springs whose movement is sensed electrically.']
    ],
    forces: [
      ['Dynamics', 'The study of how forces cause and change motion.', { prev: /(?:group|family|team|power|social|market|population|class)\s+$/i }],
      ['Force', 'A push or pull on an object, measured in newtons (N). Forces are vectors: direction matters.', { prev: /(?:\bair|\btask|\bpolice|\blabou?r|\bwork|\barmed|\bspecial|\bdefen[cs]e|\bpeace|\bstrike|\bbrute|\bsheer|\bjoin(?:ed|ing|s)?|\bto|\bwill|\bwould|\bcan|\bcould|\bmust|\bin\s+full)\s+$/i, next: /^\s+(?:of\s+(?:habit|nature)|majeure|them|him|her|us|me|you|it)\b/i }],
      ['Net force', 'The total of all the forces on an object, added as vectors. Zero net force means zero acceleration.', { also: ['resultant force', 'unbalanced force'] }],
      ['Balanced forces', 'Forces that add up to zero net force, so the object’s velocity does not change (it may be at rest).'],
      ['Newton (N)', 'The SI unit of force: 1 N = 1 kg·m/s², the force that gives 1 kg an acceleration of 1 m/s². A small apple weighs about 1 N.', { match: ['newton', 'kilonewton', 'meganewton'], cs: true }],
      ['Newton’s first law', 'An object stays at rest, or keeps moving in a straight line at a steady speed, unless a net force acts on it. Also called the law of inertia.', { also: ['first law of motion', 'law of inertia', 'Newton’s first law of motion'] }],
      ['Newton’s second law', 'The net force on an object equals its mass times its acceleration: F = ma. More force, more acceleration; more mass, less.', { also: ['second law of motion', 'Newton’s second law of motion', 'F = ma'] }],
      ['Newton’s third law', 'When one object pushes on another, the second pushes back on the first with a force of the same size in the opposite direction. The two forces act on different objects.', { also: ['third law of motion', 'Newton’s third law of motion', 'action–reaction pair'] }],
      ['Mass', 'How much matter an object contains, which sets its inertia: how hard it is to speed up or slow down. Measured in kilograms; the same on the Moon as on Earth.', { prev: /(?:catholic|sunday|midnight|christmas|easter|requiem|critical|land|air)\s+$/i, next: /^\s+(?:media|production|produced|market|transit|extinction|shooting|migration|grave|protest|murder|number|spectrometer|spectrometry)\b/i }],
      ['Weight', 'The force of gravity on an object: weight = mass × g. A 60 kg person weighs about 590 N on Earth and about 97 N on the Moon.', { next: /^\s+(?:loss|gain|watchers)\b/i }],
      ['Apparent weight', 'What a scale reads: the force supporting you. It is more than your weight while an elevator speeds up going up, and zero in free fall.'],
      ['Weightlessness', 'Having zero apparent weight, as in free fall: in orbit, in a drop tower, or for a moment over the top of a roller-coaster hill.', { also: ['weightless'] }],
      ['Inertia', 'An object’s resistance to changes in its motion. More mass means more inertia.', { prev: /(?:bureaucratic|institutional|political|organizational|organisational|economic)\s+$/i }],
      ['Normal force', 'The push a surface exerts on an object pressed against it, perpendicular (normal) to the surface. On a level floor it usually equals the object’s weight; on a ramp it is smaller.', { also: ['normal reaction'] }],
      ['Friction', 'A force between surfaces in contact that opposes their sliding, or attempted sliding, past each other.', { prev: /(?:political|social|trade|diplomatic)\s+$/i }],
      ['Static friction', 'Friction that holds an object still. It matches the push trying to move the object, up to a maximum of μs × the normal force.'],
      ['Kinetic friction', 'Friction on an object that is already sliding: about μk × the normal force, usually a little less than the maximum static friction.', { also: ['sliding friction'] }],
      ['Coefficient of friction', 'A number (μ) for a pair of surfaces: the friction force divided by the normal force. Roughly 0.7–0.9 for car tires on dry asphalt, 0.4–0.6 on wet asphalt and about 0.1 or less on ice.', { also: ['coefficients of friction', 'friction coefficient'] }],
      ['Tension', 'The pulling force in a stretched rope, cable or string. A light rope pulls equally on whatever is attached at each end.', { prev: /(?:political|racial|rising|nervous|emotional|creative|dramatic|ethnic|social|surface|growing|mounting)\s+$/i, next: /^\s+(?:headaches?|between\s+(?:the\s+)?(?:two\s+)?(?:countries|groups|sides|leaders))\b/i }],
      ['Free-body diagram', 'A sketch of one object on its own, with an arrow for every force acting on it, used to work out the net force.', { also: ['force diagram'] }],
      ['Equilibrium', 'A state of balance: zero net force (and no net turning effect), so the object stays at rest or keeps moving at a steady velocity.', { also: ['equilibria'] }],
      ['Gravity', 'The attraction between masses. Earth’s gravity pulls every object toward Earth’s center; near the surface the pull on each kilogram is about 9.8 N.', { next: /^\s+of\s+(?:the\s+)?(?:situation|crisis|offen[cs]es?|charges?|matter|moment)\b/i }],
      ['Thrust', 'The forward push from an engine, propeller or rocket exhaust.', { next: /^\s+of\s+(?:the|his|her|their|this)\s+(?:argument|story|book|essay|plot|case)\b/i }],
      ['Center of mass', 'The average position of an object’s mass. A thrown hammer spins around its center of mass while that point follows a smooth arc.', { also: ['centre of mass', 'center of gravity', 'centre of gravity'] }],
      ['Spring scale', 'A force meter: a spring that stretches in proportion to the pull, with a scale marked in newtons.', { also: ['force meter', 'spring balance'] }]
    ],
    energy: [
      ['Energy', 'The capacity to do work or cause change, measured in joules (J). It comes in many forms (kinetic, potential, thermal, chemical) and is never created or destroyed, only transferred or transformed.', { prev: /(?:positive|negative|nervous|creative)\s+$/i, next: /^\s+drinks?\b/i }],
      ['Kinetic energy', 'Energy of motion: KE = ½mv². Double the speed and the kinetic energy becomes four times as large.'],
      ['Potential energy', 'Stored energy that depends on position or shape, such as a raised weight or a stretched spring.'],
      ['Gravitational potential energy', 'Energy stored by lifting something against gravity: mgh, for a height h above a chosen reference level.'],
      ['Elastic potential energy', 'Energy stored in a stretched or compressed spring or other elastic object: ½kx².', { also: ['spring potential energy'] }],
      ['Mechanical energy', 'Kinetic energy plus potential energy. Without friction or air resistance it stays the same.'],
      ['Conservation of energy', 'Energy cannot be created or destroyed. In any process the total stays the same; it only moves between objects or changes form.', { also: ['law of conservation of energy', 'energy conservation', 'energy is conserved'] }],
      ['Thermal energy', 'The energy of the random jiggling of a material’s particles. Friction and air resistance turn mechanical energy into thermal energy, warming things slightly.'],
      ['Work (physics)', 'Energy transferred by a force acting through a distance: W = Fd cos θ, in joules. A force that does not move its point of application does no work.', { match: ['work done', 'net work', 'mechanical work'] }],
      ['Work–energy theorem', 'The net work done on an object equals the change in its kinetic energy.', { also: ['work–energy principle'] }],
      ['Joule (J)', 'The SI unit of energy and work: 1 J = 1 N·m, about the energy needed to lift an apple 1 metre.', { match: ['joule', 'kilojoule', 'megajoule'], cs: true }],
      ['Power', 'The rate of transferring energy or doing work: power = energy ÷ time, in watts (W).', { prev: /(?:\bto\s+the|\bin\s+full|\bcame\s+to|\bseiz(?:e|ed|es|ing)|\bpolitical|\bmilitary|\beconomic|\bsoft|\bstaying|\bwill|\bbrain|\bstar|\bfire|\bpurchasing|\bgirl|\bpeople)\s+$/i, next: /^\s+of\s+(?:ten|10|two|three|attorney|the\s+(?:people|press|state))\b|^\s+(?:struggle|couple|nap)\b/i }],
      ['Watt (W)', 'The SI unit of power: 1 W = 1 J/s. Someone climbing stairs briskly produces a few hundred watts.', { match: ['watt', 'kilowatt', 'megawatt', 'gigawatt'], cs: true }],
      ['Kilowatt-hour (kWh)', 'An energy unit used on electricity bills: 1 kWh = 3.6 million joules, the energy a 1,000 W appliance uses in an hour.', { match: ['kilowatt-hour', 'kWh'] }],
      ['Efficiency', 'The fraction of the input energy that ends up as useful output, usually given as a percentage. No real machine reaches 100%.', { also: ['efficiencies'] }]
    ],
    momentum: [
      ['Momentum', 'Mass times velocity (p = mv), in kg·m/s. A vector: direction matters.', { prev: /(?:political|economic|campaign|movement|idea|protest|trend|talks|negotiations|market|team)(?:\s+(?:has|had|have|is|was))?\s+(?:gained|gains|gaining|gain|lost|losing|lose|built|building|builds|picked\s+up|picking\s+up|picks\s+up)\s+$|(?:political|economic|positive|campaign)\s+$/i, next: /^\s+in\s+the\s+polls\b/i }],
      ['Impulse', 'Force × time: the change in momentum it causes. Airbags and crumple zones stretch out the stopping time, so the same change in momentum needs a smaller force.', { prev: /(?:\bon\s+(?:an\s+)?|\bnerve\s+|\bneural\s+|\belectrical\s+|\bsudden\s+|\bfirst\s+)$/i, next: /^\s+(?:buy|buys|buying|purchase|purchases|control|shopping)\b/i }],
      ['Conservation of momentum', 'If no outside force acts, the total momentum of a group of objects stays the same, whatever happens between them.', { also: ['law of conservation of momentum', 'momentum is conserved'] }],
      ['Elastic collision', 'A collision in which the total kinetic energy is the same afterward, as almost happens with steel balls or air-track gliders with spring bumpers.'],
      ['Inelastic collision', 'A collision in which some kinetic energy turns into heat, sound or bent metal. Momentum is still conserved.', { also: ['perfectly inelastic collision'] }]
    ],
    oscillations: [
      ['Oscillation', 'A motion that repeats back and forth, like a swinging pendulum or a bouncing spring.', { also: ['oscillate', 'oscillating', 'oscillator'] }],
      ['Period (of oscillation)', 'The time for one complete back-and-forth cycle, in seconds. Period = 1 ÷ frequency.', { match: ['period'], near: OSC_NEAR, prev: /(?:time|historical|medieval|colonial|trial|grace|waiting|probation|class|the\s+same)\s+$/i, next: /^\s+(?:of\s+(?:history|time|years|months|weeks|days|decline|growth)|drama)\b/i }],
      ['Frequency', 'How many cycles happen each second, in hertz (Hz). Frequency = 1 ÷ period.', { also: ['frequencies'] }],
      ['Hertz (Hz)', 'The unit of frequency: 1 Hz = one cycle per second.', { match: ['hertz', 'Hz'], cs: true }],
      ['Amplitude', 'The largest displacement from the middle (equilibrium) position during an oscillation. For small swings, a pendulum’s period barely depends on it.', { also: ['amplitudes'] }],
      ['Simple harmonic motion', 'Oscillation driven by a restoring force proportional to the displacement, as for a mass on a spring. The motion traces a sine curve, and its period does not depend on the amplitude.', { also: ['SHM', 'harmonic motion'] }],
      ['Restoring force', 'A force that pulls an object back toward its equilibrium position, like a stretched spring’s pull or gravity on a displaced pendulum.'],
      ['Spring constant', 'How stiff a spring is: the force needed per metre of stretch, k, in N/m. A car’s suspension springs are tens of thousands of N/m.', { also: ['spring stiffness', 'force constant'] }],
      ['Hooke’s law', 'The force from a spring is proportional to its stretch or compression and opposite to it: F = −kx, up to the elastic limit. Robert Hooke published it in 1678.'],
      ['Elastic limit', 'The largest stretch a spring or material can take and still return to its original shape.'],
      ['Pendulum', 'A mass hanging from a pivot that swings back and forth. For small swings its period is T = 2π√(L/g), set by its length.', { also: ['pendulums', 'pendula'] }],
      ['Damping', 'The gradual loss of an oscillation’s energy to friction or air resistance, so the swings shrink.', { also: ['damped'] }],
      ['Tuned mass damper', 'A heavy mass on springs, or hanging as a pendulum, inside a tall building, tuned to sway out of step with the building and soak up its motion. Taipei 101’s weighs 660 tonnes.'],
      ['Natural frequency', 'The frequency at which something oscillates on its own after a single push.', { also: ['resonant frequency'] }],
      ['Resonance', 'A large response when something is pushed in time with its natural frequency, like pumping a swing at just the right moment each cycle.', { prev: /(?:emotional|cultural|magnetic)\s+$/i }],
      ['Seismometer', 'An instrument that records ground shaking, traditionally with a heavy mass on a spring or pendulum that stays nearly still while the ground moves under it.', { also: ['seismograph'] }]
    ]
  };

  /* What each campaign chapter's discovery is. A definition that mentions it gives the answer away
     inside that chapter (and earlier ones) until the chapter is solved. Galileo's ramp: from rest,
     distance grows with the square of the time (speed grows steadily, the odd-number rule), and
     the acceleration is the same whatever the ball weighs. */
  const SECRETS = {
    galileo: /square of (?:the )?(?:elapsed )?time|times?[\s-]squared|(?:½|1\/2)\s*a\s*t\s*(?:²|\^2)|odd[\s-]numbers?|uniform(?:ly)?[\s-]+accelerat|accelerat\w*\s+(?:uniformly|steadily)|constant acceleration|same acceleration|(?:regardless|independent) of (?:its |their |the )?(?:mass|weight)|whatever (?:its|their|the) (?:mass|weight)|equal (?:speeds?|velocit\w+) in equal times?|mean[\s-]speed theorem/i
  };

  const slug = s => s.toLowerCase().replace(/\(.*?\)/g, '').replace(/[’']/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const terms = Object.entries(RAW).flatMap(([topic, list]) => list.map(([term, def, o = {}]) => ({
    id: slug(term), term, def, topic,
    forms: (o.match || [term.replace(/\s*\(.*?\)\s*/g, '')]).concat(o.also || []),
    cs: !!o.cs, prev: o.prev || null, next: o.next || null, near: o.near || null,
    reveals: Object.keys(SECRETS).filter(ch => SECRETS[ch].test(term + ' ' + def))
  })));
  const byId = Object.fromEntries(terms.map(e => [e.id, e]));

  /* ---------- matcher ---------- */
  const SEP = '[\\s\\u00a0\\u2010-\\u2014-]';
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const pattern = f => escRe(f).replace(/[’']/g, "['’]").replace(/[\s‐-—-]+/g, SEP) + (/(?:s|[^aeiou]y)$/i.test(f) ? '' : '(?:e?s)?');
  const FORMS = terms.flatMap(e => e.forms.map(f => ({ entry: e, text: f, pat: pattern(f) })))
    .sort((a, b) => b.text.length - a.text.length);
  FORMS.forEach(f => { if (f.entry.cs) f.exact = new RegExp('^' + f.pat + '$', 'u'); });
  const RE = new RegExp('(?<![\\p{L}\\p{N}])(?:' + FORMS.map(f => '(' + f.pat + ')').join('|') + ')(?![\\p{L}\\p{N}])', 'giu');

  /* All term mentions in a string: [{index, length, text, entry}], left to right, not overlapping. */
  function find(text) {
    const out = [];
    RE.lastIndex = 0;
    let m;
    while ((m = RE.exec(text))) {
      let i = 1;
      while (m[i] === undefined) i++;
      const f = FORMS[i - 1], e = f.entry, end = m.index + m[0].length;
      if (f.exact && !f.exact.test(m[0])) continue;
      if (e.prev && e.prev.test(text.slice(Math.max(0, m.index - 40), m.index))) continue;
      if (e.next && e.next.test(text.slice(end, end + 40))) continue;
      if (e.near && !e.near.test(text.slice(Math.max(0, m.index - 60), end + 60))) continue;
      out.push({ index: m.index, length: m[0].length, text: m[0], entry: e });
    }
    return out;
  }

  /* True when a term must stay unlinked: on a chapter page, it gives away a discovery that hasn't
     been made yet, in this chapter or a later one. ctx: {order, discovered:Set} or null off-campaign. */
  function hidden(entry, ctx, chapters) {
    if (!ctx) return false;
    return entry.reveals.some(id => {
      const ch = chapters.find(c => c.id === id);
      return ch && ch.order >= ctx.order && !ctx.discovered.has(id);
    });
  }

  const api = { terms, byId, find, hidden, SECRETS, TOPIC_SCIENCE: ['science', 'Doing science'] };
  ADL.glossary = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  if (typeof document === 'undefined') return;

  /* ---------- linking text on the page ---------- */
  const SKIP = ['script', 'style', 'noscript', 'template', 'a', 'button', 'label', 'input', 'select', 'option', 'textarea', 'summary',
    'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'dt', 'code', 'pre', 'kbd', 'sub', 'sup', 'svg', 'canvas', 'math',
    '[contenteditable]', '[aria-hidden="true"]', '[aria-live]', '[role="status"]', '[role="alert"]', '[role="tab"]', '[role="button"]', '[draggable="true"]',
    '.sr-only', '.readouts', '.eq', '.mono', '.data-table', '.calc-out', '.glossary', '.term', '.term-pop', '.no-terms',
    '.topbar', '.site-foot', '.toast', '.credit-list', '.scope', '.chip', '.sort-item'].join(',');
  const BLOCK = 'p, li, dd, figcaption, blockquote, td, th, div, section, article, aside, main, body';

  function context() {
    const ch = ADL.getChapter && ADL.getChapter((root.location.hash || '').slice(1));
    if (!ch || !ADL.store) return null;
    const st = ADL.store.state.chapters || {};
    return { order: ch.order, discovered: new Set(ADL.chapters.filter(c => st[c.id] && st[c.id].discovered).map(c => c.id)) };
  }

  function linkText(node, ctx) {
    const parent = node.parentElement;
    if (!parent || !node.data || node.data.length < 2 || parent.closest(SKIP)) return;
    const hits = find(node.data);
    if (!hits.length) return;
    const block = parent.closest(BLOCK);
    const seen = new Set();
    const keep = hits.filter(x => {
      if (seen.has(x.entry.id) || hidden(x.entry, ctx, ADL.chapters || [])) return false;
      if (block && block.querySelector(`.term[data-term="${x.entry.id}"]`)) return false;
      seen.add(x.entry.id); return true;
    });
    if (!keep.length) return;
    const frag = document.createDocumentFragment();
    let at = 0;
    keep.forEach(x => {
      if (x.index > at) frag.append(node.data.slice(at, x.index));
      frag.append(ADL.h('button', { type: 'button', class: 'term', 'data-term': x.entry.id, 'aria-haspopup': 'dialog', 'aria-expanded': 'false' }, x.text));
      at = x.index + x.length;
    });
    if (at < node.data.length) frag.append(node.data.slice(at));
    node.replaceWith(frag);
  }

  function linkWithin(el, ctx) {
    if (el.nodeType === 3) { linkText(el, ctx); return; }
    if (el.nodeType !== 1 || el.closest(SKIP)) return;
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n => linkText(n, ctx));
  }

  let observer = null;
  function relink(nodes) {
    const ctx = context();
    nodes.forEach(n => { if (n.isConnected) linkWithin(n, ctx); });
    if (observer) observer.takeRecords(); // drop the records our own edits just made
  }

  /* ---------- popup ---------- */
  let pop = null, popFor = null;

  function close(restoreFocus) {
    if (!pop) return;
    const t = popFor;
    pop.remove(); pop = null; popFor = null;
    if (t) { t.setAttribute('aria-expanded', 'false'); if (restoreFocus && t.isConnected) t.focus(); }
  }

  function place() {
    if (!pop || !popFor) return;
    const r = popFor.getClientRects()[0];
    const vw = document.documentElement.clientWidth, vh = root.innerHeight;
    if (!popFor.isConnected || !r || r.bottom < 0 || r.top > vh) { close(false); return; }
    const w = pop.offsetWidth, ht = pop.offsetHeight;
    let top = r.bottom + 6;
    if (top + ht > vh - 8 && r.top - ht - 6 >= 8) top = r.top - ht - 6;
    pop.style.left = Math.max(8, Math.min(r.left, vw - w - 8)) + 'px';
    pop.style.top = top + 'px';
  }

  function open(btn) {
    close(false);
    const e = byId[btn.dataset.term];
    if (!e) return;
    const h = ADL.h;
    const topic = e.topic === 'science' ? api.TOPIC_SCIENCE[1] : ((ADL.TOPICS || []).find(t => t[0] === e.topic) || [e.topic, ''])[1];
    pop = h('div', { class: 'term-pop', role: 'dialog', 'aria-labelledby': 'term-pop-title', tabindex: '-1' },
      h('div', { class: 'term-pop-head' },
        h('div', null, h('strong', { id: 'term-pop-title' }, e.term), topic ? h('span', { class: 'term-pop-topic' }, topic) : null),
        h('button', { type: 'button', class: 'term-pop-close', 'aria-label': 'Close definition', onclick: () => close(true) }, '×')),
      h('p', null, e.def),
      ADL.openToolkit ? h('button', { type: 'button', class: 'linkish small', onclick: () => { close(false); ADL.openToolkit('glossary', e.term.replace(/\s*\(.*?\)/g, '')); } }, 'All glossary terms') : null);
    pop.addEventListener('focusout', ev => { if (pop && ev.relatedTarget && !pop.contains(ev.relatedTarget) && ev.relatedTarget !== popFor) close(false); });
    popFor = btn;
    btn.setAttribute('aria-expanded', 'true');
    document.body.append(pop);
    place();
    if (pop) pop.focus({ preventScroll: true });
  }

  function onClick(ev) {
    const t = ev.target.closest ? ev.target.closest('button.term') : null;
    if (t) {
      ev.preventDefault(); ev.stopPropagation();
      if (popFor === t) close(true); else open(t);
      return;
    }
    if (pop && !pop.contains(ev.target)) close(false);
  }

  function onKey(ev) {
    if (ev.key === 'Escape' && pop) { ev.preventDefault(); ev.stopImmediatePropagation(); close(true); }
  }

  let started = false;
  function start() {
    if (started || !document.body) return;
    started = true;
    relink([document.body]);
    observer = new MutationObserver(recs => relink(recs.flatMap(r => Array.from(r.addedNodes))));
    observer.observe(document.body, { childList: true, subtree: true });
    document.addEventListener('click', onClick, true);
    root.addEventListener('keydown', onKey, true);
    root.addEventListener('scroll', place, { passive: true, capture: true });
    root.addEventListener('resize', place);
    root.addEventListener('hashchange', () => close(false));
    if (ADL.store) ADL.store.on(e => { if (e.type === 'discovery') relink([document.body]); });
  }
  Object.assign(api, { open, close, relink: () => relink([document.body]) });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/workspace.js */
/* Physics Discovery Lab · investigation workspace.
   Renders one chapter: the stage tracker, the investigation card for the current stage,
   the apparatus (canvas + controls + runs), and the data panel (results, run history,
   notebook). Chapters supply content and physics; this file supplies the discovery loop. */
(function (root) {
  'use strict';
  const ADL = root.ADL;
  const { h, fmt, store, flow } = ADL;

  /* ---------- Canvas drawing helpers shared by chapters ---------- */
  let colorCache = null;
  const draw = {
    colors() {
      if (colorCache) return colorCache;
      const c = ADL.charts.css;
      colorCache = {
        bg: c('--scope-bg'), grid: c('--scope-grid'), ink: c('--scope-ink'), dim: c('--scope-dim'), glow: c('--glow'),
        alpha: c('--c-alpha'), electron: c('--c-electron'), proton: c('--c-proton'), neutron: c('--c-neutron'), photon: c('--c-photon'), ion: c('--c-ion'),
        brass: c('--scope-brass'), bad: c('--c-proton'), metal: c('--cpk-metal'),
        mono: c('--font-data') || 'monospace', body: c('--font-body') || 'sans-serif'
      };
      return colorCache;
    },
    resetColors() { colorCache = null; },
    bg(ctx, w, hgt) {
      const C = draw.colors();
      ctx.fillStyle = C.bg; ctx.fillRect(0, 0, w, hgt);
      ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
      const step = Math.max(24, Math.round(w / 24));
      ctx.beginPath();
      for (let x = step; x < w; x += step) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, hgt); }
      for (let y = step; y < hgt; y += step) { ctx.moveTo(0, y + 0.5); ctx.lineTo(w, y + 0.5); }
      ctx.stroke();
    },
    label(ctx, text, x, y, o) {
      o = o || {};
      const C = draw.colors();
      ctx.font = `${o.weight || 400} ${o.size || 12}px ${o.font === 'body' ? C.body : C.mono}`;
      ctx.fillStyle = o.color || C.ink; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.baseline || 'alphabetic';
      ctx.fillText(text, x, y);
    },
    dot(ctx, x, y, r, color, glow) {
      if (glow) { ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = glow; }
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
      if (glow) ctx.restore();
    },
    line(ctx, x1, y1, x2, y2, color, width, dash) {
      ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = width || 1.5; ctx.setLineDash(dash || []);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
    },
    arrow(ctx, x1, y1, x2, y2, color, width) {
      draw.line(ctx, x1, y1, x2, y2, color, width);
      const a = Math.atan2(y2 - y1, x2 - x1), s = 7 + (width || 1.5) * 1.5;
      ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - s * Math.cos(a - 0.45), y2 - s * Math.sin(a - 0.45)); ctx.lineTo(x2 - s * Math.cos(a + 0.45), y2 - s * Math.sin(a + 0.45));
      ctx.closePath(); ctx.fillStyle = color; ctx.fill();
    },
    rrect(ctx, x, y, w, hh, r) {
      ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + hh, r); ctx.arcTo(x + w, y + hh, x, y + hh, r); ctx.arcTo(x, y + hh, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    },
    ease: t => 1 - Math.pow(1 - t, 3)
  };
  ADL.draw = draw;

  /* ---------- Generic hints (chapters override per stage) ---------- */
  const GENERIC_HINTS = {
    observe: [
      'An observation is something you could point to, count or measure. An interpretation explains <em>why</em> it happened.',
      'Test each statement: could two people who disagree about the explanation both agree it is true? If so, it is an observation.',
      'Words like “made of”, “because”, “must be” or “caused by” usually signal an interpretation.',
      'Interpretations are not bad. They are where science goes next. They just need evidence before you trust them.',
      'Sort only by what was directly seen or measured in the archival note. Everything that explains or names a cause is an interpretation.'
    ],
    hypothesize: [
      'There is no penalty for picking an idea that turns out wrong. Pick the one you find most convincing right now.',
      'For each idea, ask: what would I expect to see if this were true?',
      'Your confidence should reflect how much evidence you have so far. With little evidence, a middling number is honest.',
      'Several famous scientists started with the “wrong” hypothesis. The test is what makes it science.',
      'Choose any hypothesis and a confidence, then commit. The experiment will do the deciding.'
    ],
    predict: [
      'What would the competing hypotheses predict <em>differently</em>? That is the most useful prediction to make.',
      'Pick a change you can actually make with the apparatus controls.',
      'A good prediction could turn out wrong. “Something will happen” cannot be wrong, so it cannot teach you much.',
      'Write down the direction of the change (bigger, smaller, the same) before you run anything.',
      'Choose the manipulation listed first and the outcome your hypothesis implies, then save.'
    ],
    analyze: [
      'Did the result match what your hypothesis predicted?',
      'Could the other hypothesis explain the same result? If both could, the test did not tell them apart.',
      'Look at more than one run. Is the pattern repeatable?',
      'Change your confidence in proportion to how surprising the result was.',
      'If the result matched, raise your confidence a little; if it contradicted your hypothesis, lower it and say why.'
    ],
    claim: [
      'A claim is one sentence about what is true. Evidence is specific runs. Reasoning connects them.',
      'Cite runs that differ in only one setting, so the comparison is fair.',
      'Choose reasoning statements that use a scientific principle, not just a restatement of the data.',
      'Check that none of your cited runs contradicts the claim.',
      'Pick the claim that every one of your runs agrees with, cite the runs that compare the key variable, and choose the reasoning that explains why.'
    ],
    challenge: [
      'A good referee asks “what else could explain this?” What would rule that alternative out?',
      'The best answer to a challenge is usually a controlled experiment, not an argument.',
      'Change only the variable the referee is worried about. Keep everything else the same.',
      'Make the run, then look at the numbers before you decide what happened.',
      'Choose the response that tests the referee\'s alternative directly, run the control, then pick the conclusion your numbers support.'
    ],
    revise: [
      'Has the evidence made you more confident, less confident, or did it change your mind?',
      'Good scientists say exactly which result changed their thinking.',

    ]
  };
  const STAGE_INTRO = {
    visit: 'See the real instruments, and the people who use them, before the simulation.',
    intro: 'Meet the mystery.', observe: 'Separate what was seen from what it might mean.', hypothesize: 'Commit to an explanation, for now.',

  };

  const tierInfo = {
    A: { label: 'Historical data', cls: 'tier-a' },
    B: { label: 'Physics-based simulation', cls: 'tier-b' },
    C: { label: 'Illustrative model', cls: 'tier-c' },
    R: { label: 'Your own measurements', cls: 'tier-r' }
  };
  ADL.tierInfo = tierInfo;

  function defaults(def) {
    const c = {};

  }

  /* ================================================================ */
  function mount(rootEl, def) {
    const cs = store.chapter(def.id);
    const mode = () => store.state.mode;
    const cache = new Map();
    const realRuns = () => cs.runs.filter(r => !r.demo);
    const view = {

      chart: def.charts && def.charts.length ? def.charts[0].id : null,
      overlays: false, table: false, selected: [], tab: 'results', pane: 'investigate', drafts: {}, hintLevel: {}, highlight: null
    };
    view.stage = cs.current && flow.canEnter(def, cs, cs.current) ? cs.current : flow.firstOpen(def, cs);
    if (!cs.startedAt) { cs.startedAt = ADL.now(); store.save(); }

    const fullResult = run => {
      if (cache.has(run.runId)) return cache.get(run.runId);
      const r = def.simulate(run.controls, run.seed, run.world);

    };
    const last = realRuns()[realRuns().length - 1];
    if (last && def.simulate) { view.controls = Object.assign(defaults(def), last.controls); view.world = last.world || 'real'; view.shown = { run: last, result: fullResult(last), controls: last.controls, world: last.world }; }

    const el = {};
    el.tracker = h('nav', { class: 'tracker', 'aria-label': 'Investigation steps' });

    el.data = h('section', { class: 'ws-data pane', 'data-pane': 'data', 'aria-label': 'Data and notebook' });
    const paneTabs = h('div', { class: 'pane-tabs', role: 'tablist', 'aria-label': 'Workspace panels' },
      [['investigate', 'Investigate'], ['apparatus', 'Apparatus'], ['data', 'Data']].map(([id, label]) =>
        h('button', { type: 'button', role: 'tab', class: 'pane-tab', 'data-for': id, 'aria-selected': String(view.pane === id), onclick: () => setPane(id) }, label)));
    const head = h('header', { class: 'ws-head' },
      h('div', { class: 'ws-head-main' },
        h('p', { class: 'eyebrow' }, `${def.kicker} · ${def.era} · ${def.place}`),
        h('h1', { class: 'ws-title' }, cs.discovered && def.solvedTitle ? def.solvedTitle : def.title),
        h('p', { class: 'ws-question' }, def.question)),
      h('div', { class: 'ws-head-side' },
        h('button', { type: 'button', class: `tier-badge ${tier.cls}`, onclick: showHowItWorks, title: 'How this model works' },
          h('span', { class: 'tier-letter' }, def.tier), h('span', null, tier.label), h('span', { class: 'tier-more' }, 'How this model works'))));
    const mobileBar = def.simulate && !def.live ? h('div', { class: 'mobile-runbar' },
      h('button', { type: 'button', class: 'btn primary', onclick: () => { setPane('apparatus'); runExperiment(1); } }, 'Run'),
      h('button', { type: 'button', class: 'btn', onclick: () => { setPane('apparatus'); runExperiment(5); } }, 'Repeat ×5'),
      h('button', { type: 'button', class: 'btn ghost', onclick: resetControls }, 'Reset')) : null;
    const wsEl = h('div', { class: 'ws' + (mode() === 'open' ? ' ws-open' : '') + (mobileBar ? ' has-runbar' : ''), 'data-pane': view.pane },
      head, el.tracker, el.tour, paneTabs, h('div', { class: 'ws-grid' }, el.inv, el.app, el.data), mobileBar);
    rootEl.replaceChildren(wsEl);

    function setPane(id) {

    }

    /* ---------- stage tracker ---------- */
    function renderTracker() {

      const stages = flow.stages(def);
      el.tracker.replaceChildren(h('ol', { class: 'tracker-list' }, stages.map((s, i) => {

          onclick: () => go(s.id)
        }, h('span', { class: 'tracker-num' }, done ? '✓' : String(i + 1)), h('span', { class: 'tracker-label' }, s.label)));
      })));
      const curBtn = el.tracker.querySelector('.current');
      if (curBtn && curBtn.scrollIntoView) curBtn.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
    }

    function go(stageId) {
      if (!flow.canEnter(def, cs, stageId)) return;
      view.stage = stageId; cs.current = stageId; store.save();
      renderTracker(); renderInvestigation(); renderTourStage();
      setPane('investigate');
      el.inv.scrollTop = 0;
      const t = el.inv.querySelector('h2'); if (t) t.focus({ preventScroll: true });
    }

    function save(evt) { store.save(); store.emit(Object.assign({ type: 'chapter', chapterId: def.id }, evt || {})); renderTracker(); }
    function log(type, text, data) { store.log(def.id, type, text, data); }

    /* ---------- investigation column ---------- */
    function renderInvestigation() {
      el.inv.replaceChildren();
      if (mode() === 'open') { el.inv.append(openLabCard()); return; }
      const s = flow.stages(def).find(x => x.id === view.stage) || flow.stages(def)[0];

      const hints = (def.hints && def.hints[s.id]) || GENERIC_HINTS[s.id];

    }

    function hintBox(stageId, hints) {
      const lvl = view.hintLevel[stageId] ?? -1;

    }

    function evidenceBox() {
      const items = flow.evidence(def, cs);

        h('summary', null, `Evidence checklist · ${ok} of ${items.length}`),

    }

    function openLabCard() {
      const worlds = def.worlds || [];
      return h('article', { class: 'stage-card' },
        h('p', { class: 'stage-step' }, 'Open Laboratory'), h('h2', { tabindex: '-1' }, def.question),
        h('p', null, 'No steps and no gates. Every control is unlocked, model predictions can be overlaid on the charts, and you can read the accepted explanation whenever you like.'),
        worlds.length > 1 ? h('div', { class: 'note' }, h('strong', null, 'What-if worlds. '), 'Use the “Nature” control under the apparatus to see what the data would look like if a different hypothesis were true. Real-world runs and what-if runs are labeled separately in your notebook.') : null,
        def.reveal ? h('details', { class: 'reveal-inline' }, h('summary', null, 'Read the accepted explanation'), revealContent(true)) : null,
        h('div', { class: 'btn-row' }, h('button', { type: 'button', class: 'btn', onclick: () => store.setMode('discovery') }, 'Switch to True Discovery')));
    }

    /* ---------- standard stage renderers ---------- */
    const STAGES = {
      intro(body) {
        body.append(h('div', { class: 'letter', html: def.intro.letter }));
        body.append(h('div', { class: 'anomaly' }, h('p', { class: 'anomaly-tag' }, 'The anomaly'), h('div', { html: def.intro.anomaly })));
        const row = h('div', { class: 'btn-row' });
        if (def.intro.demo) row.append(h('button', { type: 'button', class: 'btn', onclick: () => { showDemo(); setPane('apparatus'); } }, 'Show the archival observation'));

        body.append(row);
      },

      observe(body) {
        body.append(h('p', null, 'Sort each statement about the archival observation. ', h('strong', null, 'Observation'), ': what was seen or measured. ', h('strong', null, 'Interpretation'), ': an explanation of it.'));
        const list = h('ol', { class: 'sort-list' });
        for (const o of def.observations) {
          const choice = cs.sorted[o.id];

          list.append(h('li', { class: 'sort-item' + (fb ? (fb.ok ? ' ok' : ' miss') : '') },
            h('p', { class: 'sort-text' }, o.text),
            ADL.ui.seg({ options: [{ value: 'observation', label: 'Observation' }, { value: 'inference', label: 'Interpretation' }], value: choice || null, onInput: v => { cs.sorted[o.id] = v; cs.sortChecked = false; store.save(); renderInvestigation(); } }).el,
            fb ? h('p', { class: 'feedback ' + (fb.ok ? 'good' : 'warn') }, fb.text) : null));

        const all = def.observations.every(o => cs.sorted[o.id]);
        body.append(h('div', { class: 'btn-row' }, h('button', { type: 'button', class: 'btn primary', disabled: !all, onclick: () => {

      },

      hypothesize(body) {
        const draft = view.drafts.hyp || (view.drafts.hyp = { id: cs.hypothesis, conf: cs.confidence ?? 50, why: '' });
        if (cs.hypothesis) {

          body.append(h('p', { class: 'note' }, h('strong', null, 'Committed: '), `${cur.letter} · ${cur.name}, ${cs.confidence}% confident. You can change your mind; the switch is recorded in your notebook.`));
        }
        body.append(h('p', null, 'Which explanation do you find most convincing right now? None is marked correct.'));
        const name = ADL.ui.nextId('hyp');
        body.append(h('div', { class: 'choice-cards', role: 'radiogroup', 'aria-label': 'Hypotheses' }, def.hypotheses.map(hy => {
          const inp = h('input', { type: 'radio', name, value: hy.id, onchange: () => { draft.id = hy.id; } });
          inp.checked = draft.id === hy.id;

        })));
        body.append(ADL.ui.slider({ label: 'How confident are you?', min: 0, max: 100, step: 5, value: draft.conf, unit: '%', onInput: v => { draft.conf = v; } }).el);
        const why = h('textarea', { class: 'textarea', rows: 2, placeholder: 'Optional: why does this one seem most likely?', 'aria-label': 'Why this hypothesis' });
        why.value = draft.why; why.addEventListener('input', () => { draft.why = why.value; });
        body.append(why);
        body.append(h('div', { class: 'btn-row' }, h('button', { type: 'button', class: 'btn primary', onclick: () => {
          if (!draft.id) { ADL.ui.toast('Choose a hypothesis first.'); return; }
          const hy = def.hypotheses.find(x => x.id === draft.id);
          const changed = cs.hypothesis && cs.hypothesis !== draft.id;
          cs.hypothesisLog.push({ at: ADL.now(), id: draft.id, confidence: draft.conf, reason: draft.why });
          if (changed) cs.revisions.push({ at: ADL.now(), from: cs.hypothesis, to: draft.id, decision: 'switch', confidence: draft.conf, reason: draft.why || '(switched during hypothesis stage)' });
          cs.hypothesis = draft.id; cs.confidence = draft.conf;
          log('hypothesis', `${changed ? 'Switched to' : 'Committed to'} hypothesis ${hy.letter} (${hy.name}) at ${draft.conf}% confidence${draft.why ? ': ' + draft.why : ''}`);
          view.drafts.hyp = null; save(); renderInvestigation();
        } }, cs.hypothesis ? 'Update my hypothesis' : 'Commit to this hypothesis')));
      },

      predict(body) {
        const hy = def.hypotheses.find(x => x.id === cs.hypothesis);
        const draft = view.drafts.pred || (view.drafts.pred = { manip: null, option: null, why: '' });
        body.append(h('p', null, 'Pick a change you will make with the apparatus. Then predict the result ', h('strong', null, `if hypothesis ${hy ? hy.letter + ' (' + hy.name + ')' : ''} is right`), '.'));
        const mname = ADL.ui.nextId('m');
        body.append(h('div', { class: 'choice-list', role: 'radiogroup', 'aria-label': 'Changes you can make' }, def.manipulations.map(m => {
          const inp = h('input', { type: 'radio', name: mname, value: m.id, onchange: () => { draft.manip = m.id; draft.option = null; renderInvestigation(); } });

            m.options.map(op => {

            })));

        }
        body.append(h('div', { class: 'btn-row' }, h('button', { type: 'button', class: 'btn primary', onclick: () => {
          if (!m || !draft.option) { ADL.ui.toast('Choose a change and a predicted result.'); return; }
          const p = { id: 'P' + (cs.predictions.length + 1), at: ADL.now(), hypothesisId: cs.hypothesis, manipId: m.id, optionId: draft.option, text: draft.why };
          cs.predictions.push(p);

          view.drafts.pred = null; save(); renderInvestigation();
        } }, 'Save prediction (before running)')));
        if (cs.predictions.length) {
          body.append(h('h3', { class: 'mini-head' }, 'Your predictions'));
          body.append(h('ul', { class: 'pred-list' }, cs.predictions.slice().reverse().map(p => {
            const mm = def.manipulations.find(x => x.id === p.manipId);
            const ev = mm.evaluate(flow.runsAfter(cs, p.at), realRuns(), cs);
            return h('li', null, h('span', { class: 'chip mono' }, p.id), ' ', mm.label, ': ', h('em', null, mm.options.find(o => o.id === p.optionId).text), ' ', h('span', { class: 'pill ' + (ev.status === 'observed' ? 'pill-info' : 'pill-wait') }, ev.status === 'observed' ? 'tested' : 'waiting for a test'));
          })));
        }
      },

      experiment(body) {
        const p = cs.predictions[cs.predictions.length - 1];
        if (p) {
          const m = def.manipulations.find(x => x.id === p.manipId);
          body.append(h('div', { class: 'note' }, h('strong', null, `Testing ${p.id}: `), m.label, '. ', h('span', { html: m.howTo })));
        }
        const first = cs.predictions[0];
        const after = first ? flow.runsAfter(cs, first.at) : [];
        const distinct = flow.distinctConfigs(def, after);
        body.append(h('ul', { class: 'checklist' },
          h('li', { class: after.length ? 'ok' : '' }, h('span', { class: 'check' }, after.length ? '✓' : '○'), h('span', null, `Runs since your first prediction: ${after.length}`)),
          h('li', { class: distinct >= 2 ? 'ok' : '' }, h('span', { class: 'check' }, distinct >= 2 ? '✓' : '○'), h('span', null, `Different setups tried: ${distinct} (need 2)`))));
        if (def.discriminators) {
          body.append(h('h3', { class: 'mini-head' }, 'Tests that tell the hypotheses apart'));
          body.append(h('ul', { class: 'checklist' }, def.discriminators.map(d => { const r = d.test(realRuns(), cs); return h('li', { class: r.ok ? 'ok' : '' }, h('span', { class: 'check' }, r.ok ? '✓' : '○'), h('span', null, d.label, h('small', null, r.ok ? `Done: ${r.runIds.join(' vs ')}` : d.howTo))); })));
        }
        body.append(h('p', { class: 'muted' }, 'Tip: “Repeat ×5” runs the same setup with fresh random seeds, so you can see which numbers are stable and which wobble.'));
        body.append(h('div', { class: 'btn-row narrow-only' }, h('button', { type: 'button', class: 'btn primary', onclick: () => setPane('apparatus') }, 'Go to the apparatus')));
      },

      analyze(body) {
        if (!cs.predictions.length) { body.append(h('p', null, 'Save a prediction first.')); return; }
        let anyTested = false;
        body.append(h('div', { class: 'pv-list' }, cs.predictions.slice().reverse().map(p => {
          const m = def.manipulations.find(x => x.id === p.manipId);
          const ev = m.evaluate(flow.runsAfter(cs, p.at), realRuns(), cs);
          const predicted = m.options.find(o => o.id === p.optionId);
          if (ev.status === 'observed') anyTested = true;
          const match = ev.status === 'observed' ? ev.outcome === p.optionId : null;
          return h('div', { class: 'pv' },
            h('p', { class: 'pv-head' }, h('span', { class: 'chip mono' }, p.id), ' ', m.label),
            h('div', { class: 'pv-grid' },
              h('div', null, h('span', { class: 'pv-tag' }, 'You predicted'), h('p', null, predicted.text)),
              h('div', null, h('span', { class: 'pv-tag' }, 'Your runs show'), ev.status === 'observed'
                ? h('p', null, (m.options.find(o => o.id === ev.outcome) || { text: ev.outcome }).text, ev.detail ? h('small', null, ev.detail) : null)

            match === null ? null : h('p', { class: 'pill ' + (match ? 'pill-good' : 'pill-warn') }, match ? 'Matched your prediction' : 'Did not match your prediction'));
        })));
        if (def.analyzePrompt) body.append(h('p', { class: 'note' }, h('strong', null, 'Think: '), def.analyzePrompt));
        const hy = def.hypotheses.find(x => x.id === cs.hypothesis);
        const draft = view.drafts.rev || (view.drafts.rev = { conf: cs.confidence ?? 50, reason: '', text: '' });
        body.append(h('h3', { class: 'mini-head' }, `Update your confidence in ${hy ? hy.letter + ' · ' + hy.name : 'your hypothesis'}`));
        body.append(ADL.ui.slider({ label: `Was ${cs.confidence}%. Now:`, min: 0, max: 100, step: 5, value: draft.conf, unit: '%', onInput: v => { draft.conf = v; } }).el);
        const reasons = ['The result matched my prediction', 'The result contradicted my prediction', 'The result cannot tell the hypotheses apart', 'I need more data first'];
        body.append(ADL.ui.select({ label: 'Main reason', options: [{ value: '', label: 'Choose…' }].concat(reasons.map(r => ({ value: r, label: r }))), value: draft.reason, onInput: v => { draft.reason = v; } }).el);
        const t = h('textarea', { class: 'textarea', rows: 2, placeholder: 'Which run convinced you? (optional)', 'aria-label': 'Explain your confidence change' });
        t.value = draft.text; t.addEventListener('input', () => { draft.text = t.value; });
        body.append(t);
        body.append(h('div', { class: 'btn-row' }, h('button', { type: 'button', class: 'btn primary', disabled: !anyTested, onclick: () => {
          if (!draft.reason) { ADL.ui.toast('Choose the main reason for your update.'); return; }
          cs.reviews.push({ at: ADL.now(), before: cs.confidence, after: draft.conf, reason: draft.reason, text: draft.text });
          log('review', `Confidence ${cs.confidence}% → ${draft.conf}%: ${draft.reason}${draft.text ? '. ' + draft.text : ''}`);
          cs.confidence = draft.conf; view.drafts.rev = null; save(); renderInvestigation();
        } }, 'Save confidence update'), anyTested ? null : h('span', { class: 'muted' }, 'Test at least one prediction first.')));
        if (cs.reviews.length) body.append(h('p', { class: 'feedback good' }, `Saved ${cs.reviews.length} update${cs.reviews.length > 1 ? 's' : ''}. You can loop back to Predict and Experiment any time.`));
      },

      claim(body) {
        const draft = view.drafts.claim || (view.drafts.claim = { claim: null, runs: [], reasons: [], text: '', feedback: null });
        if (cs.claimAccepted) {
          const c = def.claims.find(x => x.id === cs.claimAccepted.claimId);
          body.append(h('div', { class: 'note good-note' }, h('strong', null, 'Accepted claim: '), c.text, h('br'), h('small', null, 'Evidence: ' + cs.claimAccepted.runIds.join(', '))));
        }
        body.append(h('p', null, 'Build a claim–evidence–reasoning statement. A reader should be able to check it against your notebook.'));
        const cname = ADL.ui.nextId('c');
        body.append(h('fieldset', { class: 'cer' }, h('legend', null, h('span', { class: 'cer-tag' }, 'C'), 'Claim'),
          def.claims.map(c => { const inp = h('input', { type: 'radio', name: cname, onchange: () => { draft.claim = c.id; } }); inp.checked = draft.claim === c.id; return h('label', { class: 'choice-row' }, inp, h('span', null, c.text)); })));
        const runs = realRuns();
        body.append(h('fieldset', { class: 'cer' }, h('legend', null, h('span', { class: 'cer-tag' }, 'E'), 'Evidence: cite at least two runs'),
          runs.length ? h('div', { class: 'cite-list' }, runs.slice().reverse().map(r => {
            const inp = h('input', { type: 'checkbox', onchange: () => { draft.runs = inp.checked ? draft.runs.concat(r.runId) : draft.runs.filter(x => x !== r.runId); } });
            inp.checked = draft.runs.includes(r.runId);
            return h('label', { class: 'cite-row' }, inp, h('span', { class: 'chip mono' }, r.runId), h('span', { class: 'cite-sum' }, def.runSummary(r)));
          })) : h('p', { class: 'muted' }, 'No runs yet. Run the apparatus first.')));
        body.append(h('fieldset', { class: 'cer' }, h('legend', null, h('span', { class: 'cer-tag' }, 'R'), 'Reasoning: why the evidence supports the claim'),
          def.reasoning.map(rs => { const inp = h('input', { type: 'checkbox', onchange: () => { draft.reasons = inp.checked ? draft.reasons.concat(rs.id) : draft.reasons.filter(x => x !== rs.id); } }); inp.checked = draft.reasons.includes(rs.id); return h('label', { class: 'choice-row' }, inp, h('span', null, rs.text)); }),
          (() => { const t = h('textarea', { class: 'textarea', rows: 2, placeholder: 'In your own words (optional)', 'aria-label': 'Reasoning in your own words' }); t.value = draft.text; t.addEventListener('input', () => { draft.text = t.value; }); return t; })()));
        body.append(h('div', { class: 'btn-row' }, h('button', { type: 'button', class: 'btn primary', onclick: () => {
          if (!draft.claim) { ADL.ui.toast('Choose a claim.'); return; }
          draft.feedback = evaluateClaim(draft);
          const accepted = !draft.feedback.some(f => f.level === 'stop');
          const rec = { at: ADL.now(), claimId: draft.claim, runIds: draft.runs.slice(), reasonIds: draft.reasons.slice(), text: draft.text, accepted };
          cs.claims.push(rec);
          const ct = def.claims.find(x => x.id === draft.claim).text;
          log('claim', `${accepted ? 'Claim accepted' : 'Claim needs work'}: “${ct}” citing ${draft.runs.join(', ') || 'no runs'}`);
          if (accepted) cs.claimAccepted = rec;
          save(); renderInvestigation();
        } }, 'Submit claim')));
        if (draft.feedback) body.append(h('ul', { class: 'feedback-list' }, draft.feedback.map(f => h('li', { class: 'fb-' + f.level }, f.text))));
      },

      challenge(body) {
        const ch = def.challenge, st = cs.challenge;
        body.append(h('div', { class: 'referee' },
          h('p', { class: 'referee-tag' }, 'Referee report · Dr. Imogen Vale (fictional Institute referee)'),
          h('p', { class: 'referee-q', html: ch.question })));
        if (st.resolved) {
          body.append(h('p', { class: 'feedback good' }, h('strong', null, 'Challenge answered. '), ch.resolvedNote));
          body.append(h('p', { class: 'muted' }, 'Control runs: ' + st.runIds.join(', ')));
          return;
        }
        const name = ADL.ui.nextId('ch');
        body.append(h('fieldset', { class: 'predict-box' }, h('legend', null, 'How do you respond?'), ch.options.map(op => {
          const inp = h('input', { type: 'radio', name, onchange: () => {
            st.choice = op.id; st.log.push({ at: ADL.now(), choice: op.id }); log('challenge', `Responded to the referee: ${op.text}`); save(); renderInvestigation();
          } });
          inp.checked = st.choice === op.id;
          return h('label', { class: 'choice-row' }, inp, h('span', null, op.text));
        })));
        const op = ch.options.find(o => o.id === st.choice);
        if (!op) return;
        body.append(h('p', { class: 'feedback ' + (op.valid ? 'good' : 'warn') }, op.feedback));
        if (!op.valid) return;
        const found = ch.control.find(realRuns(), cs);
        if (!found.ok) {
          body.append(h('div', { class: 'note' }, h('strong', null, 'Run the control: '), h('span', { html: ch.control.label }), found.detail ? h('small', null, found.detail) : null));
          body.append(h('div', { class: 'btn-row narrow-only' }, h('button', { type: 'button', class: 'btn', onclick: () => setPane('apparatus') }, 'Go to the apparatus')));
          return;
        }
        body.append(h('div', { class: 'note good-note' }, h('strong', null, 'Control found: '), found.runIds.join(' vs '), h('br'), h('span', { html: found.summary })));
        const cname = ADL.ui.nextId('cc');
        body.append(h('fieldset', { class: 'predict-box' }, h('legend', null, 'What do your control runs show?'), ch.conclusions.map(c => {
          const inp = h('input', { type: 'radio', name: cname, onchange: () => {
            st.conclusion = c.id;
            const right = c.check(found.data);
            if (right) { st.resolved = true; st.runIds = found.runIds; log('challenge', `Answered the referee with control runs ${found.runIds.join(' vs ')}: ${c.text}`); }
            else log('challenge', `Conclusion did not match the control data: ${c.text}`);
            save(); renderInvestigation();
          } });
          inp.checked = st.conclusion === c.id;
          return h('label', { class: 'choice-row' }, inp, h('span', null, c.text));
        })));
        if (st.conclusion && !st.resolved) body.append(h('p', { class: 'feedback warn' }, 'Compare that with the numbers in your control runs. Open the Runs tab and compare the two runs side by side.'));
      },

      revise(body) {
        const hy = def.hypotheses.find(x => x.id === cs.hypothesis);
        const trail = [cs.hypothesisLog[0] ? cs.hypothesisLog[0].confidence : null].concat(cs.reviews.map(r => r.after)).filter(x => x !== null);
        body.append(h('p', null, 'Current hypothesis: ', h('strong', null, hy ? `${hy.letter} · ${hy.name}` : 'none'), `. Confidence so far: ${trail.map(x => x + '%').join(' → ') || cs.confidence + '%'}.`));
        const draft = view.drafts.final || (view.drafts.final = { decision: 'keep', to: cs.hypothesis, conf: cs.confidence ?? 50, why: '' });
        body.append(ADL.ui.seg({ label: 'Your decision', options: [{ value: 'keep', label: 'Keep it' }, { value: 'qualify', label: 'Keep, with limits' }, { value: 'switch', label: 'Replace it' }], value: draft.decision, onInput: v => { draft.decision = v; renderInvestigation(); } }).el);
        if (draft.decision === 'switch') body.append(ADL.ui.select({ label: 'Replace with', options: def.hypotheses.filter(x => x.id !== cs.hypothesis).map(x => ({ value: x.id, label: `${x.letter} · ${x.name}` })), value: draft.to !== cs.hypothesis ? draft.to : def.hypotheses.find(x => x.id !== cs.hypothesis).id, onInput: v => { draft.to = v; } }).el);
        body.append(ADL.ui.slider({ label: 'Final confidence', min: 0, max: 100, step: 5, value: draft.conf, unit: '%', onInput: v => { draft.conf = v; } }).el);
        const t = h('textarea', { class: 'textarea', rows: 3, placeholder: draft.decision === 'qualify' ? 'What can your experiment NOT tell you? Mention a run ID.' : 'Which result changed your mind or made you more sure? Mention a run ID.', 'aria-label': 'Explain your decision' });
        t.value = draft.why; t.addEventListener('input', () => { draft.why = t.value; });
        body.append(t);
        body.append(h('div', { class: 'btn-row' }, h('button', { type: 'button', class: 'btn primary', onclick: () => {
          if (draft.why.trim().length < 12) { ADL.ui.toast('Add a sentence explaining your decision.'); return; }
          const to = draft.decision === 'switch' ? (draft.to !== cs.hypothesis ? draft.to : def.hypotheses.find(x => x.id !== cs.hypothesis).id) : cs.hypothesis;
          cs.revisions.push({ at: ADL.now(), from: cs.hypothesis, to, decision: draft.decision, confidence: draft.conf, reason: draft.why });
          const nh = def.hypotheses.find(x => x.id === to);
          log('revision', `${draft.decision === 'switch' ? 'Replaced hypothesis with ' : draft.decision === 'qualify' ? 'Kept with limits: ' : 'Kept: '}${nh.letter} (${nh.name}) at ${draft.conf}%. ${draft.why}`);
          cs.hypothesis = to; cs.confidence = draft.conf; view.drafts.final = null; save(); renderInvestigation();
        } }, 'Record my decision')));
        if (cs.revisions.length) body.append(h('p', { class: 'feedback good' }, 'Decision recorded. Earlier hypotheses stay in your notebook. Being wrong on the way is part of the record.'));
      },

      discovery(body) {
        if (!cs.discovered) {
          const can = flow.canReveal(def, cs, mode());
          if (can) {
            body.append(h('p', null, mode() === 'guided' ? 'Your claim, challenge response and decision are in place.' : 'Your notebook has the evidence a discovery needs.'));
            body.append(h('div', { class: 'btn-row' }, h('button', { type: 'button', class: 'btn primary', onclick: () => {

            } }, 'Unlock the historical explanation')));
          } else {
            body.append(h('p', null, 'Not yet. A discovery has to rest on evidence. Your notebook still needs:'));
            const need = flow.evidence(def, cs).filter(i => !i.ok && (mode() !== 'guided' || ['claim', 'challenge', 'revision'].includes(i.id)));
            body.append(h('ul', { class: 'checklist' }, need.map(i => h('li', null, h('span', { class: 'check' }, '○'), h('span', null, i.label, i.detail ? h('small', null, i.detail) : null, ' ', h('button', { type: 'button', class: 'linkish', onclick: () => go(i.go) }, 'Go there'))))));
          }

        }
        body.append(revealContent(false));
        if (def.misconception) body.append(misconceptionBox());
        if (def.transfer && def.transfer.length) body.append(h('div', { class: 'stage-next' }, h('button', { type: 'button', class: 'btn primary', onclick: () => go('transfer') }, 'Continue to the transfer challenge →')));

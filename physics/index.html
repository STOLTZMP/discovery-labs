      text(g, `total ${sig(sim.E0, 3)} J`, b.x + b.w / 2, top - 12, c.dim, 'center');

        const x = b.x + 4 + i * (bw + 4), hgt = (bottom - top) * Math.min(1.02, val / Math.max(sim.E0, 1e-12));
        g.fillStyle = col; g.fillRect(x, bottom - hgt, bw, hgt);
        text(g, name, x + bw / 2, bottom + 12, c.ink, 'center');
        text(g, `${Math.round(100 * val / Math.max(sim.E0, 1e-12))}%`, x + bw / 2, bottom + 27, c.dim, 'center');
      });
      g.strokeStyle = c.dim; g.beginPath(); g.moveTo(b.x, bottom + 0.5); g.lineTo(b.x + b.w, bottom + 0.5); g.stroke();
    }

    /* ---- animation ---- */
    function frame(now) {
      raf = 0;
      if (destroyed || paused || !sim || sim.static) return;
      const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
      advance(dt); drawScene(); drawChart(); updateLive();
      if (st.table && sim.cross.length && (!renderTable.n || renderTable.n !== sim.cross.length)) { renderTable.n = sim.cross.length; renderTable(); }
      raf = requestAnimationFrame(frame);
    }
    function kick() {
      if (destroyed || !sim) return;
      if (ctx.reducedMotion() || sim.static) { updateLive(); drawScene(); return; }
      if (!raf && !paused) { last = performance.now(); raf = requestAnimationFrame(frame); }
    }
    const resizeObs = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(() => { if (!destroyed) { drawScene(); drawChart(true); } }) : null;
    if (resizeObs) { resizeObs.observe(sc.canvas); resizeObs.observe(chart); }

    caption.textContent = captionText();

    return {
      destroy() { destroyed = true; cancelAnimationFrame(raf); clearTimeout(capTimer); if (resizeObs) resizeObs.disconnect(); },
      getState() { return { mode: st.mode, k: st.k, m: st.m, A: st.A, bS: st.bS, L: st.L, mp: st.mp, theta0: st.theta0, bP: st.bP }; }
    };
  }

  const def = {
    id: 'spring-lab', order: 30, title: 'Spring & Pendulum Lab', topic: 'oscillations',
    blurb: 'Set a mass bouncing on a spring or a pendulum swinging, measure its period, and watch energy flow between motion, the spring or height, and heat.',
    realWorld: 'Oscillators keep time in clocks, smooth the ride in cars, sense motion inside every phone, steady skyscrapers in the wind, and isolate the mirrors of gravitational-wave detectors.',
    tier: 'B',
    tierNote: 'Both oscillators are integrated step by step (fourth-order Runge–Kutta, at least 400 steps per cycle) with g = 9.80665 m/s². The spring follows Hooke’s law exactly (an ideal, massless spring that never over-stretches) on a frictionless track. The pendulum uses the full restoring term −(g/L) sin θ, so wide swings take longer, as real ones do; its string is massless and behaves like a rigid rod, and the bob is a point. Damping is a force proportional to speed, a simple stand-in for air resistance and friction. The “exact period” readout uses the elliptic-integral formula for an undamped pendulum; the measured period is timed from the simulated motion.',
    mount, makeProblem,
    model: { G, LIM, accel, rk4, startX, energies, releaseEnergy, simulate, crossings, measuredPeriod, springPeriod, smallAnglePeriod, exactPendulumPeriod, dampedPeriod, overdamped, maxSpeed, normState }
  };
  if (typeof ADL.registerSim === 'function') ADL.registerSim(def);
  if (typeof module !== 'undefined' && module.exports) module.exports = def;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/sims/home-pendulum.js */
/* Physics Discovery Lab · Kitchen Pendulum Lab.

        D.label(c, taps.length ? 'Seconds between taps' : 'Tap to start the tape', 12, 20, { color: C.dim, size: 12 });
      }

      /* Motion sensor (experimental): gyroscope rate if available, else acceleration (which repeats twice per swing) */
      async function startSensor() {
        if (typeof root.DeviceMotionEvent === 'undefined') { status.textContent = 'This browser does not provide motion data. Use the tap timer.'; return; }
        try {
          if (typeof root.DeviceMotionEvent.requestPermission === 'function') {
            const r = await root.DeviceMotionEvent.requestPermission();
            if (r !== 'granted') { status.textContent = 'Motion access was not allowed. Use the tap timer.'; return; }
          }
        } catch (e) { status.textContent = 'Motion access could not be requested here. Use the tap timer.'; return; }
        sensor = { on: true, raw: [], samples: [], periods: [], channel: null };
        const onMotion = e => {
          const r = e.rotationRate || {}, a = e.accelerationIncludingGravity || {};
          sensor.raw.push([performance.now() / 1000, r.alpha, r.beta, r.gamma, a.x, a.y, a.z]);
        };
        sensor.handler = onMotion;
        root.addEventListener('devicemotion', onMotion);
        sensorBtn.textContent = 'Stop recording';
        status.textContent = 'Recording… swing the phone gently.';
        sensor.check = setTimeout(() => { if (sensor && sensor.on && !sensor.raw.length) { stopSensor(); status.textContent = 'No motion data arrived. This phone or this view may block the motion sensor; use the tap timer.'; } }, 2500);
        sensor.timer = setInterval(analyseSensor, 500);
        sensor.stopAt = setTimeout(stopSensor, 30000);
      }
      function analyseSensor() {
        if (!sensor || sensor.raw.length < 20) return;
        const ch = [1, 2, 3].map(k => ({ k, rot: true, vals: sensor.raw.map(s => s[k]).filter(v => typeof v === 'number') }))
          .concat([4, 5, 6].map(k => ({ k, rot: false, vals: sensor.raw.map(s => s[k]).filter(v => typeof v === 'number') })))
          .filter(c => c.vals.length === sensor.raw.length);
        const rot = ch.filter(c => c.rot), pool = rot.length ? rot : ch;
        if (!pool.length) return;
        const best = pool.map(c => ({ c, sd: stats(c.vals).sd })).sort((a, b) => b.sd - a.sd)[0].c;
        sensor.samples = sensor.raw.map(s => [s[0], s[best.k]]);
        sensor.channel = best.rot ? 'Rotation rate' : 'Acceleration';
        const p = periodsFromSignal(sensor.samples);
        sensor.periods = best.rot ? p : p.map(x => 2 * x); // the pull along the string peaks twice per swing
        update();
      }
      function stopSensor() {
        if (!sensor || !sensor.on) return;
        sensor.on = false;
        root.removeEventListener('devicemotion', sensor.handler);
        clearTimeout(sensor.check); clearInterval(sensor.timer); clearTimeout(sensor.stopAt);
        analyseSensor();
        sensorBtn.textContent = 'Start recording';
        if (sensor.periods.length) status.textContent = `Recorded ${sensor.periods.length} swings from the ${sensor.channel.toLowerCase()} signal.`;
        update();
      }

      let raf = null;
      const tick = () => { drawTape(); raf = requestAnimationFrame(tick); };
      if (!ctx.reducedMotion()) raf = requestAnimationFrame(tick);
      const rob = new ResizeObserver(() => { drawTape(); drawChart(); });
      rob.observe(sc.canvas); rob.observe(chartCv);
      update(); renderData();
      return {
        destroy() { cancelAnimationFrame(raf); rob.disconnect(); stopSensor(); },
        getState() { const pts = lab().points, fit = fitG(pts.filter(p => p.release === 'small')); return { points: pts.length, g: fit ? fit.g : null, lengthCm: length, lastT: pts.length ? pts[pts.length - 1].T : null }; }
      };
    },
    makeProblem
  });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/classconnect.js */
/* Physics Discovery Lab · From Class: turn a class worksheet into a short path through the lab.
   The parent uploads a photo or PDF of a worksheet (or pastes its text). On the published site,
   Claude reads it (the `sample` capability) against a catalog of this site's content and returns
   a small plan: see it, try it, practice it. Plans are saved (the `db` capability) without the
   worksheet image or any names, so they appear on the student's own device. Offline, pasted
   text is matched by keywords instead. */
(function (root) {
  'use strict';
  const ADL = root.ADL;
  const { h, fmt, store } = ADL;
  const MAX_PAGES = 4;
  const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';

  // What each chapter teaches, in the words a class worksheet would use
  const CHAPTER_COVERS = {
    galileo: 'motion, speed, velocity, acceleration, free fall and falling objects, distance-time and speed-time graphs, the kinematics equation d = ½at², inclined planes, Galileo vs Aristotle, timing measurements, averaging and uncertainty'
  };

  /* ---------- availability ---------- */
  const capability = name => (root.claude && typeof root.claude.use === 'function') ? root.claude.use(name).catch(() => null) : Promise.resolve(null);
  let samplePromise = null, dbPromise = null;
  const getSample = () => samplePromise || (samplePromise = capability('sample'));
  const getDb = () => dbPromise || (dbPromise = capability('db'));

  /* ---------- catalog of the site's content (sent to Claude, used to validate its answer) ---------- */
  let catalogCache = null;
  function catalog() {
    if (catalogCache) return catalogCache;
    const problems = ADL.problemTemplates.map(t => {
      const titles = new Set();
      for (let s = 1; s <= 40 && titles.size < 6; s++) { try { titles.add(t.generate(ADL.physics.makeRng(s * 2654435761 >>> 0), t.levels[0]).title); } catch (e) { /* skip */ } }
      return { id: t.id, topic: t.topic, levels: t.levels, title: t.title, examples: [...titles] };
    });
    catalogCache = {
      topics: ADL.TOPICS.map(([id, label]) => ({ id, label })),
      chapters: ADL.chapters.map(c => ({ id: c.id, title: c.title, era: c.era, covers: CHAPTER_COVERS[c.id] || c.question })),
      sims: ADL.sims.map(s => ({ id: s.id, title: s.title, topic: s.topic, about: s.blurb })),
      problems,
      people: ADL.PEOPLE.map(p => ({ id: p.id, name: p.name, topics: p.topics, chapters: p.chapters }))
    };
    return catalogCache;
  }
  function catalogText() {
    const c = catalog();
    return [
      'TOPICS: ' + c.topics.map(t => `${t.id} (${t.label})`).join('; '),
      'CHAPTERS (historical investigations, each opens with a real-photo field visit):\n' + c.chapters.map(x => `- ${x.id}: "${x.title}" (${x.era}). Covers: ${x.covers}`).join('\n'),
      'SIMULATIONS:\n' + c.sims.map(x => `- ${x.id}: ${x.title} [topic ${x.topic}]. ${x.about}`).join('\n'),
      'PRACTICE PROBLEM TYPES (randomized numbers, real-world contexts):\n' + c.problems.map(x => `- ${x.id} [topic ${x.topic}; levels ${x.levels.join('/')}]: ${x.title}. Example versions: ${x.examples.join(' | ')}`).join('\n'),
      'PEOPLE (scientists profiled on the site):\n' + c.people.map(x => `- ${x.id}: ${x.name} [${x.topics.join(', ') || 'general'}]`).join('\n')
    ].join('\n\n');
  }

  const SCHEMA = `{
  "title": string (at most 8 words, what the assignment is, e.g. "Gas Laws Practice Worksheet"),
  "level": "hs" or "college",
  "summary": string (1-2 plain sentences: what the worksheet practices),
  "concepts": [ { "name": string, "questions": string (which worksheet questions, e.g. "Q1-4", or ""), "plain": string (one plain sentence a teenager would understand) } ] (1 to 5 items),
  "hook": string (1-2 sentences: the most fascinating real-world or historical connection, taken from the site's content above),
  "plan": [ { "kind": "see" | "try" | "practice", "type": "chapter" | "sim" | "problem" | "people", "id": string (an id from the lists above), "label": string (at most 6 words), "why": string (one sentence), "minutes": number } ] (2 or 3 items, in the order see, try, practice; about 15 minutes in total),
  "problems": [ { "templateId": string (a PRACTICE PROBLEM TYPE id), "matches": string (which worksheet questions it resembles), "why": string (one sentence) } ] (0 to 3 items),
  "person": { "id": string (a PEOPLE id), "why": string (one sentence) } or null,
  "talk": string (one open question a parent could ask at dinner to get the student talking about the idea),
  "notCovered": [ string ] (worksheet concepts this site does not cover yet; empty if none)
}`;

  function prompt(text, kind) {
    return `You help a parent connect their high-school child's physics class assignment to an interactive physics learning site, so the student sees the ideas come alive without being overwhelmed.

${kind === 'images' ? 'The attached image(s) are photos or pages of one class assignment (a worksheet, lab sheet or study guide).' : 'Below is the text of one class assignment (a worksheet, lab sheet or study guide).'}
Work out what physics it practices, then choose the most relevant parts of the site from the catalog. Keep it small: a busy student should be able to do the plan in about 15 minutes.

Rules:
- Use ONLY ids that appear in the catalog. Never invent pages, problems or people.
- "see" should usually be a chapter (its real-photo field visit) or a simulation's real-world panel; "try" a simulation (the home-pendulum lab is a real experiment with string and a weight, good when the topic is pendulums or measuring g); "practice" a practice problem type.
- If the assignment is about something the site does not cover, put it in notCovered and still choose the closest useful parts.
- Do not include any names, school, teacher or other personal details from the assignment in your answer.
- Plain, warm, specific language. No jargon without a quick explanation.

SITE CATALOG
${catalogText()}
${kind === 'text' ? `\nASSIGNMENT TEXT\n${text.slice(0, 20000)}\n` : ''}
Reply with only one JSON object in exactly this shape:
${SCHEMA}`;
  }

  /* ---------- validation: keep only what really exists on the site ---------- */
  function validate(raw, source) {
    const c = catalog();
    const has = { chapter: id => c.chapters.some(x => x.id === id), sim: id => c.sims.some(x => x.id === id), problem: id => c.problems.some(x => x.id === id), people: id => c.people.some(x => x.id === id) };
    const str = (v, n) => String(v ?? '').replace(/\s+/g, ' ').trim().slice(0, n || 400);
    const out = {
      title: str(raw && raw.title, 80) || 'Class assignment',
      level: raw && raw.level === 'college' ? 'college' : 'hs',
      summary: str(raw && raw.summary, 400),
      concepts: (Array.isArray(raw && raw.concepts) ? raw.concepts : []).slice(0, 5).map(x => ({ name: str(x.name, 80), questions: str(x.questions, 40), plain: str(x.plain, 240) })).filter(x => x.name),
      hook: str(raw && raw.hook, 400),
      plan: (Array.isArray(raw && raw.plan) ? raw.plan : []).filter(x => x && has[x.type] && has[x.type](String(x.id))).slice(0, 3)
        .map(x => ({ kind: ['see', 'try', 'practice'].includes(x.kind) ? x.kind : 'see', type: x.type, id: String(x.id), label: str(x.label, 60), why: str(x.why, 240), minutes: Math.max(1, Math.min(30, Math.round(+x.minutes || 5))) })),
      problems: (Array.isArray(raw && raw.problems) ? raw.problems : []).filter(x => x && has.problem(String(x.templateId))).slice(0, 3)
        .map(x => ({ templateId: String(x.templateId), matches: str(x.matches, 60), why: str(x.why, 240) })),
      person: raw && raw.person && has.people(String(raw.person.id)) ? { id: String(raw.person.id), why: str(raw.person.why, 240) } : null,
      talk: str(raw && raw.talk, 240),
      notCovered: (Array.isArray(raw && raw.notCovered) ? raw.notCovered : []).slice(0, 5).map(x => str(x, 120)).filter(Boolean),
      source, createdAt: new Date().toISOString()
    };
    if (!out.plan.length && out.problems.length) out.plan = [{ kind: 'practice', type: 'problem', id: out.problems[0].templateId, label: 'Practice a matching problem', why: '', minutes: 10 }];
    return out;
  }

  /* ---------- reading files ---------- */
  function loadScript(src) {
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.append(s); });
  }
  async function pdfjs() {
    if (!root.pdfjsLib) { await loadScript(PDFJS + 'pdf.min.js'); await loadScript(PDFJS + 'pdf.worker.min.js'); }
    root.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
    return root.pdfjsLib;
  }
  // A PDF becomes text when it has a text layer, or page images when it is a scan.
  async function readPdf(file, maxPages) {
    const lib = await pdfjs();
    const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const n = Math.min(doc.numPages, maxPages);
    let text = '';
    for (let i = 1; i <= n; i++) { const page = await doc.getPage(i); const tc = await page.getTextContent(); text += tc.items.map(it => it.str).join(' ') + '\n'; }
    if (text.replace(/\s/g, '').length > 300) return { text, images: [] };
    const images = [];
    for (let i = 1; i <= n; i++) {
      const page = await doc.getPage(i), vp = page.getViewport({ scale: 1.6 });
      const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
      await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
      images.push(await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85)));
    }
    return { text: '', images };
  }

  /* ---------- keyword fallback (no Claude available) ---------- */
  const KEYWORDS = {
    motion: ['velocity', 'speed', 'acceleration', 'accelerat', 'displacement', 'kinematic', 'free fall', 'freefall', 'projectile', 'trajectory', 'position-time', 'position vs', 'velocity-time', 'velocity vs', 'distance-time', 'm/s', 'km/h', 'launch angle', 'galileo', 'motion'],
    forces: ['force', 'newton', 'net force', 'free-body', 'free body', 'friction', 'normal force', 'tension', 'weight', 'inertia', 'incline', 'ramp', 'coefficient', 'f = ma', 'f=ma', 'air resistance', 'drag', 'terminal velocity', 'pulley'],
    energy: ['energy', 'kinetic', 'potential', 'work done', 'power', 'joule', 'watt', 'conservation of energy', 'mechanical energy', 'efficiency', 'roller coaster'],
    momentum: ['momentum', 'impulse', 'collision', 'elastic', 'inelastic', 'recoil'],
    oscillations: ['pendulum', 'spring', 'hooke', 'oscillat', 'period', 'amplitude', 'simple harmonic', 'shm', 'spring constant', 'damping', 'resonance', 'vibrat'],
    gravity: ['orbit', 'circular motion', 'centripetal', 'gravitation', 'satellite', 'kepler', 'universal gravitation'],
    waves: ['wave', 'sound', 'wavelength', 'doppler', 'interference', 'standing wave', 'echo', 'decibel'],
    thermal: ['temperature', 'heat', 'thermal', 'specific heat', 'conduction', 'convection', 'celsius', 'kelvin'],
    electricity: ['circuit', 'current', 'voltage', 'resistance', 'ohm', 'series', 'parallel', 'coulomb', 'ampere', 'resistor', 'battery'],
    magnetism: ['magnet', 'magnetic', 'electromagnet', 'induction', 'motor', 'generator', 'compass'],
    light: ['reflection', 'refraction', 'lens', 'mirror', 'snell', 'optics', 'focal', 'prism'],
    modern: ['photoelectric', 'quantum', 'relativity', 'radioactive', 'half-life', 'photon']
  };
  const TOPIC_SIM = { motion: 'projectile-lab', forces: 'ramp-lab', energy: 'spring-lab', oscillations: 'home-pendulum' };
  function matchByKeywords(text) {
    const t = ' ' + text.toLowerCase().replace(/\s+/g, ' ') + ' ';
    const count = w => { let n = 0, i = 0; while ((i = t.indexOf(w, i)) >= 0) { n++; i += w.length; } return n; };
    const scores = Object.entries(KEYWORDS).map(([topic, words]) => ({ topic, score: words.reduce((a, w) => a + count(w), 0) })).sort((a, b) => b.score - a.score);
    const top = scores.filter(s => s.score >= 2).slice(0, 2);
    if (!top.length) return null;
    const main = top[0].topic;
    const chapter = ['motion', 'forces'].includes(main) && /fall|galileo|accelerat|ramp|incline|kinematic|gravity/.test(t) ? 'galileo' : null;
    const sim = TOPIC_SIM[main];
    const probs = ADL.problemTemplates.filter(p => p.topic === main).slice(0, 2);
    const plan = [];
    if (chapter) plan.push({ kind: 'see', type: 'chapter', id: chapter, label: 'Field visit and investigation', why: 'See the real instruments and the discovery behind this topic.', minutes: 6 });
    if (sim) plan.push({ kind: chapter ? 'try' : 'see', type: 'sim', id: sim, label: ADL.getSim(sim) ? ADL.getSim(sim).title : 'Simulation', why: 'Play with the idea hands-on.', minutes: 5 });
    if (probs[0]) plan.push({ kind: 'practice', type: 'problem', id: probs[0].id, label: probs[0].title, why: 'A real-world problem on the same idea.', minutes: 8 });
    const label = id => (ADL.TOPICS.find(x => x[0] === id) || [id, id])[1];
    return validate({
      title: 'Worksheet on ' + label(main).toLowerCase(), summary: `Matched by keywords: this looks like ${top.map(s => label(s.topic).toLowerCase()).join(' and ')}.`,
      concepts: top.map(s => ({ name: label(s.topic), questions: '', plain: '' })), hook: '', plan: plan.slice(0, 3),
      problems: probs.map(p => ({ templateId: p.id, matches: '', why: '' })), person: null, talk: '', notCovered: []
    }, 'keywords');
  }

  /* ---------- storage: shared database when published, this browser otherwise ---------- */
  const local = {
    list() { const s = store.state; return (s.companions || []).slice().sort((a, b) => (b.createdAt > a.createdAt ? 1 : -1)); },
    add(c) { const s = store.state; s.companions = (s.companions || []).concat(Object.assign({ id: 'local-' + Date.now() }, c)).slice(-30); store.save(); },
    remove(id) { const s = store.state; s.companions = (s.companions || []).filter(x => x.id !== id); store.save(); }
  };

  /* ---------- the page ---------- */
  function renderClassPage(el) {
    let files = [], ctl = null, unsub = null, dbRef = null, saved = [];
    const thumbs = h('div', { class: 'cc-thumbs' });
    const fileIn = h('input', { type: 'file', id: 'cc-file', class: 'file-input', multiple: true, accept: 'image/jpeg,image/png,image/webp,image/gif,application/pdf,text/plain' });
    const paste = h('textarea', { class: 'textarea', id: 'cc-text', rows: 4, placeholder: 'Or paste the worksheet text here…', 'aria-label': 'Worksheet text' });
    const status = h('p', { class: 'cc-status', 'aria-live': 'polite' });
    const goBtn = h('button', { type: 'button', class: 'btn primary' }, 'Find it in the lab');
    const stopBtn = h('button', { type: 'button', class: 'btn ghost', hidden: true }, 'Stop');
    const result = h('div', { class: 'cc-result' });
    const history = h('div', { class: 'cc-history' });
    const drop = h('label', { class: 'cc-drop', for: 'cc-file' },
      h('span', { class: 'cc-drop-title' }, 'Drop a photo or PDF of the worksheet here'),
      h('span', { class: 'muted small' }, 'or click to choose files (up to ' + MAX_PAGES + ' pages)'));
    const setFiles = list => {
      files = Array.from(list || []).slice(0, MAX_PAGES);
      thumbs.replaceChildren(...files.map(f => f.type.startsWith('image/') ? h('img', { src: URL.createObjectURL(f), alt: f.name }) : h('span', { class: 'chip' }, f.name)));
    };
    fileIn.addEventListener('change', () => setFiles(fileIn.files));
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); setFiles(e.dataTransfer.files); });

    const copyFor = code => ({
      not_granted: 'Reading worksheets needs permission to use Claude. You can paste the worksheet text instead, and it will be matched by keywords.',
      sampling_disabled: 'Claude isn’t available on this account, so the worksheet was matched by keywords instead.',
      rate_limited: 'Claude is busy or the usage limit was reached. Try again in a little while.',
      image_rejected: 'That image couldn’t be read. Try a clearer photo, or a JPEG or PNG.',
      session_expired: 'Your claude.ai session expired. Sign in again, then try once more.',
      refused: 'Claude couldn’t help with that file. Try a different photo or paste the text.',
      invalid_json: 'The answer came back garbled. Press “Find it in the lab” to try again.',
      prompt_too_large: 'That worksheet is too long to read at once. Try fewer pages.'
    }[code] || 'Something went wrong while reading the worksheet. Try again.');

    goBtn.addEventListener('click', async () => {
      let text = paste.value.trim();
      if (!files.length && !text) { status.textContent = 'Add a photo, PDF or the worksheet text first.'; return; }
      goBtn.disabled = true; result.replaceChildren();
      try {
        let images = files.filter(f => f.type.startsWith('image/'));
        for (const f of files.filter(f => f.type === 'application/pdf')) {
          status.textContent = 'Opening the PDF…';
          const r = await readPdf(f, MAX_PAGES);
          text += (text ? '\n' : '') + r.text; images = images.concat(r.images);
        }
        for (const f of files.filter(f => f.type === 'text/plain')) text += '\n' + await f.text();
        const sample = await getSample();
        const caps = sample && sample.limits ? await sample.limits().catch(() => null) : null;
        if (!sample || (images.length && !(caps && caps.images) && !text)) {
          if (!text) { status.textContent = sample ? 'Photos can’t be read in this view. Paste the worksheet text instead.' : 'Reading photos works on the published site at claude.ai. Here, paste the worksheet text and it will be matched by keywords.'; return; }
          const c = matchByKeywords(text);
          if (!c) { status.textContent = 'No physics keywords were found. Try pasting more of the worksheet.'; return; }
          status.textContent = 'Matched by keywords (Claude wasn’t available here).';
          await save(c); show(c); return;
        }
        const kind = images.length && caps && caps.images ? 'images' : 'text';
        status.textContent = 'Reading the worksheet… (the first time, you’ll be asked to allow Claude)';
        ctl = new AbortController(); stopBtn.hidden = false;
        const raw = await sample.json(prompt(text, kind), Object.assign({ signal: ctl.signal, modelTier: 'default' }, kind === 'images' ? { images: images.slice(0, caps.images.maxCount) } : {}));
        const c = validate(raw, kind === 'images' ? 'photo' : 'text');
        if (!c.plan.length) { status.textContent = 'Claude read it but couldn’t match it to the lab. Try a clearer photo.'; return; }
        status.textContent = '';
        await save(c); show(c);
      } catch (e) {
        if (e && e.code === 'cancelled') { status.textContent = 'Stopped.'; return; }
        if (e && (e.code === 'not_granted' || e.code === 'sampling_disabled') && (paste.value.trim())) {
          const c = matchByKeywords(paste.value);
          if (c) { status.textContent = copyFor(e.code); await save(c); show(c); return; }
        }
        status.textContent = e && e.code ? copyFor(e.code) : 'Something went wrong: ' + (e && e.message ? e.message : e);
      } finally { goBtn.disabled = false; stopBtn.hidden = true; ctl = null; }
    });
    stopBtn.addEventListener('click', () => ctl && ctl.abort());

    async function save(c) {
      const db = await getDb();
      if (db) { try { await db.collection('worksheets').add(c); return; } catch (e) { /* view-only viewers fall back to this browser */ } }
      local.add(c); drawHistory();
    }
    function show(c) { result.replaceChildren(companion(c)); result.scrollIntoView({ behavior: ADL.ui.reducedMotion() ? 'auto' : 'smooth', block: 'start' }); }
    function drawHistory() {
      const list = saved.concat(local.list()).sort((a, b) => (b.createdAt > a.createdAt ? 1 : -1));
      history.replaceChildren(
        h('h2', { class: 'section-title small' }, 'Earlier worksheets'),
        list.length ? h('ul', { class: 'cc-list' }, list.map(c => h('li', null,
          h('button', { type: 'button', class: 'linkish', onclick: () => show(c) }, c.title), h('span', { class: 'muted small' }, ` · ${fmt.time(c.createdAt)}${c.source === 'keywords' ? ' · keyword match' : ''}`),
          h('button', { type: 'button', class: 'btn small ghost', 'aria-label': 'Delete ' + c.title, onclick: async () => {
            if (!(await ADL.ui.confirmDialog('Delete this plan?', `“${c.title}” will be removed${c._db ? ' for everyone who uses this site' : ' from this browser'}.`, 'Delete', true))) return;

  // A 1 m pendulum (period ≈ 2.0 s) swinging with a slowly fading trail
  function startPendulum(cv, counter) {
    let raf = null, count = 0, lastSide = 0;

    const frame = ts => {

      const side = Math.sign(Math.sin(2 * Math.PI * t / T));

    };

  function md(s) { return String(s || '').replace(/<[^>]+>/g, '').replace(/\|/g, '/'); }
  function markdownReport() {
    const s = store.state, L = [];
    L.push('# Physics Discovery Lab: Research Report', '', `Researchers: ${s.researchers || '(not named)'}  `, `Generated: ${new Date().toLocaleString()}  `, `Mode now: ${s.mode}`, '',
      '> Every investigation result in this report comes from a simulation, labeled by fidelity tier; simulated runs are evidence about models, not laboratory measurements. The kitchen pendulum section is your own measurement.', '');
    for (const d of ADL.chapters) {
      const c = s.chapters[d.id];
      if (!c || (!c.startedAt && !c.runs.length)) continue;
      L.push(`## ${d.kicker}: ${c.discovered && d.solvedTitle ? d.solvedTitle : d.title} (${d.era})`, '',
        `Research question: ${d.question}  `, `Status: ${chapterStatus(d).label}${c.assisted ? ' (assisted discovery)' : ''}  `, `Model: ${d.modelVersion || 'n/a'} · ${ADL.tierInfo[d.tier].label}`, '');
      if (c.hypothesisLog.length) { L.push('### Hypotheses and confidence', ''); c.hypothesisLog.forEach(x => { const hy = d.hypotheses.find(y => y.id === x.id); L.push(`- ${fmt.time(x.at)}: ${hy.letter} (${hy.name}) at ${x.confidence}%${x.reason ? ': ' + x.reason : ''}`); }); c.reviews.forEach(r => L.push(`- ${fmt.time(r.at)}: confidence ${r.before}% → ${r.after}% (${r.reason})${r.text ? ': ' + r.text : ''}`)); L.push(''); }
      if (c.predictions.length) {
        L.push('### Predictions (made before running)', '');
        c.predictions.forEach(p => { const m = d.manipulations.find(x => x.id === p.manipId); const ev = m.evaluate(flow.runsAfter(c, p.at), c.runs.filter(r => !r.demo), c); L.push(`- ${p.id} (${fmt.time(p.at)}): ${m.label}. Predicted: ${m.options.find(o => o.id === p.optionId).text}. ${ev.status === 'observed' ? 'Observed: ' + (m.options.find(o => o.id === ev.outcome) || { text: ev.outcome }).text + (ev.detail ? ' (' + ev.detail + ')' : '') : 'Not yet tested.'}`); });
        L.push('');
      }
      const runs = c.runs.filter(r => !r.demo);
      if (runs.length) {
        L.push('### Runs', '', '| Run | ' + d.tableCols.map(x => x.label).join(' | ') + ' | Seed |', '|' + '---|'.repeat(d.tableCols.length + 2));
        runs.forEach(r => L.push(`| ${r.runId}${(r.world || 'real') !== 'real' ? ' (what-if)' : ''} | ${d.tableCols.map(x => md(x.get(r))).join(' | ')} | ${r.seed} |`));
        L.push('');
      }
      if (c.claims.length) { L.push('### Claims (claim, evidence, reasoning)', ''); c.claims.forEach(x => { const cl = d.claims.find(y => y.id === x.claimId); L.push(`- ${fmt.time(x.at)} ${x.accepted ? '[accepted]' : '[revised later]'} Claim: ${cl.text} Evidence: ${x.runIds.join(', ') || 'none'}. Reasoning: ${x.reasonIds.map(id => d.reasoning.find(r => r.id === id).text).join(' ')} ${x.text || ''}`); }); L.push(''); }
      if (c.challenge && c.challenge.log.length) { L.push('### Referee challenge', '', `- Question: ${md(d.challenge.question)}`); c.challenge.log.forEach(x => L.push(`- Response: ${d.challenge.options.find(o => o.id === x.choice).text}`)); if (c.challenge.resolved) L.push(`- Answered with control runs ${c.challenge.runIds.join(' vs ')}.`); L.push(''); }
      if (c.revisions.length) { L.push('### Revisions', ''); c.revisions.forEach(r => { const to = d.hypotheses.find(x => x.id === r.to); L.push(`- ${fmt.time(r.at)}: ${r.decision} → ${to ? to.letter + ' (' + to.name + ')' : r.to} at ${r.confidence}%. ${r.reason}`); }); L.push(''); }
      if (c.notes) L.push('### Notes', '', c.notes, '');
      if (c.log.length) { L.push('### Research log', ''); c.log.forEach(e => L.push(`- ${fmt.time(e.at)} · ${e.type}: ${md(e.text)}`)); L.push(''); }
    }
    const hl = s.homeLab && s.homeLab.points;
    if (hl && hl.length) { L.push('## Kitchen pendulum measurements (your own data)', '', '| Length (m) | Release | Swings | Period (s) | Method |', '|---|---|---|---|---|'); hl.forEach(x => L.push(`| ${x.L.toFixed(3)} | ${x.release} | ${x.n} | ${x.T.toFixed(3)} ± ${x.se.toFixed(3)} | ${x.method} |`)); L.push(''); }
    const p = s.practice;
    if (p && p.attempted) { L.push('## Problem practice', '', `Solved ${p.correct} of ${p.attempted}; best streak ${p.best}.`, ''); p.history.slice(-40).forEach(x => L.push(`- ${fmt.time(x.at)} · ${topicLabel(x.topic)} · ${x.title} · ${x.correct ? 'solved' : 'not yet'}${x.solutionViewed ? ' (viewed solution)' : ''}`)); L.push(''); }
    return L.join('\n');
  }

  function runsCsv(d) {
    const c = store.state.chapters[d.id];
    const runs = c ? c.runs.filter(r => !r.demo) : [];
    const ctl = (d.controls || []).map(x => x.id);
    const resKeys = runs.length ? Object.keys(runs[0].results).filter(k => !Array.isArray(runs[0].results[k]) && typeof runs[0].results[k] !== 'object') : [];
    const q = v => { const t = v === null || v === undefined ? '' : String(v); return /[",\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
    const rows = [['runId', 'timestamp', 'mode', 'world', 'modelVersion', 'seed'].concat(ctl.map(k => 'control_' + k), resKeys.map(k => 'result_' + k))];
    runs.forEach(r => rows.push([r.runId, r.at, r.mode, r.world || 'real', r.modelVersion, r.seed].concat(ctl.map(k => r.controls[k]), resKeys.map(k => r.results[k]))));
    return rows.map(r => r.map(q).join(',')).join('\n') + '\n';
  }

  function glossary(query) {
    const q = h('input', { type: 'search', class: 'text-input', placeholder: 'Search terms…', 'aria-label': 'Search glossary', value: query || '' });
    const list = h('div');
    const groups = [ADL.glossary.TOPIC_SCIENCE].concat(TOPICS);
    const draw = () => {
      const t = q.value.trim().toLowerCase();
      const hits = ADL.glossary.terms.filter(e => !t || e.term.toLowerCase().includes(t) || e.def.toLowerCase().includes(t));
      list.replaceChildren(...groups.map(([id, label]) => {
        const g = hits.filter(e => e.topic === id).sort((a, b) => a.term.localeCompare(b.term));
        return g.length ? h('section', { class: 'glossary-group' }, h('h3', null, label), h('dl', { class: 'glossary' }, g.flatMap(e => [h('dt', null, e.term), h('dd', null, e.def)]))) : null;
      }).filter(Boolean), ...(hits.length ? [] : [h('p', { class: 'muted' }, 'No terms match.')]));
    };
    q.addEventListener('input', draw); draw();
    return h('div', null, h('p', { class: 'muted small' }, `${ADL.glossary.terms.length} terms. Words with a dotted underline anywhere on the site open these definitions.`), q, list);
  }

  function mathHelpers() {
    const out = (el, html) => { el.innerHTML = html; };
    const num = (v, label) => h('input', { type: 'text', inputmode: 'decimal', class: 'num', value: v, 'aria-label': label });
    // scientific notation
    const sciIn = h('input', { type: 'text', class: 'text-input', placeholder: 'e.g. 0.000000000066743 or 6.6743e-11', 'aria-label': 'Number to convert' });
    const sciOut = h('p', { class: 'calc-out' });
    sciIn.addEventListener('input', () => { const v = ADL.parseNumber(sciIn.value); out(sciOut, v === null ? '' : `${fmt.sci(v, 4)}<br><span class="muted">plain: ${Math.abs(v) < 1e21 ? v.toLocaleString('en-US', { maximumSignificantDigits: 6 }) : '(too large to write out)'}</span>`); });
    // speed units
    const spIn = num('100', 'Speed value');
    const spUnit = h('select', { class: 'select compact', 'aria-label': 'Speed unit' }, ['km/h', 'm/s', 'mph', 'ft/s', 'knots'].map(u => h('option', { value: u }, u)));
    const spOut = h('p', { class: 'calc-out' });
    const toMs = { 'km/h': 1 / 3.6, 'm/s': 1, mph: 0.44704, 'ft/s': 0.3048, knots: 1852 / 3600 };
    const sp = () => { const v = ADL.parseNumber(spIn.value); if (v === null) { out(spOut, ''); return; } const ms = v * toMs[spUnit.value]; out(spOut, Object.keys(toMs).map(u => `${fmt.num(ms / toMs[u], 4)} ${u}`).join(' = ')); };
    spIn.addEventListener('input', sp); spUnit.addEventListener('change', sp); sp();
    // vector components
    const vMag = num('20', 'Vector magnitude'), vAng = num('35', 'Angle above the horizontal in degrees');
    const vOut = h('p', { class: 'calc-out' });
    const vc = () => { const m = ADL.parseNumber(vMag.value), a = ADL.parseNumber(vAng.value); if (m === null || a === null) { out(vOut, ''); return; } const r = a * Math.PI / 180; out(vOut, `x-component = ${fmt.num(m, 4)} × cos ${fmt.num(a, 4)}° = <strong>${fmt.num(m * Math.cos(r), 4)}</strong><br>y-component = ${fmt.num(m, 4)} × sin ${fmt.num(a, 4)}° = <strong>${fmt.num(m * Math.sin(r), 4)}</strong>`); };
    [vMag, vAng].forEach(i => i.addEventListener('input', vc)); vc();
    // free fall from rest
    const ffH = num('20', 'Drop height in metres'), ffG = h('select', { class: 'select compact', 'aria-label': 'Where' }, [['9.81', 'Earth'], ['1.62', 'Moon'], ['3.71', 'Mars'], ['24.8', 'Jupiter']].map(([v, l]) => h('option', { value: v }, `${l} (g = ${v} m/s²)`)));
    const ffOut = h('p', { class: 'calc-out' });
    const ff = () => { const hgt = ADL.parseNumber(ffH.value), g = +ffG.value; if (!(hgt > 0)) { out(ffOut, 'Enter a positive height.'); return; } const t = Math.sqrt(2 * hgt / g), v = g * t; out(ffOut, `t = √(2h/g) = <strong>${fmt.num(t, 3)} s</strong>, landing speed v = gt = <strong>${fmt.num(v, 3)} m/s</strong> (${fmt.num(v * 3.6, 3)} km/h) <span class="muted">(no air resistance)</span>`); };
    ffH.addEventListener('input', ff); ffG.addEventListener('change', ff); ff();
    // pendulum period
    const pL = num('1.00', 'Pendulum length in metres');
    const pOut = h('p', { class: 'calc-out' });
    const pp = () => { const L = ADL.parseNumber(pL.value); if (!(L > 0)) { out(pOut, 'Enter a positive length.'); return; } const T = 2 * Math.PI * Math.sqrt(L / 9.81); out(pOut, `T = 2π√(L/g) = <strong>${fmt.num(T, 3)} s</strong> per full swing <span class="muted">(small swings, g = 9.81 m/s²)</span>`); };
    pL.addEventListener('input', pp); pp();
    return h('div', { class: 'calcs' },
      h('section', { class: 'calc' }, h('h3', null, 'Scientific notation'), sciIn, sciOut),
      h('section', { class: 'calc' }, h('h3', null, 'Speed units'), h('div', { class: 'calc-row' }, spIn, spUnit), spOut),
      h('section', { class: 'calc' }, h('h3', null, 'Vector components'), h('div', { class: 'calc-row' }, h('label', null, 'Size ', vMag), h('label', null, 'Angle ° ', vAng)), vOut),
      h('section', { class: 'calc' }, h('h3', null, 'Dropped from rest'), h('div', { class: 'calc-row' }, h('label', null, 'Height (m) ', ffH), ffG), ffOut),
      h('section', { class: 'calc' }, h('h3', null, 'Pendulum period'), h('div', { class: 'calc-row' }, h('label', null, 'Length (m) ', pL)), pOut));
  }

      ADL.ui.seg({ label: 'Text size', options: [{ value: 1, label: '100%' }, { value: 1.15, label: '115%' }, { value: 1.3, label: '130%' }, { value: 1.5, label: '150%' }], value: p.textScale || 1, onInput: v => { p.textScale = v; save(); } }).el,
      ADL.ui.toggle({ label: 'High contrast', value: p.contrast, onInput: v => { p.contrast = v; save(); } }).el,
      ADL.ui.seg({ label: 'Animation', options: [{ value: 'auto', label: 'Follow my device' }, { value: 'on', label: 'Reduce motion' }, { value: 'off', label: 'Allow motion' }], value: p.motion || 'auto', onInput: v => { p.motion = v; save(); } }).el,
      h('p', { class: 'muted small' }, 'Every chart has a “Show as table” switch, every animation has a text description, and every control works from the keyboard.'));
  }

  /* ---------- boot ---------- */
  function boot() {
    buildShell(); applyPrefs();
    root.addEventListener('hashchange', route);
    ADL.route = route;
    ADL.openToolkit = openToolkit;
    store.on(e => { if (e.type === 'prefs') applyPrefs(); });
    route();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(window);

</script>

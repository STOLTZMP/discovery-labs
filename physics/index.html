<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Physics Discovery Lab</title>
<meta name="description" content="Rediscover the laws of motion from evidence, explore physics simulations, measure real motion at home, and practice real-world physics problems.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Physics Discovery Lab · stylesheet
   Layout concept: a researcher's engineering pad (lavender graph paper, ruled panels)
   with dark indigo instrument windows set into it, where the apparatus glows like phosphor.
   Same frame as Atomic Discovery Lab, recolored violet so the two sites are easy to tell apart:
   the --brass* token names are kept for the shared contracts, but here they hold the violet accent.
   Display face from early-20th-century journals; a hyperlegible body face; mono for data. */
:root {
  --font-display: "Old Standard TT", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --paper: #EEEBF5;
  --paper-2: #E5E0F0;
  --surface: #FAF9FD;
  --surface-2: #F2EFF9;
  --ink: #1D1730;
  --ink-2: #554C6E;
  --rule: #D4CCE5;
  --rule-strong: #A69BC2;
  --grid-line: rgba(96, 66, 176, 0.10);
  /* the accent: violet (names kept from the chemistry site) */
  --brass: #6A3EC2;
  --brass-ink: #5430A6;
  --brass-soft: #E3D8F7;
  --on-brass: #FFFDFF;
  --mark-ring: #A88CF0;
  --focus: #1C64B4;
  --good: #2C6B42; --good-bg: #DCEADC;
  --warn: #8F5410; --warn-bg: #F4E5CC;
  --bad: #A2382A; --bad-bg: #F3DAD4;
  --highlight: rgba(124, 82, 214, 0.18);
  --chart-1: #6E45C8; --chart-2: #1D776A; --chart-3: #B0442E; --chart-4: #A8721A;
  --chart-grid: rgba(29, 23, 48, 0.10);
  --shadow: 0 1px 0 rgba(29, 23, 48, 0.04), 0 6px 18px -12px rgba(29, 23, 48, 0.25);

  /* instrument windows stay dark in both themes */
  --scope-bg: #0B0917; --scope-grid: #191430; --scope-ink: #E3DDF5; --scope-dim: #9D94BD; --glow: #8DF7CF; --scope-brass: #D9A84A;
  --c-alpha: #F2B33D; --c-electron: #5EC8F2; --c-proton: #F0685A; --c-neutron: #AEBBB8; --c-photon: #B79CFA; --c-ion: #E58AF0;
  --cpk-h: #EEF2F0; --cpk-c: #858D94; --cpk-n: #5B8CFF; --cpk-o: #FF5A4E; --cpk-cl: #4FD06B; --cpk-na: #B07CFF; --cpk-s: #F5D33F; --cpk-metal: #B9C2CC;

  --radius: 8px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --text-scale: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #100D19; --paper-2: #151121; --surface: #1B1629; --surface-2: #221C33; --ink: #ECE7F6; --ink-2: #AFA6C6;
    --rule: #2F2844; --rule-strong: #4B4166; --grid-line: rgba(176, 150, 245, 0.05);
    --brass: #B69BFA; --brass-ink: #CBB7FF; --brass-soft: #2F2152; --on-brass: #150C2B; --focus: #7FB5FF;
    --good: #7CC796; --good-bg: #17301F; --warn: #E6AA58; --warn-bg: #33270F; --bad: #F28A77; --bad-bg: #3B1C17;
    --highlight: rgba(182, 155, 250, 0.16);
    --chart-1: #B69BFA; --chart-2: #52C3AF; --chart-3: #F28A77; --chart-4: #E2AF57; --chart-grid: rgba(236, 231, 246, 0.10);
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 8px 22px -14px rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #100D19; --paper-2: #151121; --surface: #1B1629; --surface-2: #221C33; --ink: #ECE7F6; --ink-2: #AFA6C6;
  --rule: #2F2844; --rule-strong: #4B4166; --grid-line: rgba(176, 150, 245, 0.05);
  --brass: #B69BFA; --brass-ink: #CBB7FF; --brass-soft: #2F2152; --on-brass: #150C2B; --focus: #7FB5FF;
  --good: #7CC796; --good-bg: #17301F; --warn: #E6AA58; --warn-bg: #33270F; --bad: #F28A77; --bad-bg: #3B1C17;
  --highlight: rgba(182, 155, 250, 0.16);
  --chart-1: #B69BFA; --chart-2: #52C3AF; --chart-3: #F28A77; --chart-4: #E2AF57; --chart-grid: rgba(236, 231, 246, 0.10);
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 8px 22px -14px rgba(0, 0, 0, 0.7);
  color-scheme: dark;
}
:root.hc { --ink-2: var(--ink); --rule: var(--rule-strong); --chart-grid: rgba(127, 127, 127, 0.35); --grid-line: transparent; }

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: calc(16px * var(--text-scale)); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); background-color: var(--paper);
  background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 24px 24px;
  font: 400 1rem/1.55 var(--font-body);
  min-height: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; }
h1, h2 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.005em; }
h3 { font-size: 1rem; margin: 0 0 .4rem; }
p { margin: 0 0 .7rem; }
a { color: var(--brass-ink); text-underline-offset: 3px; }
a:hover { color: var(--ink); }
img, canvas { max-width: 100%; }
sub, sup { line-height: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.hc :focus-visible { outline-width: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 12px; top: -48px; z-index: 50; background: var(--ink); color: var(--surface); padding: .5rem .8rem; border-radius: 6px; }
.skip:focus { top: calc(env(safe-area-inset-top, 0px) + 8px); }
.muted { color: var(--ink-2); }
.small { font-size: .875rem; }
.mono, .chip.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
main { display: block; min-height: 60vh; outline: none; }
.eyebrow { font-family: var(--font-data); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 .5rem; }
.eyebrow a { color: inherit; }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--rule); }
.topbar-inner { max-width: 1480px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: .55rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: .55rem; text-decoration: none; color: var(--ink); }
.brand-mark { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--scope-bg); color: var(--glow); font-family: var(--font-display); font-style: italic; font-size: 1.15rem; box-shadow: 0 0 0 2px var(--mark-ring) inset; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; white-space: nowrap; }
.topnav { display: flex; gap: .15rem; flex-wrap: wrap; flex: 1 1 auto; }
.topnav a { text-decoration: none; color: var(--ink-2); padding: .4rem .65rem; border-radius: 6px; font-weight: 600; font-size: .95rem; }
.topnav a:hover { color: var(--ink); background: var(--surface-2); }
.topnav a.active { color: var(--ink); background: var(--brass-soft); }
.topbar-tools { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
.mode-label { font-size: .8rem; color: var(--ink-2); font-family: var(--font-data); text-transform: uppercase; letter-spacing: .06em; }
@media (max-width: 760px) {
  .topbar-inner { gap: .4rem .6rem; }
  .topnav { order: 3; flex-basis: 100%; overflow-x: auto; flex-wrap: nowrap; }
  .topnav a { white-space: nowrap; }
  .mode-label { display: none; }
}

/* ---------- buttons & inputs ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; font: 600 .95rem/1.2 var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 6px; padding: .55rem .95rem; cursor: pointer; text-decoration: none; min-height: 2.5rem; }
.btn:hover { background: var(--surface-2); color: var(--ink); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--brass); border-color: var(--brass); color: var(--on-brass); }
.btn.primary:hover { filter: brightness(1.08); color: var(--on-brass); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--brass-ink); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { font-size: .85rem; padding: .35rem .65rem; min-height: 2rem; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn-row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-top: .6rem; }
.linkish { background: none; border: 0; padding: 0; color: var(--brass-ink); text-decoration: underline; cursor: pointer; font: inherit; }
.select, .text-input, .textarea, .num { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 6px; padding: .45rem .6rem; }
.select { width: 100%; min-height: 2.4rem; }
.select.compact { width: auto; min-height: 2rem; padding: .25rem .5rem; font-size: .9rem; }
.text-input { width: 100%; }
.textarea { width: 100%; resize: vertical; margin-top: .5rem; line-height: 1.45; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; width: 6.5rem; padding: .3rem .45rem; font-size: .9rem; }
.num.wide { width: 11rem; font-size: 1rem; padding: .45rem .6rem; }
.unit { color: var(--ink-2); font-family: var(--font-data); font-size: .85rem; }
.file-input { margin-bottom: .5rem; max-width: 100%; }

/* controls (shared widgets) */
.control { display: grid; gap: .3rem; min-width: 0; }
.control[hidden] { display: none; }
.control-head { display: flex; justify-content: space-between; align-items: center; gap: .6rem; flex-wrap: wrap; }
.control-head label, .control-label { font-weight: 700; font-size: .92rem; }
.control-value { display: inline-flex; align-items: center; gap: .3rem; }
.control input[type="range"] { width: 100%; accent-color: var(--brass); min-height: 1.6rem; }
.control-help { font-size: .82rem; color: var(--ink-2); margin: 0; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rule-strong); border-radius: 6px; overflow: hidden; background: var(--surface); width: fit-content; max-width: 100%; }
.seg-btn { font: 600 .88rem/1.2 var(--font-body); color: var(--ink); background: transparent; border: 0; border-right: 1px solid var(--rule); padding: .45rem .75rem; cursor: pointer; min-height: 2.2rem; }
.seg-btn:last-child { border-right: 0; }
.seg-btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg-btn:hover:not([aria-pressed="true"]) { background: var(--surface-2); }
.switch { display: inline-flex; align-items: center; gap: .55rem; cursor: pointer; position: relative; font-weight: 600; font-size: .9rem; }
.switch-input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch-track { width: 38px; height: 22px; border-radius: 11px; background: var(--rule-strong); position: relative; flex: none; transition: background .15s; }
.switch-track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.switch-input:checked + .switch-track { background: var(--brass); }
.switch-input:checked + .switch-track::after { transform: translateX(16px); }
.switch-input:focus-visible + .switch-track { outline: 3px solid var(--focus); outline-offset: 2px; }
.readouts { margin: 0; display: grid; gap: 0; }
.readout { display: flex; justify-content: space-between; gap: 1rem; padding: .4rem 0; border-bottom: 1px dotted var(--rule); align-items: baseline; }
.readout dt { color: var(--ink-2); font-size: .9rem; }
.readout dd { margin: 0; text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: .92rem; }
.readout-num { color: var(--ink); font-weight: 600; }

/* chips, pills, notes, feedback */
.chip { display: inline-flex; align-items: center; gap: .3rem; font-size: .78rem; padding: .15rem .5rem; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--rule); color: var(--ink); white-space: nowrap; }
.chip.field { background: var(--brass-soft); border-color: transparent; }
.chip.toggle { cursor: pointer; font: 600 .82rem/1.2 var(--font-body); padding: .35rem .7rem; }
.chip.toggle[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.pill { display: inline-block; font-size: .78rem; font-weight: 700; padding: .12rem .5rem; border-radius: 4px; margin: .3rem 0 0; }
.pill-info { background: var(--surface-2); color: var(--ink); border: 1px solid var(--rule); }
.pill-wait { background: transparent; color: var(--ink-2); border: 1px dashed var(--rule-strong); }
.pill-good { background: var(--good-bg); color: var(--good); }
.pill-warn { background: var(--warn-bg); color: var(--warn); }
.note { background: var(--surface-2); border: 1px solid var(--rule); border-radius: var(--radius); padding: .7rem .85rem; margin: .6rem 0; font-size: .95rem; }
.note small { display: block; color: var(--ink-2); margin-top: .25rem; }
.note.good-note { background: var(--good-bg); border-color: transparent; }
.note.warn-note { background: var(--warn-bg); border-color: transparent; }
.note.guide { background: var(--brass-soft); border-color: transparent; }
.feedback { margin: .45rem 0 0; font-size: .92rem; }
.feedback.good { color: var(--good); }
.feedback.warn { color: var(--warn); }
.feedback:empty { display: none; }
.feedback-list { list-style: none; padding: 0; margin: .7rem 0 0; display: grid; gap: .4rem; }
.feedback-list li { padding: .55rem .75rem; border-radius: 6px; font-size: .93rem; }
.fb-good { background: var(--good-bg); color: var(--ink); }
.fb-warn { background: var(--warn-bg); }
.fb-stop { background: var(--surface-2); border: 1px solid var(--rule-strong); }
.eq { font-family: var(--font-data); background: var(--surface-2); border: 1px solid var(--rule); border-radius: 6px; padding: .5rem .75rem; margin: .5rem 0; overflow-x: auto; font-size: .92rem; }
.prose { max-width: 68ch; }
.prose ul { padding-left: 1.2rem; }

/* tables */
.table-wrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); }
.data-table { border-collapse: collapse; width: 100%; font-size: .86rem; font-variant-numeric: tabular-nums; }
.data-table th, .data-table td { text-align: left; padding: .4rem .55rem; border-bottom: 1px solid var(--rule); white-space: nowrap; vertical-align: top; }
.data-table thead th { font-family: var(--font-data); font-size: .75rem; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); background: var(--surface-2); }
.data-table tbody th { font-weight: 600; }
.data-table tr:last-child td, .data-table tr:last-child th { border-bottom: 0; }
.data-table small { color: var(--ink-2); font-weight: 400; }
.data-table tr.changed { background: var(--highlight); }
.data-table tr.result th { color: var(--ink); }
.runs-table tr.whatif { color: var(--ink-2); font-style: italic; }

/* tabs */
.tabs { display: flex; gap: .2rem; border-bottom: 1px solid var(--rule); margin-bottom: .8rem; overflow-x: auto; }
.tab { font: 600 .9rem/1.2 var(--font-body); background: none; border: 0; border-bottom: 3px solid transparent; padding: .55rem .7rem; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brass); }

/* toast & modal */
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); transform: translate(-50%, 20px); background: var(--ink); color: var(--surface); padding: .6rem 1rem; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; max-width: calc(100vw - 32px); font-size: .92rem; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.modal-wrap { position: fixed; inset: 0; background: rgba(12, 8, 22, 0.55); z-index: 55; display: grid; place-items: center; padding: 16px; padding-top: calc(env(safe-area-inset-top, 0px) + 16px); }
.modal { background: var(--surface); color: var(--ink); border-radius: 10px; padding: 1.2rem 1.3rem; width: min(480px, 100%); box-shadow: 0 20px 60px -20px rgba(0, 0, 0, .5); max-height: calc(100vh - 48px); overflow: auto; }
.modal h2 { font-size: 1.35rem; margin: 0 0 .6rem; }
.modal-actions { display: flex; justify-content: flex-end; gap: .5rem; margin-top: 1rem; flex-wrap: wrap; }
.modal.sheet { width: min(760px, 100%); padding: 0; display: flex; flex-direction: column; }
.modal.sheet.wide { width: min(980px, 100%); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .9rem 1.2rem; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--surface); }
.sheet-head h2 { margin: 0; }
.sheet-body { padding: 1rem 1.2rem 1.4rem; overflow: auto; }
.export-text { font-family: var(--font-data); font-size: .8rem; }

/* ---------- page sections ---------- */
.section-inner { max-width: 1200px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.band { padding-block: 2.6rem; }
.band.tight { padding-block: 1.4rem; }
.band.alt { background: var(--paper-2); border-block: 1px solid var(--rule); }
.section-title { font-size: 1.7rem; margin: 0 0 .5rem; }
.section-title.small { font-size: 1.3rem; margin-top: .6rem; }
.section-lede { color: var(--ink-2); max-width: 68ch; font-size: 1.05rem; }
.page-head { padding-block: 2.2rem 1rem; }
.page-head.compact { padding-block: 1.4rem .4rem; }
.page-title { font-size: clamp(1.9rem, 4vw, 2.8rem); margin: 0 0 .6rem; }
.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 2.5rem; }

/* hero */
.hero { padding-block: 2.8rem 2rem; }
.hero-inner { max-width: 1200px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .9fr); gap: 2.5rem; align-items: center; }
.hero-title { font-size: clamp(2.5rem, 6.5vw, 4.4rem); margin: 0 0 .8rem; line-height: 1.02; }
.lede { font-size: 1.15rem; max-width: 56ch; color: var(--ink); }
.hero-actions { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1.2rem 0; }
.researchers { display: grid; gap: .3rem; max-width: 340px; }
.researchers label { font-family: var(--font-data); font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.hero-figure { margin: 0; display: grid; gap: .7rem; justify-items: center; }
.eyepiece { width: min(100%, 360px); aspect-ratio: 1; display: block; }
.hero-figure figcaption { font-size: .88rem; color: var(--ink-2); max-width: 40ch; text-align: center; }
.eyepiece-count { color: var(--ink); }
@media (max-width: 820px) { .hero-inner { grid-template-columns: 1fr; } .eyepiece { width: min(100%, 280px); } }

.wings { padding-block: .5rem 2rem; }
.wings .section-inner { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 1rem; }
.wing { display: grid; gap: .35rem; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 1.1rem 1.2rem; box-shadow: var(--shadow); }
.wing:hover { border-color: var(--brass); color: var(--ink); }
.wing-title { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; }
.wing-stat { font-size: .8rem; color: var(--brass-ink); }
.wing-text { color: var(--ink-2); font-size: .95rem; }

.chapter-list { list-style: none; padding: 0; margin: 1.2rem 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 1rem; counter-reset: none; }
.chapter-card { display: grid; gap: .4rem; height: 100%; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 1rem 1.1rem; grid-template-rows: auto auto 1fr auto; }
.chapter-card:hover { border-color: var(--brass); color: var(--ink); }
.cc-kicker { font-family: var(--font-data); font-size: .76rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); display: flex; justify-content: space-between; gap: .5rem; }
.cc-title { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; line-height: 1.2; }

.tier-mini { font-family: var(--font-data); font-size: .7rem; padding: .1rem .4rem; border-radius: 3px; border: 1px solid var(--rule-strong); color: var(--ink-2); white-space: nowrap; }

/* ---------- simulation lab ---------- */
.sim-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 1rem; margin-top: 1rem; }
.sim-card { display: grid; gap: .35rem; align-content: start; text-align: left; font: inherit; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 1rem 1.1rem; cursor: pointer; }

.sim-title-row { display: flex; flex-wrap: wrap; gap: .8rem 1.2rem; align-items: center; justify-content: space-between; }

.make-problem .control { width: auto; }
.problem-host:not(:empty) { margin-top: 1.4rem; }

/* simulation markup contract */
.sim { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); gap: 1.2rem; align-items: start; }
.sim-main, .sim-side { display: grid; gap: 1rem; min-width: 0; }

.sim-panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: .9rem 1rem; min-width: 0; display: grid; gap: .75rem; align-content: start; }
.panel-title { font-family: var(--font-data); font-size: .76rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); margin: 0; font-weight: 600; }
.scope { position: relative; background: var(--scope-bg); border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px var(--rule-strong), inset 0 0 40px rgba(0, 0, 0, .6); }
.scope-canvas { display: block; width: 100%; aspect-ratio: 16 / 10; max-width: 100%; }
.scope-tag { position: absolute; bottom: 8px; right: 10px; font-family: var(--font-data); font-size: .72rem; color: var(--scope-dim); pointer-events: none; }
.scope-tag:empty { display: none; }
.sim-caption { font-size: .92rem; color: var(--ink-2); margin: 0; min-height: 2.6em; }
canvas.chart { display: block; width: 100%; aspect-ratio: 16 / 10; min-height: 220px; max-height: 420px; max-width: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: .4rem 1rem; font-size: .85rem; color: var(--ink-2); }
.key { display: inline-flex; align-items: center; gap: .35rem; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }

/* ---------- problem studio ---------- */
.studio-bar { display: grid; grid-template-columns: auto minmax(180px, 260px) minmax(0, 1fr); gap: 1rem 1.4rem; align-items: start; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 1rem 1.1rem; }
.studio-go { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .8rem 1.2rem; align-items: center; }
.studio-stats { margin: 0; color: var(--ink-2); font-size: .85rem; }
.field-chips { display: flex; flex-wrap: wrap; gap: .35rem; }
@media (max-width: 860px) { .studio-bar { grid-template-columns: 1fr; } }
.problem { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--shadow); margin-top: 1.2rem; overflow: hidden; }
.problem-head { padding: 1.1rem 1.3rem .4rem; }

.context { font-size: 1.04rem; max-width: 68ch; }
.mini-head { font-family: var(--font-data); font-size: .74rem; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); margin: 1rem 0 .4rem; font-weight: 600; display: block; }
.problem-side .mini-head { margin-top: 0; }
.principle-name { font-family: var(--font-display); font-weight: 700; font-size: 1.12rem; margin-bottom: .3rem; }
.history-who { font-weight: 700; margin-bottom: .3rem; }
.career-list { margin: 0; padding-left: 1.1rem; }
.parts { padding-left: 1.3rem; display: grid; gap: 1rem; margin: 1rem 0; }

.answer-row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.hint-box { display: grid; gap: .5rem; margin-top: .7rem; }

/* notebook & toolkit */

.glossary dd { margin: 0; color: var(--ink-2); }

.calcs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 1rem; }
.calc { background: var(--surface-2); border: 1px solid var(--rule); border-radius: var(--radius); padding: .8rem .9rem; display: grid; gap: .5rem; align-content: start; }

/* ---------- workspace ---------- */
.ws { max-width: 1480px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 1.1rem 2rem; }
.ws-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem 2rem; flex-wrap: wrap; margin-bottom: .9rem; }
.ws-head-main { min-width: 0; flex: 1 1 420px; }
.ws-title { font-size: clamp(1.7rem, 3.2vw, 2.4rem); margin: 0 0 .3rem; }

.tier-badge { display: inline-flex; align-items: center; gap: .5rem; font: 600 .85rem/1.2 var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 999px; padding: .3rem .8rem .3rem .3rem; cursor: pointer; flex-wrap: wrap; }

@media (max-width: 480px) { .tier-badge { border-radius: 1rem; padding-right: 1rem; } .tier-more { flex-basis: 100%; padding-left: 2.1rem; text-align: left; } }

.tracker { margin: 0 0 1rem; overflow-x: auto; scrollbar-width: thin; }
.tracker-list { list-style: none; margin: 0; padding: 0 0 .3rem; display: flex; gap: .25rem; min-width: max-content; }
.tracker-step { display: inline-flex; align-items: center; gap: .4rem; font: 600 .85rem/1.2 var(--font-body); color: var(--ink-2); background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: .3rem .7rem .3rem .3rem; cursor: pointer; }
.tracker-step:disabled { opacity: .45; cursor: not-allowed; }
.tracker-num { width: 1.45rem; height: 1.45rem; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-data); font-size: .75rem; border: 1px solid var(--rule-strong); }
.tracker-step.done .tracker-num { background: var(--good-bg); color: var(--good); border-color: transparent; }

.ws-grid { display: grid; grid-template-columns: minmax(300px, 350px) minmax(0, 1fr) minmax(320px, 390px); grid-template-areas: "inv app data"; gap: 1.1rem; align-items: start; }
.ws-inv { grid-area: inv; } .ws-app { grid-area: app; } .ws-data { grid-area: data; }
.pane { min-width: 0; display: grid; gap: .9rem; align-content: start; }
.ws-data { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: .4rem .9rem 1rem; }
.pane-tabs { display: none; }
.mobile-runbar { display: none; }
@media (max-width: 1239px) {
  .ws-grid { grid-template-columns: minmax(290px, 340px) minmax(0, 1fr); grid-template-areas: "inv app" "data data"; }
}
@media (max-width: 899px) {
  .ws-grid { grid-template-columns: minmax(0, 1fr); grid-template-areas: "inv" "app" "data"; }
  .pane-tabs { display: flex; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); z-index: 10; background: var(--paper); border-bottom: 1px solid var(--rule); margin-bottom: .8rem; }
  .pane-tab { flex: 1; font: 700 .92rem/1.2 var(--font-body); background: none; border: 0; border-bottom: 3px solid transparent; padding: .65rem .4rem; color: var(--ink-2); cursor: pointer; }
  .pane-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brass); }
  .ws[data-pane="investigate"] .pane:not([data-pane="investigate"]),
  .ws[data-pane="apparatus"] .pane:not([data-pane="apparatus"]),
  .ws[data-pane="data"] .pane:not([data-pane="data"]) { display: none; }
  .ws.has-runbar { padding-bottom: calc(5rem + env(safe-area-inset-bottom, 0px)); }
  .mobile-runbar { display: flex; gap: .5rem; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--rule); padding: .6rem var(--gutter-r) calc(.6rem + env(safe-area-inset-bottom, 0px)) var(--gutter-l); }
  .mobile-runbar .btn { flex: 1; }
  .ws-app .run-row { display: none; }
}
@media (min-width: 900px) { .narrow-only { display: none; } }
@media (max-width: 760px) { .pane-tabs { top: calc(env(safe-area-inset-top, 0px) + 96px); } }

.stage-card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 1rem 1.1rem 1.1rem; box-shadow: var(--shadow); }
.stage-step { font-family: var(--font-data); font-size: .74rem; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 .2rem; }
.stage-card h2 { font-size: 1.55rem; margin: 0 0 .15rem; }
.stage-card h2:focus { outline: none; }
.stage-sub { color: var(--ink-2); margin-bottom: .8rem; }
.stage-body { display: grid; gap: .4rem; }
.stage-next { border-top: 1px solid var(--rule); margin-top: 1rem; padding-top: .8rem; display: flex; justify-content: flex-end; }
.letter { font-family: var(--font-display); font-size: 1.04rem; line-height: 1.55; background: var(--surface-2); border: 1px dashed var(--rule-strong); border-radius: 6px; padding: .8rem .95rem; }
.letter strong:first-child { font-family: var(--font-data); font-size: .74rem; letter-spacing: .07em; text-transform: uppercase; font-weight: 600; color: var(--ink-2); }
.anomaly { border: 1px solid var(--chart-3); border-radius: 6px; padding: .7rem .9rem; margin-top: .5rem; }
.anomaly-tag { font-family: var(--font-data); font-size: .74rem; letter-spacing: .07em; text-transform: uppercase; color: var(--chart-3); margin: 0 0 .3rem; font-weight: 600; }
.anomaly p:last-child { margin: 0; }
.sort-list { list-style: none; padding: 0; margin: .4rem 0; display: grid; gap: .6rem; }
.sort-item { border: 1px solid var(--rule); border-radius: 6px; padding: .6rem .7rem; display: grid; gap: .45rem; }
.sort-item.ok { border-color: var(--good); }
.sort-item.miss { border-color: var(--warn); }
.sort-text { margin: 0; }
.choice-cards { display: grid; gap: .5rem; }
.choice-card { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: .6rem; align-items: start; border: 1px solid var(--rule); border-radius: 6px; padding: .65rem .7rem; cursor: pointer; background: var(--surface); }
.choice-card:has(input:checked) { border-color: var(--brass); background: var(--brass-soft); }
.choice-card input { margin-top: .3rem; accent-color: var(--brass); }
.choice-letter { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; line-height: 1; }
.choice-body { display: grid; gap: .15rem; font-size: .93rem; }
.choice-list { display: grid; gap: .35rem; }
.choice-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .55rem; align-items: start; padding: .35rem .2rem; cursor: pointer; font-size: .95rem; }
.choice-row input { margin-top: .25rem; accent-color: var(--brass); }
.predict-box, .cer { border: 1px solid var(--rule); border-radius: 6px; padding: .6rem .8rem .7rem; margin: .5rem 0 0; min-width: 0; }

.cer-tag { display: inline-grid; place-items: center; width: 1.4rem; height: 1.4rem; border-radius: 4px; background: var(--ink); color: var(--surface); font-family: var(--font-data); font-size: .8rem; margin-right: .45rem; }
.cite-list { display: grid; gap: .2rem; max-height: 240px; overflow-y: auto; }
.cite-row { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: .5rem; align-items: start; font-size: .86rem; padding: .25rem 0; cursor: pointer; }

.pred-list { padding-left: 1rem; display: grid; gap: .4rem; font-size: .92rem; }
.pv-list { display: grid; gap: .7rem; }
.pv { border: 1px solid var(--rule); border-radius: 6px; padding: .6rem .75rem; }

@media (max-width: 420px) { .pv-grid { grid-template-columns: 1fr; } }
.referee { background: var(--surface-2); border: 1px solid var(--rule); border-radius: 6px; padding: .75rem .9rem; }

.referee-q { font-family: var(--font-display); font-style: italic; font-size: 1.08rem; margin: 0; }
.checklist { list-style: none; padding: 0; margin: .3rem 0; display: grid; gap: .4rem; font-size: .92rem; }

.evidence { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: .6rem .9rem; }

.reveal { display: grid; gap: .3rem; }
.reveal section h3, .reveal-inline h3 { font-family: var(--font-display); font-size: 1.12rem; margin: .7rem 0 .3rem; }

.reveal-inline summary, .derivation summary { cursor: pointer; font-weight: 700; color: var(--brass-ink); }

.sources ul { font-size: .9rem; }
.check-q { border: 1px solid var(--rule); border-radius: 6px; padding: .7rem .85rem; margin-top: .8rem; display: grid; gap: .3rem; }

.surprise { background: var(--warn-bg); border: 1px solid var(--warn); border-radius: 6px; padding: .6rem .8rem; font-size: .93rem; display: grid; gap: .4rem; }
.surprise .btn { justify-self: start; }
.controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 1rem 1.2rem; }
.presets { display: flex; flex-wrap: wrap; gap: .3rem; align-items: center; font-size: .88rem; }
.run-row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: end; }

.run-head { display: flex; flex-wrap: wrap; gap: .45rem; align-items: center; margin-bottom: .3rem; }
.chart-tools { display: grid; gap: .55rem; margin-top: .9rem; }
.chart-toggles { display: flex; flex-wrap: wrap; gap: .5rem 1.1rem; }
.chart-holder { margin-top: .3rem; }

.timeline { list-style: none; padding: 0; margin: 0; display: grid; gap: .1rem; font-size: .85rem; }

.tl-time { font-family: var(--font-data); color: var(--ink-2); white-space: nowrap; font-size: .76rem; }

@media (max-width: 480px) { .timeline li { grid-template-columns: auto minmax(0, 1fr); } .tl-time { grid-column: 1 / -1; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; } }
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { transition: none !important; }

/* ---------- field visit tour ---------- */
.ws-visiting .ws-grid, .ws-visiting .pane-tabs, .ws-visiting .mobile-runbar { display: none !important; }

<script>/* js/physics.js */
/* Physics Discovery Lab · physics engines
   Pure functions with no DOM access. Every simulation takes explicit settings and a
   seed, so a saved run can be replayed exactly. Loaded in the browser as
   window.ADL.physics and in Node (tests) through module.exports. */
(function (root) {
  'use strict';

  const C = Object.freeze({
    g: 9.80665,               // standard acceleration of gravity, m/s² (a defined value)
    G: 6.67430e-11,           // gravitational constant, N·m²/kg²
    rhoAir: 1.20,             // air density at about 20 °C and sea level, kg/m³
    rhoWater: 998,            // kg/m³ at 20 °C
    cdSphere: 0.47            // drag coefficient of a smooth sphere at moderate speeds (approximate)
  });

  /* ---------- Seeded random numbers ---------- */

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function makeRng(seed) {
    const next = mulberry32(seed);
    let spare = null;
    const rng = {
      seed: seed >>> 0,
      uniform: next,
      normal() {
        if (spare !== null) { const s = spare; spare = null; return s; }
        let u, v, s;
        do { u = next() * 2 - 1; v = next() * 2 - 1; s = u * u + v * v; } while (s === 0 || s >= 1);
        const m = Math.sqrt(-2 * Math.log(s) / s);
        spare = v * m;
        return u * m;
      },
      exponential(rate) { return -Math.log(1 - next()) / rate; },
      poisson(lam) {
        if (!(lam > 0)) return 0;
        if (lam < 30) {
          const L = Math.exp(-lam);
          let k = 0, p = 1;
          do { k++; p *= next(); } while (p > L);
          return k - 1;
        }
        return Math.max(0, Math.round(lam + Math.sqrt(lam) * rng.normal()));
      },
      binomial(n, p) {
        if (n <= 0 || !(p > 0)) return 0;
        if (p >= 1) return n;
        if (n < 40) { let k = 0; for (let i = 0; i < n; i++) if (next() < p) k++; return k; }
        const mean = n * p;
        if (mean < 30) return Math.min(n, rng.poisson(mean));
        if (n * (1 - p) < 30) return n - Math.min(n, rng.poisson(n * (1 - p)));
        const x = Math.round(mean + Math.sqrt(mean * (1 - p)) * rng.normal());
        return Math.min(n, Math.max(0, x));
      },
      /* Sequential conditional binomials; the last category takes the remainder. */
      multinomial(n, probs) {
        const k = probs.length, out = new Array(k).fill(0), suffix = new Array(k + 1).fill(0);
        for (let i = k - 1; i >= 0; i--) suffix[i] = suffix[i + 1] + Math.max(0, probs[i]);
        let rem = n;
        for (let i = 0; i < k && rem > 0; i++) {
          if (i === k - 1) { out[i] = rem; break; }
          const p = suffix[i] > 0 ? Math.min(1, Math.max(0, probs[i]) / suffix[i]) : 0;
          out[i] = rng.binomial(rem, p);
          rem -= out[i];
        }
        return out;
      }
    };
    return rng;
  }

  function newSeed() { return (Math.floor(Math.random() * 4294967295) >>> 0) || 1; }

  function erf(x) { // Abramowitz & Stegun 7.1.26, |error| < 1.5e-7
    const s = x < 0 ? -1 : 1; x = Math.abs(x);
    const t = 1 / (1 + 0.3275911 * x);
    const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
    return s * y;
  }
  const normCdf = z => 0.5 * (1 + erf(z / Math.SQRT2));


  // Mean, sample standard deviation and standard error of a list
  function stats(xs) {
    const n = xs.length, mean = xs.reduce((a, b) => a + b, 0) / n;
    const sd = n > 1 ? Math.sqrt(xs.reduce((a, x) => a + (x - mean) * (x - mean), 0) / (n - 1)) : 0;
    return { n, mean, sd, se: sd / Math.sqrt(n) };
  }
  // Least-squares line y = m x + b (or y = m x through the origin)
  function fitLine(pts, throughOrigin) {
    const n = pts.length;
    if (!n) return null;
    if (throughOrigin) {
      const sxy = pts.reduce((a, p) => a + p[0] * p[1], 0), sxx = pts.reduce((a, p) => a + p[0] * p[0], 0);
      return sxx ? { m: sxy / sxx, b: 0 } : null;
    }
    const mx = pts.reduce((a, p) => a + p[0], 0) / n, my = pts.reduce((a, p) => a + p[1], 0) / n;
    let sxy = 0, sxx = 0;
    for (const [x, y] of pts) { sxy += (x - mx) * (y - my); sxx += (x - mx) * (x - mx); }
    if (!sxx) return null;
    const m = sxy / sxx;
    return { m, b: my - m * mx };
  }

  /* ---------- Chapter 1 · Galileo's inclined plane ----------
     A solid ball rolls from rest down a straight groove; Galileo timed it with a water clock
     (a thin jet of water collected and weighed). Rolling without slipping gives the ball an
     effective mass of 7/5 m, so on a ramp at angle θ: a = (5/7)(g sin θ − c_rr g cos θ) − drag/(1.4 m). */
  const GALILEO = Object.freeze({
    rampLength: 2.0,   // m, a bench-sized version of Galileo's 12-cubit board
    diameter: 0.025,   // m
    flow: 4.0,         // grams of water per second from the clock's jet (steady head)
    handSd: 0.04,      // s, scatter from opening and closing the jet with a finger
    balanceSd: 0.05,   // g, reading the balance
    releases: 5,       // releases averaged in each run
    crr: 0.0015        // rolling-resistance coefficient, hard ball in a smooth lined groove (assumed)
  });
  const BALLS = Object.freeze({
    bronze: { label: 'Bronze', density: 8800 },
    glass: { label: 'Glass', density: 2500 },
    oak: { label: 'Oak', density: 750 }
  });
  const ballMass = ball => BALLS[ball].density * Math.PI / 6 * Math.pow(GALILEO.diameter, 3);
  // What-if worlds: each hypothesis turned into a law of motion, tuned to match the real ball
  // at 2° over the full ramp so the worlds can only be told apart by how times scale.
  const REF_SIN = Math.sin(2 * Math.PI / 180);
  const galileoIdealA = thetaDeg => 5 / 7 * C.g * Math.sin(thetaDeg * Math.PI / 180);

  // Time for the ball to cover distance d from rest, and samples of its position for drawing
  function galileoMotion(s, world) {
    const th = s.angle * Math.PI / 180, d = s.distance, m = ballMass(s.ball);
    const samples = [];
    if (world === 'steady') { // Hypothesis A: a steady speed proportional to weight and slope, reached almost at once
      const v = 197 * m * Math.sin(th), tau = 0.1;
      const x = t => v * (t - tau * (1 - Math.exp(-t / tau)));
      let lo = 0, hi = d / v + 1;
      for (let i = 0; i < 60; i++) { const mid = (lo + hi) / 2; if (x(mid) < d) lo = mid; else hi = mid; }
      for (let i = 0; i <= 60; i++) { const t = hi * i / 60; samples.push([t, Math.min(d, x(t))]); }
      return { t: hi, vEnd: v, samples };
    }
    if (world === 'distance') { // Hypothesis B: speed proportional to distance rolled (needs a 1 cm nudge to start)
      const k = 1.311 * Math.sqrt(Math.sin(th) / REF_SIN), d0 = 0.01;
      const t = d > d0 ? Math.log(d / d0) / k : 0;
      for (let i = 0; i <= 60; i++) { const ti = t * i / 60; samples.push([ti, Math.min(d, d0 * Math.exp(k * ti))]); }
      return { t, vEnd: k * d, samples };
    }
    // Real world: Newton's second law for a rolling sphere with rolling resistance and air drag
    const area = Math.PI * GALILEO.diameter * GALILEO.diameter / 4;
    const drive = 5 / 7 * C.g * (Math.sin(th) - GALILEO.crr * Math.cos(th));
    const dragK = 0.5 * C.rhoAir * C.cdSphere * area / (1.4 * m);
    const acc = v => drive - dragK * v * v;
    let t = 0, x = 0, v = 0;
    const dt = 0.002, every = Math.max(1, Math.round(Math.sqrt(2 * d / Math.max(drive, 1e-6)) / dt / 60));
    samples.push([0, 0]);
    for (let i = 1; x < d && t < 120; i++) {
      // RK4 on (x, v)
      const k1v = acc(v), k1x = v;
      const k2v = acc(v + k1v * dt / 2), k2x = v + k1v * dt / 2;
      const k3v = acc(v + k2v * dt / 2), k3x = v + k2v * dt / 2;
      const k4v = acc(v + k3v * dt), k4x = v + k3v * dt;

<script>/* js/core.js */
/* Physics Discovery Lab · core helpers, saved state and the investigation flow.

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const fmt = {
    int: v => v === null || v === undefined ? '—' : Math.round(v).toLocaleString('en-US'),
    num(v, sig = 3) {
      if (v === null || v === undefined || !isFinite(v)) return '—';
      const a = Math.abs(v);
      if (a !== 0 && (a >= 1e6 || a < 1e-3)) return fmt.sci(v, sig);
      if (a >= 1000) return Math.round(v).toLocaleString('en-US');
      return String(+v.toPrecision(sig));
    },
    fixed: (v, d = 2) => v === null || v === undefined || !isFinite(v) ? '—' : v.toFixed(d),
    sci(v, sig = 3) {

  function freshState() {
    return {
      app: 'physics-discovery-lab', version: VERSION, createdAt: now(), researchers: '',
      mode: 'discovery', modeHistory: [{ mode: 'discovery', at: now() }],
      prefs: { textScale: 1, contrast: false, motion: 'auto' },
      chapters: {}

  }
  function freshChapter(id) {
    return {
      id, startedAt: null, done: {}, current: null, sorted: {}, sortChecked: false,
      hypothesis: null, confidence: 50, hypothesisLog: [], predictions: [], runs: [], runCounter: 0,
      reviews: [], claims: [], claimAccepted: null,
      challenge: { choice: null, conclusion: null, resolved: false, runIds: [], log: [] },
      revisions: [], discovered: false, discoveredAt: null, misconception: null, transfer: {},
      hints: {}, assisted: false, notes: '', log: [], extra: {}

  }

    get canSave() { return canSave; },

    emit(evt) { listeners.forEach(fn => { try { fn(evt); } catch (e) { console.error(e); } }); },
    on(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    log(chId, type, text, data) {

    },
    addRun(def, partial) {

      const run = Object.assign({ runId: `${def.code}-${pad4(c.runCounter)}`, chapterId: def.id, at: now(), modelVersion: def.modelVersion, mode: state.mode }, partial);

    },
    setMode(mode) {

    replace(newState) { state = newState; store.save(); store.emit({ type: 'import' }); },
    resetChapter(id) { store.update(s => { delete s.chapters[id]; }, { type: 'reset', chapterId: id }); },
    resetAll() { const prefs = state.prefs; state = freshState(); state.prefs = prefs; store.save(); store.emit({ type: 'import' }); },
    validateImport(obj) {

  const STANDARD_STAGES = [
    { id: 'visit', label: 'Field visit' }, { id: 'intro', label: 'Anomaly' }, { id: 'observe', label: 'Observe' }, { id: 'hypothesize', label: 'Hypothesize' },
    { id: 'predict', label: 'Predict' }, { id: 'experiment', label: 'Experiment' }, { id: 'analyze', label: 'Analyze' },
    { id: 'claim', label: 'Claim' }, { id: 'challenge', label: 'Challenge' }, { id: 'revise', label: 'Revise' },

  const configKey = (def, run) => JSON.stringify((def.controls || []).filter(c => !c.size && (!c.showIf || c.showIf(run.controls))).map(c => run.controls[c.id]));

    stages: def => def.stages || STANDARD_STAGES,
    isDone(def, cs, stageId) {

        case 'observe': return !!cs.done.observe;
        case 'hypothesize': return !!cs.hypothesis;
        case 'predict': return cs.predictions.length > 0;

        }

        case 'claim': return !!cs.claimAccepted;
        case 'challenge': return !!cs.challenge.resolved;
        case 'revise': return cs.revisions.length > 0;
        case 'discovery': return !!cs.discovered;

    complete(def, cs) { return flow.stages(def).every(s => flow.isDone(def, cs, s.id)); },
    configKey, runsAfter,

        { id: 'discriminating', label: 'A comparison that tells the hypotheses apart', ok: !!anyDisc, detail: anyDisc ? `${anyDisc.d.label} (${anyDisc.res.runIds.join(', ')})` : 'Options: ' + disc.map(x => x.d.label.toLowerCase()).join('; or '), go: 'experiment' },

        { id: 'challenge', label: "An answer to the referee's challenge", ok: !!cs.challenge.resolved, go: 'challenge' },

    /* Find a pair of runs where exactly the named control differs and everything else (except size) matches */
    isolatedPairs(def, runs, controlId, extra) {
      const out = [];
      for (let i = 0; i < runs.length; i++) for (let j = i + 1; j < runs.length; j++) {
        const d = flow.diff(def, runs[i], runs[j]);

    }

  ADL.getChapter = id => ADL.chapters.find(c => c.id === id);

  ADL.problemTemplates = ADL.problemTemplates || [];

<script>/* js/charts.js */
/* Physics Discovery Lab · small canvas chart renderer.
   A chart is a plain spec object: axes, series (bars, line, points, step), optional
   highlight bands and reference lines. Colors come from the page's CSS tokens so

(function (root) {
  'use strict';

      transfer(body) { body.append(transferBox()); }
    };

    function evaluateClaim(d) {
      const out = [];
      const claim = def.claims.find(c => c.id === d.claim);
      const cited = realRuns().filter(r => d.runs.includes(r.runId));
      if (!claim.supported) out.push({ level: 'stop', text: claim.feedback });
      if (cited.length < 2) out.push({ level: 'stop', text: 'Cite at least two runs so a reader can check your evidence against your notebook.' });
      if (claim.supported && claim.needs) for (const msg of claim.needs(cited, cs)) out.push({ level: 'stop', text: msg });
      if (cited.length >= 2) {
        let isolated = false, worst = null;
        for (let i = 0; i < cited.length; i++) for (let j = i + 1; j < cited.length; j++) {
          const df = flow.diff(def, cited[i], cited[j]);
          if (df.changedCore.length <= 1) isolated = true; else if (!worst || df.changedCore.length > worst.df.changedCore.length) worst = { a: cited[i], b: cited[j], df };
        }
        if (!isolated && worst) out.push({ level: 'warn', text: `Between ${worst.a.runId} and ${worst.b.runId} you changed ${worst.df.changedCore.map(c => c.label.toLowerCase()).join(' and ')}. Which change explains the difference? Add a pair of runs that differ in only one setting.` });
      }
      const good = d.reasons.filter(id => def.reasoning.find(r => r.id === id).good);
      for (const id of d.reasons) { const r = def.reasoning.find(x => x.id === id); if (!r.good) out.push({ level: 'stop', text: r.note }); }
      if (!good.length) out.push({ level: 'stop', text: 'Add reasoning that connects your evidence to the claim with a scientific principle.' });
      if (!out.some(f => f.level === 'stop')) out.unshift({ level: 'good', text: `Your claim is consistent with ${d.runs.join(', ')}. Now the hard part: can you think of a result that would challenge it? The referee will try.` });
      return out;
    }

    function revealContent(openLab) {

      if (!openLab && cs.claimAccepted) {
        const rs = realRuns().filter(r => cs.claimAccepted.runIds.includes(r.runId));
        wrap.append(h('section', null, h('h3', null, 'Your strongest evidence'), h('ul', null, rs.map(r => h('li', null, h('span', { class: 'chip mono' }, r.runId), ' ', def.runSummary(r))))));
        if (def.acceptedHypothesis && cs.hypothesis !== def.acceptedHypothesis) {
          const mine = def.hypotheses.find(x => x.id === cs.hypothesis);
          wrap.append(h('p', { class: 'note' }, `Your final hypothesis was ${mine.letter} (${mine.name}). Compare it with the accepted model: which of your runs points toward the accepted view? Disagreeing with the textbook is allowed, but only with evidence.`));
        }
      }
      wrap.append(h('section', null, h('h3', null, 'What happened historically'), h('div', { html: R.history })));
      wrap.append(h('section', null, h('h3', null, 'What this experiment did not establish'), h('div', { html: R.notEstablished })));
      wrap.append(h('section', null, h('h3', null, 'What came next'), h('div', { html: R.later })));
      if (R.today) wrap.append(h('section', null, h('h3', null, 'Where this matters today'), h('div', { html: R.today })));
      const people = ADL.peopleFor ? ADL.peopleFor({ chapter: def.id }) : [];
      if (people.length && ADL.personCard) wrap.append(h('section', null, h('h3', null, 'More people in this story'), h('p', { class: 'muted small' }, 'Science is a team effort, and the people who got the credit were rarely the only ones who did the work.'), h('div', { class: 'people-grid compact' }, people.map(p => ADL.personCard(p, { compact: true })))));
      if (R.derivation) wrap.append(h('details', { class: 'derivation' }, h('summary', null, 'Advanced: the math behind the model'), h('div', { html: R.derivation })));
      if (R.sources) wrap.append(h('section', { class: 'sources' }, h('h3', null, 'Read more'), h('ul', null, R.sources.map(s => h('li', null, h('a', { href: s.url, target: '_blank', rel: 'noopener' }, s.label))))));

    function misconceptionBox() {
      const M = def.misconception;
      const box = h('div', { class: 'check-q' }, h('h3', null, 'Misconception check'), h('p', null, M.question));
      const name = ADL.ui.nextId('mc');
      M.options.forEach((op, i) => {
        const inp = h('input', { type: 'radio', name, onchange: () => { cs.misconception = { choice: i, at: ADL.now() }; log('check', `Misconception check: ${op.correct ? 'right' : 'not quite'}`); save(); renderInvestigation(); } });
        inp.checked = cs.misconception && cs.misconception.choice === i;
        box.append(h('label', { class: 'choice-row' }, inp, h('span', null, op.text)));
      });
      if (cs.misconception) { const op = M.options[cs.misconception.choice]; box.append(h('p', { class: 'feedback ' + (op.correct ? 'good' : 'warn') }, op.why)); }

    }

    function transferBox() {
      const box = h('div', { class: 'transfer' });
      box.append(h('p', null, 'A new case, no guided steps. Use the same reasoning.'));
      for (const q of def.transfer) {
        const st = cs.transfer[q.id] || { attempts: 0, correct: false };
        const qb = h('div', { class: 'check-q' }, h('div', { html: q.prompt }));
        if (q.type === 'choice') {
          const name = ADL.ui.nextId('tq');
          q.options.forEach((op, i) => {
            const inp = h('input', { type: 'radio', name, onchange: () => { const ok = i === q.answer; cs.transfer[q.id] = { attempts: st.attempts + 1, correct: ok || st.correct, last: i }; log('transfer', `Transfer ${q.id}: ${ok ? 'correct' : 'not yet'}`); save(); renderInvestigation(); } });
            inp.checked = st.last === i;
            qb.append(h('label', { class: 'choice-row' }, inp, h('span', null, op)));
          });
        } else {
          const inp = h('input', { type: 'text', inputmode: 'decimal', class: 'num wide', 'aria-label': 'Your answer', value: st.value ?? '' });
          qb.append(h('div', { class: 'answer-row' }, inp, q.unit ? h('span', { class: 'unit' }, q.unit) : null, h('button', { type: 'button', class: 'btn', onclick: () => {
            const v = ADL.parseNumber(inp.value);
            if (v === null) { ADL.ui.toast('Enter a number.'); return; }
            const ok = Math.abs(v - q.answer) <= (q.abs ?? Math.abs(q.answer) * (q.tol ?? 0.05));
            cs.transfer[q.id] = { attempts: st.attempts + 1, correct: ok || st.correct, value: inp.value, lastOk: ok };
            log('transfer', `Transfer ${q.id}: answered ${inp.value}${q.unit ? ' ' + q.unit : ''} (${ok ? 'correct' : 'not yet'})`); save(); renderInvestigation();
          } }, 'Check')));
        }
        if (st.attempts) {
          const ok = q.type === 'choice' ? st.last === q.answer : st.lastOk;
          qb.append(h('div', { class: 'feedback ' + (ok ? 'good' : 'warn'), html: ok ? q.explain : (q.retry || 'Not quite. ') + (st.attempts >= 2 ? ' ' + q.explain : ' Try once more.') }));
        }
        box.append(qb);
      }
      if (flow.complete(def, cs)) {
        const next = ADL.chapters[ADL.chapters.indexOf(def) + 1];
        box.append(h('div', { class: 'note good-note' }, h('strong', null, 'Chapter complete. '), 'Everything you did is in your notebook, including the wrong turns.',
          h('div', { class: 'btn-row' }, next ? h('a', { class: 'btn primary', href: '#' + next.id }, `Next: ${next.title} →`) : null, h('a', { class: 'btn', href: '#home' }, 'Back to the Institute'))));
      }
      return box;
    }

    /* ---------- apparatus ---------- */
    const widgets = {};
    let canvas, captionEl, surpriseEl, worldSel;
    function renderApparatus() {
      el.app.replaceChildren();
      const sc = ADL.ui.scope(def.title + ' apparatus');
      canvas = sc.canvas;
      sc.tag(def.scopeTag || '');
      captionEl = h('p', { class: 'sim-caption', 'aria-live': 'polite' });
      surpriseEl = h('div', { class: 'surprise', hidden: true });
      const visit = ADL.fieldVisits && ADL.fieldVisits[def.id];
      if (visit) el.app.append(h('div', { class: 'app-head' }, h('span', { class: 'muted small' }, 'Simplified drawing of the apparatus'), h('button', { type: 'button', class: 'btn small ghost', onclick: showRealApparatus }, 'See the real apparatus')));
      el.app.append(sc.el, surpriseEl, captionEl);
      const ctlWrap = h('div', { class: 'controls-grid' });
      for (const c of def.controls || []) {
        if (c.hidden || (c.openOnly && mode() !== 'open')) continue;
        const onInput = v => { view.controls[c.id] = v; applyDynamic(); if (def.onControl) def.onControl(view.controls, c.id, api); drawNow(); updateCaption(); if (def.live) { renderData(); } };
        let w;
        const r = c.range ? c.range(view.controls) : {};
        const opts = Object.assign({}, c, r, { id: `${def.id}-${c.id}`, onInput, value: view.controls[c.id] });
        if (c.type === 'select') w = ADL.ui.select(Object.assign(opts, { options: typeof c.options === 'function' ? c.options(view.controls) : c.options }));
        else if (c.type === 'seg') w = ADL.ui.seg(opts);
        else if (c.type === 'toggle') w = ADL.ui.toggle(opts);
        else w = ADL.ui.slider(opts);
        widgets[c.id] = { w, def: c };
        ctlWrap.append(w.el);
      }
      el.app.append(ADL.ui.panel('Apparatus controls', ctlWrap));
      applyDynamic();
      if (def.presets) el.app.append(h('div', { class: 'presets' }, h('span', { class: 'muted' }, 'Presets:'), def.presets.map(p => h('button', { type: 'button', class: 'btn small ghost', onclick: () => setControls(p.values) }, p.label))));
      if (!def.live && def.simulate) {
        const row = h('div', { class: 'run-row' },
          h('button', { type: 'button', class: 'btn primary', onclick: () => runExperiment(1) }, def.runLabel || 'Run experiment'),
          h('button', { type: 'button', class: 'btn', onclick: () => runExperiment(5) }, 'Repeat ×5'),
          h('button', { type: 'button', class: 'btn ghost', onclick: resetControls }, 'Reset controls'));
        if (mode() === 'open' && def.worlds && def.worlds.length > 1) {
          worldSel = ADL.ui.select({ id: def.id + '-world', label: 'Nature', options: def.worlds.map(w => ({ value: w.id, label: w.label })), value: view.world, onInput: v => { view.world = v; drawNow(); updateCaption(); } });
          row.append(worldSel.el);
        }
        el.app.append(row);
      }
      if (def.apparatusNote) el.app.append(h('p', { class: 'muted small' }, def.apparatusNote));
      if (!ro) { ro = new ResizeObserver(() => drawNow()); }
      ro.observe(canvas);
      drawNow(); updateCaption();
    }
    let ro = null;

    // Re-apply visibility and value ranges that depend on other controls. Ids in `keep` hold values
    // that are about to be set explicitly, so they are not overwritten by a clamped widget value.
    function applyDynamic(keep) {
      for (const [id, { w, def: c }] of Object.entries(widgets)) {
        if (c.showIf) w.el.hidden = !c.showIf(view.controls);

    'ligo-suspension': p('ligo-suspension.jpg', 665, 1000, 'A tall metal frame inside a clear case holds a stack of hanging stages, ending in a round mirror near the bottom.', 'A full-size demonstration of a LIGO mirror suspension, on show at a LIGO observatory, 2018.', 'Gah4', 'CC BY-SA 4.0', 'LigoMirror.jpg'),
    'bouncing-ball': p('bouncing-ball.jpg', 1000, 643, 'One ball photographed many times as it bounces from left to right across a black background, tracing two arches, the second lower than the first.', 'A bouncing ball lit by a strobe flash 25 times a second. Between bounces, each path is very close to a parabola.', 'MichaelMaggs; edit by Richard Bartz', 'CC BY-SA 3.0', 'Bouncing ball strobe edit.jpg'),
    'escape-lane': p('escape-lane.jpg', 1000, 562, 'A motorway curving between hills; on the right a separate lane branches off and climbs away from the road, marked by a blue sign.', 'An emergency stopping lane for trucks with failing brakes, beside the D8 motorway near Petrovice, Czech Republic, 2015.', 'Raimond Spekking', 'CC BY-SA 4.0', 'Emergency stopping lane on D8 near Petrovice, Czech Republic-6304.jpg'),
    'damper': p('damper.jpg', 1000, 666, 'A huge gold-colored sphere built from stacked steel plates, hanging in a dark space.', 'The 660-tonne tuned mass damper near the top of Taipei 101, 2023.', 'Johan Jönsson (Julle)', 'CC BY-SA 4.0', 'Taipei 101 tuned mass damper 01.jpg')
  });

  // Portraits for the People cards, cropped to head and shoulders at 192×240.
  // `label` marks an image that is not a likeness made in the person's lifetime.
  const q = (file, caption, credit, license, page, extra) => Object.assign(p(file, 192, 240, caption, caption, credit, license, page, 'cropped to head and shoulders, resized'), extra);
  const PD = 'Public domain';
  ADL.PORTRAITS = {
    // Downloaded with permission on 2026-10-31 for Atomic Discovery Lab
    'du-chatelet': [q('person-du-chatelet.jpg', 'Émilie du Châtelet, painted in the 1750s.', 'Unknown artist; Nationalmuseum, Stockholm', PD, 'Okänd - Gabrielle-Émilie Le Tonnelier de Breteuil (1706–1749), Marquise du Châtelet - NMDrh 796 - Nationalmuseum.jpg')],
    // Licenses re-checked on Commons and downloaded with permission on 2026-11-04
    'oresme': [q('person-oresme.jpg', 'Nicole Oresme at his desk, a painting in a manuscript of his Traité de l’espère made about 1400–1420, a generation after his death.', 'Unknown illuminator', PD, 'Oresme.jpg', { label: 'Manuscript painting, c. 1410', changes: 'cropped to the figure of Oresme, resized' })],
    'stevin': [q('person-stevin.jpg', 'Simon Stevin, by an unknown Dutch artist of the 1600s.', 'Unknown artist; Leiden University Library', PD, 'Simon-stevin.jpeg')],
    'galileo': [q('person-galileo.jpg', 'Galileo Galilei, painted by Justus Sustermans in the late 1630s.', 'Justus Sustermans; National Maritime Museum, Greenwich', PD, 'Justus Sustermans - Portrait of Galileo Galilei, 1636.jpg')],
    'huygens': [q('person-huygens.jpg', 'Christiaan Huygens, painted by Caspar Netscher in 1671.', 'Caspar Netscher', PD, 'Caspar Netscher - Christiaan Huygens, the astronomer, 1671.jpg')],
    'newton': [q('person-newton.jpg', 'Isaac Newton, painted by Godfrey Kneller in 1689.', 'Godfrey Kneller', PD, 'Portrait of Sir Isaac Newton, 1689 (brightened).jpg')],
    'bassi': [q('person-bassi.jpg', 'Laura Bassi, painted by Carlo Vandi in the mid-1700s.', 'Carlo Vandi; Museo Europeo degli Studenti, Bologna', PD, 'Carlo Vandi - Ritratto di Laura Bassi - Museo Europeo degli Studenti.png', { changes: 'cropped to head and shoulders, resized, converted to JPEG' })],
    'germain': [q('person-germain.jpg', 'Sophie Germain, an engraving printed in her Œuvres philosophiques (1896), 65 years after her death.', 'Bibliothèque nationale de France', PD, 'Germain - Œuvres philosophiques, 1896 (Illustration page 4).jpg', { label: 'Engraving, 1896' })],
    'somerville': [q('person-somerville.jpg', 'Mary Somerville, painted by Thomas Phillips in 1834.', 'Thomas Phillips; National Galleries of Scotland', PD, 'Thomas Phillips - Mary Fairfax, Mrs William Somerville, 1780 - 1872. Writer on science - Google Art Project.jpg')],
    'mccoy': [q('person-mccoy.jpg', 'Elijah McCoy, about 1895.', 'Sexton & Maxwell; The Henry Ford', PD, 'Elijah McCoy c1895 retouched.jpg')],
    'kovalevskaya': [q('person-kovalevskaya.jpg', 'Sofia Kovalevskaya, 1888.', 'Unknown photographer', PD, 'Sofja Wassiljewna Kowalewskaja 1.jpg')],
    'noether': [q('person-noether.jpg', 'Emmy Noether, about 1900.', 'Unknown photographer', PD, 'Emmy Noether (3x4 cropped).jpg')],
    'katherine-johnson': [q('person-katherine-johnson.jpg', 'Katherine Johnson at NASA Langley Research Center, 1983.', 'NASA', PD, 'Katherine Johnson 1983.jpg')],
    'mary-jackson': [q('person-mary-jackson.jpg', 'Mary Jackson at NASA Langley Research Center, 1979.', 'NASA Langley Research Center / Bob Nye', PD, 'Mary Jackson 1979 Portrait (LRC-1979-B701 P F002-07086).jpg')],
    'gladys-west': [q('person-gladys-west.jpg', 'Gladys West at her induction into the Air Force Space and Missile Pioneers Hall of Fame, 2018.', 'U.S. Air Force / Adrian Cadiz', PD, '181206-F-DT527-087 (cropped).jpg')],
    'annie-easley': [q('person-annie-easley.jpg', 'Annie Easley, NASA photograph.', 'NASA', PD, 'Annie Easley.jpg')],
    'chang-diaz': [q('person-chang-diaz.jpg', 'Franklin Chang-Díaz, NASA portrait, 1997.', 'NASA', PD, 'Changdiaz.jpg')],
    'chawla': [q('person-chawla.jpg', 'Kalpana Chawla, NASA portrait, 2002.', 'NASA', PD, 'Kalpana Chawla, NASA photo portrait in orange suit.jpg')]
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/people.js */
/* Physics Discovery Lab · people of physics.
   Contributors whose work belongs in these topics and chapters, chosen so the story of physics
   is not only the usual handful of European men. Every entry states documented work only;
   "origin" gives birthplace and where the person worked, and heritage only where it is part of
   the documented story. */
(function (root) {
  'use strict';
  const ADL = root.ADL = root.ADL || {};

  const P = (id, name, years, origin, what, topics, chapters, sims) => ({ id, name, years, origin, what, topics: topics || [], chapters: chapters || [], sims: sims || [] });

  ADL.PEOPLE = [
    P('ibn-sina', 'Ibn Sina (Avicenna)', 'c. 980–1037', 'Born near Bukhara (Uzbekistan); worked in Persia (Iran)', 'Argued that a thrown object keeps moving because the thrower gives it an inclination to move (<em>mayl</em>) that resistance gradually wears away, and reasoned that in a vacuum the motion would never stop. The idea fed into later “impetus” theories and, eventually, the idea of inertia.', ['forces']),
    P('al-khazini', 'Abd al-Rahman al-Khazini', 'active 1115–1130', 'Merv (Turkmenistan)', 'His <em>Book of the Balance of Wisdom</em> (1121) describes precise balances and uses them to measure the densities of many metals, minerals and liquids, with results close to modern values.', ['forces']),
    P('oresme', 'Nicole Oresme', 'c. 1320–1382', 'France', 'Drew some of the first graphs of changing quantities, and used one to prove the “mean speed rule”: a body speeding up steadily covers the same distance as one moving the whole time at its average speed. Galileo relied on the same rule.', ['motion'], ['galileo']),
    P('stevin', 'Simon Stevin', '1548–1620', 'Born in Bruges (Belgium); worked in the Netherlands', 'In 1586, with Jan Cornets de Groot, dropped two lead balls, one ten times heavier, from a church tower in Delft and heard them land together. He also worked out the forces on a slope with his “wreath of spheres” argument.', ['forces', 'motion'], ['galileo'], ['ramp-lab']),
    P('galileo', 'Galileo Galilei', '1564–1642', 'Italy', 'Showed with rolling balls and a water clock that a falling body speeds up steadily, so the distance grows with the square of the time, and argued that without air all bodies fall together. He published it in <em>Two New Sciences</em> (1638) while under house arrest.', ['motion'], ['galileo'], ['projectile-lab']),
    P('huygens', 'Christiaan Huygens', '1629–1695', 'Netherlands', 'Invented the pendulum clock (1656–57), far more accurate than any earlier clock, and in <em>Horologium Oscillatorium</em> (1673) worked out how a pendulum’s period depends on its length and on gravity.', ['oscillations'], [], ['home-pendulum', 'spring-lab']),
    P('newton', 'Isaac Newton', '1643–1727', 'England', 'In the <em>Principia</em> (1687) set out three laws of motion and the law of universal gravitation, which explained both Galileo’s falling bodies and the orbits of the planets.', ['forces', 'gravity'], [], ['ramp-lab']),
    P('du-chatelet', 'Émilie du Châtelet', '1706–1749', 'France', 'Used experiments in which brass balls were dropped into soft clay (by Willem ’s Gravesande) to argue that a moving body’s “force” grows with the square of its speed: the idea behind kinetic energy, ½mv². Her French translation of Newton’s <em>Principia</em>, with commentary, is still the standard one.', ['energy'], [], ['spring-lab']),
    P('bassi', 'Laura Bassi', '1711–1778', 'Italy', 'In 1732 she became the second woman in Europe to earn a university doctorate and began teaching at the University of Bologna. She taught Newton’s physics with experiments in her own home laboratory, and in 1776 became Bologna’s professor of experimental physics.', ['forces']),
    P('germain', 'Sophie Germain', '1776–1831', 'France', 'Studied mathematics in secret and wrote to leading mathematicians under a man’s name. In 1816 she became the first woman to win a prize from the Paris Academy of Sciences, for a theory of how elastic plates vibrate, a starting point for the mathematics engineers use on vibrating structures.', ['oscillations'], [], ['spring-lab']),
    P('somerville', 'Mary Somerville', '1780–1872', 'Scotland', 'Taught herself mathematics and translated and expanded Laplace’s work on how gravity governs the solar system as <em>The Mechanism of the Heavens</em> (1831). In 1835 she and Caroline Herschel became the first women honorary members of the Royal Astronomical Society.', ['gravity']),
    P('mccoy', 'Elijah McCoy', '1844–1929', 'Born in Canada to parents who had escaped slavery; worked in Michigan, USA', 'Trained as a mechanical engineer in Scotland but could only find work oiling engines on a railroad. He invented automatic lubricators that fed oil into steam engines while they ran (first patent 1872), cutting friction and wear without stopping the train, and went on to hold more than 50 patents.', ['forces'], [], ['ramp-lab']),
    P('kovalevskaya', 'Sofia Kovalevskaya', '1850–1891', 'Russia; worked in Sweden', 'Solved a famous problem about how a spinning top moves, winning the Paris Academy’s Prix Bordin in 1888. She was the first woman in modern Europe to earn a doctorate in mathematics, and in 1889 became a full professor in Stockholm.', ['momentum']),
    P('noether', 'Emmy Noether', '1882–1935', 'Germany; later the USA', 'Proved in 1918 that every conservation law comes from a symmetry of nature: energy is conserved because the laws of physics are the same from one moment to the next, and momentum because they are the same from place to place. Barred from a paid post for years because she was a woman, she lectured under a male colleague’s name.', ['energy', 'momentum'], [], ['spring-lab']),
    P('zhang-heng', 'Zhang Heng', '78–139', 'China (Han dynasty)', 'Built a seismoscope in 132 CE that, according to the official history of the Han dynasty, signaled a distant earthquake by dropping a bronze ball from a dragon’s mouth into a toad’s. Its inner workings are not known; most reconstructions use a hanging pendulum.', ['oscillations'], [], ['home-pendulum']),
    P('mary-golda-ross', 'Mary Golda Ross', '1908–2008', 'USA (Cherokee Nation)', 'The first known Native American woman engineer. At Lockheed’s secret Skunk Works she worked on satellite orbits and on studies for crewed and robotic missions to Mars and Venus.', ['gravity', 'motion']),
    P('katherine-johnson', 'Katherine Johnson', '1918–2020', 'USA (African American)', 'A NASA mathematician who calculated trajectories for America’s first crewed spaceflights. Before his 1962 orbital flight, John Glenn asked for her to check the electronic computer’s calculations by hand. Presidential Medal of Freedom, 2015.', ['motion', 'gravity'], [], ['projectile-lab']),
    P('mary-jackson', 'Mary Jackson', '1921–2005', 'USA (African American)', 'NASA’s first Black woman engineer (1958). She ran experiments in a supersonic wind tunnel at Langley, studying the air flow and drag forces around aircraft, and later led programs to help women and minorities advance at NASA.', ['forces'], [], ['projectile-lab']),
    P('gladys-west', 'Gladys West', 'b. 1930', 'USA (African American)', 'A mathematician at the US Navy’s base in Dahlgren, Virginia, who modeled the precise shape of the Earth from satellite data. Her models became part of the foundation for GPS. Inducted into the Air Force Space and Missile Pioneers Hall of Fame in 2018.', ['gravity']),
    P('annie-easley', 'Annie Easley', '1933–2011', 'USA (African American)', 'A computer scientist and mathematician at NASA’s Lewis (now Glenn) Research Center for 34 years. She wrote software for the Centaur rocket stage and analyzed energy systems, including batteries for early hybrid vehicles.', ['energy']),
    P('chang-diaz', 'Franklin Chang-Díaz', 'b. 1950', 'Born in Costa Rica; worked in the USA', 'A plasma physicist and NASA astronaut who flew seven Space Shuttle missions, a record he shares with Jerry Ross. He founded Ad Astra Rocket Company to develop VASIMR, a plasma rocket engine designed to make long journeys, such as to Mars, faster.', ['momentum']),
    P('chawla', 'Kalpana Chawla', '1962–2003', 'Born in India; worked in the USA', 'An aerospace engineer whose research used computer simulations of air flowing around aircraft. In 1997 she became the first woman of Indian origin in space. She died with her six crewmates when Space Shuttle Columbia broke apart during re-entry in 2003.', ['forces'], [], ['projectile-lab']),
    P('mavalvala', 'Nergis Mavalvala', 'b. 1968', 'Born in Pakistan; works in the USA', 'A physicist on the LIGO team that first detected gravitational waves in 2015. LIGO’s mirrors hang as multi-stage pendulums to isolate them from vibration, and her work on “squeezed” laser light made the detectors more sensitive. MacArthur Fellow 2010; Dean of Science at MIT since 2020.', ['oscillations'], [], ['home-pendulum', 'spring-lab'])
  ];

  const byId = Object.fromEntries(ADL.PEOPLE.map(p => [p.id, p]));
  ADL.person = id => byId[id];
  ADL.peopleFor = ({ topic, chapter, sim }) => ADL.PEOPLE.filter(p => (topic && p.topics.includes(topic)) || (chapter && p.chapters.includes(chapter)) || (sim && p.sims.includes(sim)));
  ADL.personLink = p => 'https://en.wikipedia.org/w/index.php?search=' + encodeURIComponent(p.name.replace(/\s*\(.*\)/, '').split(' and ')[0]);
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/fieldvisits.js */
/* Physics Discovery Lab · field visits.
   Real-world context shown before any simulation: the historical apparatus ("Then"), the same
   physics in a working lab today ("Now"), and where it is heading ("Next"). Photos are referenced
   by key from ADL.PHOTOS (js/photos.js); a stop without an approved photo shows a described
   placeholder. Hotspot positions (x, y) are fractions of the photo's width and height. */
(function (root) {
  'use strict';
  const ADL = root.ADL = root.ADL || {};
  ADL.PHOTOS = ADL.PHOTOS || {};

  ADL.fieldVisits = {
    galileo: {
      lede: 'Galileo’s ramp is one of the most copied experiments in history. See the kind of apparatus he described, where free fall is studied today, and where measuring it is heading.',
      stops: [
        {
          era: 'Then · 1604–1638', place: 'Padua and Florence, Italy', title: 'A groove, a bronze ball and a water clock', photo: 'inclined-plane', photo2: 'museo-galileo-ramps',
          story: `<p>In <em>Two New Sciences</em> (1638) Galileo describes a wooden beam about 12 cubits long (roughly 6–7 metres) with a straight groove cut along one edge, polished and lined with parchment so a hard, round bronze ball could roll smoothly. One end was raised a cubit or two. To time each roll, a large vessel of water let a thin jet run into a small glass while the ball moved; the water was then weighed on an accurate balance.</p>
            <p>The large photo shows a modern working replica. Science museums have long shown ramps like it, often with small bells placed along the groove so you can <em>hear</em> the ball arrive at each mark. The Museo Galileo in Florence (small photo) keeps a 19th-century ramp with bells beside a curved track made in Florence in the late 1600s: a ball released on the curve beats one on the straight slope to the bottom, a result Galileo proved for circular arcs in 1638. Galileo’s own working notes on motion also survive in Florence, covered in sketches, distances and calculations.</p>`,
          points: [
            { label: 'Groove', text: 'A straight, smooth channel that keeps the ball rolling in a line.' },
            { label: 'Marks or bells', text: 'Positions along the ramp. On demonstration ramps, bells placed at the right spacings ring at equal time intervals.' },
            { label: 'Raised end', text: 'Only a gentle slope: the motion must be slow enough to time without a clock.' },
            { label: 'Water clock (not shown)', text: 'A thin jet of water collected while the ball rolls. Weighing the water measures the time.' }
          ],
          careers: ['Experimental physicist', 'Museum curator of scientific instruments', 'Historian of science', 'Physics teacher']
        },
        {
          era: 'Now', place: 'NASA Glenn Research Center, Cleveland, Ohio', title: 'Free fall as a laboratory', photo: 'drop-tower',
          story: `<p>NASA’s Zero Gravity Research Facility is a steel vacuum chamber inside a concrete shaft about 155 metres deep, pumped down to a near vacuum so there is almost no air resistance. An experiment package is dropped from the top and falls freely for 132 metres, about 5.2 seconds. While it falls, everything inside it falls together, so the experiment behaves as if gravity had been switched off.</p>
            <p>Engineers use those few seconds to study how flames burn, how fuel sloshes in tanks and how fluids boil without gravity, questions that matter for spacecraft. At the bottom, the package lands in a deep bin of small plastic foam pellets. A similar tower, about 146 m tall, operates at ZARM in Bremen, Germany.</p>`,
          points: [
            { label: 'Experiment vehicle', text: 'A sealed capsule carrying the experiment, cameras and sensors.' },
            { label: 'Vacuum chamber', text: 'Removing the air means the capsule truly falls freely, with no drag.' },
            { label: 'Decelerator', text: 'Foam pellets that stop the capsule gently at the bottom.' }
          ],
          careers: ['Microgravity research engineer', 'Combustion scientist', 'Test engineer', 'Instrumentation technician']
        },
        {
          era: 'Next', place: 'Geophysics and quantum-sensing labs', title: 'Timing falling atoms', photo: 'gravimeter',
          story: `<p>Absolute gravimeters drop a small mirror inside a vacuum chamber and time its fall with a laser, Galileo’s experiment done to a few parts in a billion. The newest instruments drop clouds of atoms cooled by lasers to a fraction of a degree above absolute zero, and measure their fall using the wave nature of the atoms themselves.</p>
            <p>Gravity is slightly stronger above dense rock and weaker above water or empty spaces, so these instruments can detect underground water, buried tunnels and magma rising beneath volcanoes. Portable versions are being developed for surveying and for navigation that does not depend on GPS. Satellites such as GRACE Follow-On map the same changes from orbit, tracking melting ice sheets and shrinking groundwater.</p>`,
          points: [
            { label: 'Vacuum chamber', text: 'Where the mirror or atom cloud falls, free of air.' },
            { label: 'Lasers and optics', text: 'Measure the falling object’s position many times during a drop lasting a fraction of a second.' }
          ],
          careers: ['Quantum sensing physicist', 'Geophysicist', 'Satellite geodesist', 'Hydrologist']
        }
      ],
      mapping: [
        ['The brown beam and pale line', 'The wooden board and its parchment-lined groove'],
        ['The colored ball', 'The bronze, glass or oak ball'],
        ['The brass post marked “stop”', 'Where the ball is caught and the water jet is stopped'],
        ['The box with a thin blue stream', 'The water clock: a vessel with a thin jet'],
        ['The cup on the grey stand', 'The glass of water on the balance; its weight is the time']
      ]
    }
  };

  // Shown above each Simulation Lab instrument: one photo, or a Then / Now / Next tour
  ADL.simVisits = {
    'projectile-lab': {
      photo: 'bouncing-ball', title: 'Where projectile motion matters',
      story: 'Coaches and broadcasters track every pitch, kick and golf shot with radar and high-speed cameras, then fit the flight to the same equations as this lab, with air resistance and spin added. Firefighters aim water jets the same way, and flight dynamics engineers plan the arcs of rockets and spacecraft. Katherine Johnson computed such trajectories by hand for NASA’s first crewed flights.',
      careers: ['Sports biomechanist', 'Flight dynamics engineer', 'Fire protection engineer', 'Ballistics analyst']
    },
    'ramp-lab': {
      photo: 'escape-lane', title: 'Where slopes and friction matter',
      story: 'Mountain highways build runaway-truck ramps: steep gravel lanes where friction and gravity stop a truck whose brakes have failed. Road engineers measure how grippy pavement is when wet, tire designers trade grip against wear, and accident investigators work out a car’s speed from the length of its skid marks and the friction of the road.',
      careers: ['Highway engineer', 'Accident reconstruction specialist', 'Tire engineer', 'Ropeway and ski-lift engineer']
    },
    'spring-lab': {
      photo: 'damper', title: 'Where springs and pendulums matter',
      story: 'Near the top of the Taipei 101 skyscraper hangs a 660-tonne steel ball on cables: a giant pendulum tuned so it swings against the building’s sway in typhoon winds. Every car rides on springs and dampers tuned the same way, seismometers use a hanging mass to record earthquakes, and LIGO’s mirrors hang from four-stage pendulums so they stay still enough to sense gravitational waves.',
      careers: ['Structural engineer', 'Vibration engineer', 'Seismologist', 'Automotive suspension engineer']
    },
    'home-pendulum': {
      title: 'From pendulum clocks to gravitational waves',
      lede: 'A weight on a string is one of the most useful objects in physics. It kept the world’s time for nearly 300 years, and it still isolates the most sensitive instruments ever built.',
      stops: [
        {
          era: 'Then · 1656–1673', place: 'The Hague, Netherlands', title: 'The pendulum clock', photo: 'pendulum-clock',
          story: `<p>Galileo noticed that a pendulum’s swings take about the same time whether they are wide or narrow, and late in life he sketched a clock built around one. Christiaan Huygens designed the first working pendulum clock in 1656, the clockmaker Salomon Coster built it, and it kept time far better than any clock before it.</p>
            <p>In 1673 Huygens published how the period depends on the pendulum’s length and on gravity, and pendulum clocks were the world’s most accurate timekeepers until the 1930s. Because the period depends on g, a pendulum is also a gravity meter: in 1672 the astronomer Jean Richer found his clock ran slow near the equator, early evidence that the Earth bulges there.</p>`,
          points: [{ label: 'Pendulum', text: 'A weight on a rod. Each swing lets the clock’s gears advance by a fixed step.' }, { label: 'Escapement', text: 'Gives the pendulum a tiny push each swing so it never runs down.' }],
          careers: ['Horologist (clock and watch maker)', 'Museum conservator', 'Timekeeping metrologist']
        },
        {
          era: 'Now', place: 'Science museums worldwide', title: 'A pendulum that shows the Earth turning', photo: 'foucault',
          story: `<p>In 1851 Léon Foucault hung a 28 kg ball from a 67 m wire inside the Panthéon in Paris. Over the hours, the direction of its swing slowly turned: not because the pendulum changed, but because the floor beneath it was turning with the Earth. Foucault pendulums now hang in museums and universities around the world.</p>
            <p>Your phone can do some of the same work. Its accelerometer can record a pendulum’s swing many times a second; physics teachers use phone sensor apps to turn kitchen experiments into real data.</p>`,
          points: [{ label: 'Long wire', text: 'A long pendulum swings slowly and keeps going for hours.' }, { label: 'Heavy bob', text: 'A heavy ball is barely slowed by the air.' }],
          careers: ['Science museum educator', 'Physics teacher', 'Exhibit designer']
        },
        {
          era: 'Next', place: 'LIGO, Washington and Louisiana, USA', title: 'Mirrors that must not move', photo: 'ligo-suspension',
          story: `<p>LIGO detected gravitational waves in 2015 by measuring changes in the length of its 4 km arms about a ten-thousandth of the width of a proton. Its 40 kg mirrors hang at the bottom of four-stage pendulums: shaking at the top is filtered out at every stage, so the mirror barely feels the ground moving.</p>
            <p>Engineers are designing the next generation of detectors, such as the proposed Cosmic Explorer and Einstein Telescope, with longer arms and even quieter suspensions.</p>`,
          points: [{ label: 'Test mass', text: 'A 40 kg fused-silica mirror, the last stage of the pendulum.' }, { label: 'Glass fibers', text: 'Thin fused-silica fibers hold the mirror with almost no energy loss.' }],
          careers: ['Gravitational-wave physicist', 'Optical engineer', 'Vibration isolation engineer', 'Vacuum technician']
        }
      ],
      mappingPhoto: 'pendulum-clock', mappingDescribe: 'A pendulum clock: a weight on a rod, timed by its swing.',
      mappingLede: 'This lab has no simulation to stand in for the real thing: you build a pendulum, time it, and the page turns your timings into a graph.',
      mapping: [['Your string and weight', 'The pendulum: length measured from the pivot to the middle of the weight'], ['The tap button', 'Your stopwatch: tap at the same point of every swing'], ['The graph', 'Period squared against length; a straight line means T² ∝ L']]
    }
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/tour.js */
/* Physics Discovery Lab · field-visit tour viewer.
   Renders a sequence of stops (Then / Now / Next), each a real photograph with
   numbered labels and a short account of how people actually work there, then an
   optional "from photo to simulation" stop supplied by the caller. */
(function (root) {
  'use strict';
  const ADL = root.ADL;
  const h = (...a) => ADL.h(...a);

  /* A photo with numbered hotspots. points: [{label, text, x?, y?}] (x, y as 0–1 fractions) */
  function figure(key, points, opts) {
    opts = opts || {};
    const ph = ADL.PHOTOS[key];
    const items = [];
    const frame = h('div', { class: 'photo-frame' + (ph ? '' : ' pending') });
    if (ph) {
      frame.append(h('img', { src: ph.src, alt: ph.alt || '', loading: 'lazy', width: ph.w || null, height: ph.h || null }));
      (points || []).forEach((pt, i) => {
        if (pt.x === undefined || pt.y === undefined) return;
        const b = h('button', { type: 'button', class: 'hotspot', style: { left: (pt.x * 100) + '%', top: (pt.y * 100) + '%' }, 'aria-label': `${i + 1}: ${pt.label}`, onclick: () => opts.onPoint && opts.onPoint(i) }, String(i + 1));
        items.push(b); frame.append(b);
      });
    } else {
      frame.append(h('div', { class: 'photo-pending' }, h('span', { class: 'photo-pending-tag' }, 'Photograph to come'), h('span', null, opts.describe || 'A real photograph of this instrument will appear here.')));
    }
    const fig = h('figure', { class: 'photo' + (opts.small ? ' small' : '') }, frame,
      ph ? h('figcaption', null, ph.caption ? h('span', null, ph.caption + ' ') : null, h('span', { class: 'credit' }, 'Photo: ', ph.source ? h('a', { href: ph.source, target: '_blank', rel: 'noopener' }, ph.credit) : ph.credit, ph.license ? ` · ${ph.license}` : '')) : null);
    fig.highlight = i => items.forEach((b, k) => b.classList.toggle('on', k === i));
    return fig;
  }

  /* visit: {lede, stops:[...]}; opts: {mappingNode, onFinish, finishLabel, compact} */
  function render(container, visit, opts) {
    opts = opts || {};
    let idx = Math.min(opts.start || 0, visit.stops.length - (opts.mappingNode ? 0 : 1));
    const total = visit.stops.length + (opts.mappingNode ? 1 : 0);
    const steps = h('div', { class: 'tour-steps', role: 'tablist', 'aria-label': 'Field visit stops' });
    const stage = h('div', { class: 'tour-stage' });
    const nav = h('div', { class: 'tour-nav' });
    const draw = () => {
      steps.replaceChildren(...visit.stops.map((s, i) => h('button', { type: 'button', role: 'tab', class: 'tour-step', 'aria-selected': String(i === idx), onclick: () => { idx = i; draw(); } }, h('span', { class: 'tour-step-era' }, s.era.split(' · ')[0]), h('span', { class: 'tour-step-title' }, s.title))),
        opts.mappingNode ? h('button', { type: 'button', role: 'tab', class: 'tour-step', 'aria-selected': String(idx === visit.stops.length), onclick: () => { idx = visit.stops.length; draw(); } }, h('span', { class: 'tour-step-era' }, 'Key'), h('span', { class: 'tour-step-title' }, 'From photo to simulation')) : null);
      stage.replaceChildren(idx < visit.stops.length ? stopView(visit.stops[idx]) : opts.mappingNode());
      nav.replaceChildren(
        idx > 0 ? h('button', { type: 'button', class: 'btn', onclick: () => { idx--; draw(); focusTop(); } }, '← Back') : h('span'),
        h('span', { class: 'muted small mono' }, `${idx + 1} / ${total}`),
        idx < total - 1 ? h('button', { type: 'button', class: 'btn primary', onclick: () => { idx++; draw(); focusTop(); } }, 'Next stop →')
          : opts.onFinish ? h('button', { type: 'button', class: 'btn primary', onclick: opts.onFinish }, opts.finishLabel || 'Done') : h('span'));
      opts.onStop && opts.onStop(idx);
    };
    const focusTop = () => { const t = stage.querySelector('h2'); if (t) t.focus({ preventScroll: true }); if (!opts.compact) container.scrollIntoView({ behavior: ADL.ui.reducedMotion() ? 'auto' : 'smooth', block: 'start' }); };
    container.replaceChildren(h('section', { class: 'tour' + (opts.compact ? ' compact' : '') }, visit.lede ? h('p', { class: 'tour-lede' }, visit.lede) : null, steps, stage, nav));
    draw();
  }

  function stopView(s) {
    const list = h('ol', { class: 'tour-points' });
    const fig = figure(s.photo, s.points, { describe: `${s.title}. ${s.place}.`, onPoint: i => select(i) });
    const select = i => { fig.highlight(i); list.querySelectorAll('li').forEach((li, k) => li.classList.toggle('on', k === i)); };
    (s.points || []).forEach((pt, i) => list.append(h('li', { tabindex: '-1' }, h('button', { type: 'button', class: 'tour-point', onclick: () => select(i) }, h('span', { class: 'tour-num' }, String(i + 1)), h('strong', null, pt.label)), h('span', null, pt.text))));
    const second = s.photo2 ? figure(s.photo2, null, { small: true, describe: 'A second photograph for this stop.' }) : null;
    return h('article', { class: 'tour-stop' },
      h('div', { class: 'tour-media' }, fig, second),
      h('div', { class: 'tour-text' },
        h('p', { class: 'eyebrow' }, `${s.era} · ${s.place}`),
        h('h2', { tabindex: '-1' }, s.title),
        h('div', { class: 'tour-story', html: s.story }),
        s.points && s.points.length ? h('h3', { class: 'mini-head' }, 'What you are looking at') : null, list,
        s.careers ? h('div', null, h('h3', { class: 'mini-head' }, 'People who do this'), h('ul', { class: 'career-chips' }, s.careers.map(c => h('li', { class: 'chip' }, c)))) : null));
  }

  ADL.tour = { figure, render };
})(window);

</script>
<script>/* js/chapters/galileo.js */
/* Chapter 1 · Galileo: the rolling ball. */
(function (root) {
  'use strict';
  const ADL = root.ADL, P = ADL.physics, fmt = ADL.fmt, G = P.GALILEO;
  const BALL = id => P.BALLS[id].label;
  const BALL_COLOR = { bronze: '#c9913f', glass: '#9fd6e8', oak: '#b07a45' };
  const isReal = r => (r.world || 'real') === 'real';
  const sinD = deg => Math.sin(deg * Math.PI / 180);
  // Isolated pairs on one control whose values differ by a ratio in [lo, hi], ordered small → large
  const ratioPairs = (runs, id, lo, hi, val) => ADL.flow.isolatedPairs(def, runs, id)
    .map(([a, b]) => (val(a) <= val(b) ? [a, b] : [b, a]))
    .filter(([a, b]) => val(b) / val(a) >= lo && val(b) / val(a) <= hi);
  const dist = r => r.controls.distance;
  const tOf = r => r.results.tMean;
  const timeText = s => s.status === 'slow' ? 'over a minute' : `${s.tMean.toFixed(2)} s`;

  const def = {
    id: 'galileo', code: 'GALI', order: 1, kicker: 'Chapter 1', era: 'c. 1604', place: 'Padua, Republic of Venice',
    title: 'The Rolling Ball', solvedTitle: 'Uniform Acceleration',
    question: 'A bronze ball rolls down a gentle groove. Does it settle into a steady speed, or keep speeding up, and by what rule?',
    tier: 'B', modelVersion: 'galileo-ramp-v1', acceptedHypothesis: 'time',
    scopeTag: 'Side view · slope drawn steeper than it is',
    howItWorks: `
      <p><strong>What is calculated.</strong> The ball's motion comes from Newton's second law for a solid sphere rolling without slipping, stepped forward in time 500 times a second. Rolling makes part of gravity's work go into spin, so the ball speeds up at 5/7 of the rate a frictionless sliding block would.</p>
      <ul>
        <li><strong>Ramp:</strong> a straight 2.00 m groove (Galileo's was about 12 cubits, roughly 6–7 m) at 1°–8°. Balls are 2.5 cm across: bronze 72 g, glass 20 g, oak 6 g.</li>
        <li><strong>Small losses:</strong> rolling friction (coefficient 0.0015, an assumed value for a hard ball in a smooth lined groove) and air drag (smooth sphere, drag coefficient 0.47). Together they make times about 2% longer than the ideal formula, and the light oak ball about 0.5% slower than bronze.</li>
        <li><strong>Timing:</strong> a water clock. A thin jet runs at a steady 4.0 g per second while a finger holds the jet open. Each release has a ±0.04 s finger-timing error and a ±0.05 g balance-reading error. Every run averages five releases.</li>
        <li><strong>Left out:</strong> the ball rolling on the groove's two edges (which slows it slightly more), bumps in the groove, and the water clock's flow slowing as the vessel empties.</li>

      <p><strong>What-if worlds (Open Lab):</strong> roll the same balls in a world where hypothesis A or B is the law of motion, to see what each one predicts.</p>`,

    intro: {
      letter: `<p><strong>Institute for the History of Motion · Archive note 1.1</strong></p>
        <p>Padua, about 1604. Galileo Galilei, professor of mathematics, is working on an old question: how do things fall? For nearly 2,000 years the standard answer has been Aristotle's: a heavy body moves toward the ground at its own natural speed, and a heavier body falls faster.</p>
        <p>Falling is too quick to study by eye, and there are no good clocks: the pendulum clock will not be built for another fifty years. Galileo's idea is to slow falling down. A ball rolling down a gentle slope is still being carried downward, only more gently, so there is time to measure it.</p>
        <p>To time it he uses water. A thin jet runs from a large vessel while the ball rolls; the water is caught in a cup and weighed. Twice the water means twice the time.</p>`,
      anomaly: `<p>The bronze ball is released from rest at the top of the groove. While it rolls the full 2 m, about <strong>16 grams</strong> of water run into the cup. Watching it, the ball seems to creep at first and to be moving quickly by the bottom. But “seems” is not a measurement. Does it settle into a steady speed? Does it keep speeding up all the way down? By what rule?</p>`,
      demo: { controls: { distance: 2, angle: 2, ball: 'bronze' }, seed: 1604 }
    },

    observations: [
      { id: 'o1', kind: 'observation', text: 'The ball started from rest at the top of the groove.', why: 'Anyone watching would agree; nothing pushed it.' },
      { id: 'o2', kind: 'observation', text: 'About 16–17 grams of water ran out while the ball rolled the full 2 m.', why: 'It is a number read off the balance.' },
      { id: 'o3', kind: 'observation', text: 'The five releases collected nearly the same amount of water.', why: 'It compares measured amounts.' },
      { id: 'o4', kind: 'inference', text: 'The ball moves because the Earth pulls it.', why: 'Nobody saw a pull; it explains why the ball moves.', hint: 'Can you see a pull?' },
      { id: 'o5', kind: 'inference', text: 'A heavier ball would roll down faster.', why: 'It predicts what an untested ball would do.', hint: 'Has anyone rolled a different ball yet?' },
      { id: 'o6', kind: 'inference', text: 'After the first moment the ball rolls at a steady speed.', why: 'Nobody has measured the speed at different points yet.', hint: 'Was the speed measured anywhere along the ramp?' }
    ],

    hypotheses: [
      { id: 'steady', letter: 'A', name: 'Steady speed', text: 'The ball almost at once reaches a natural speed, set by its weight and the slope, and keeps it. Heavier balls roll faster.' },
      { id: 'distance', letter: 'B', name: 'Speed grows with distance', text: 'Each equal distance rolled adds the same amount of speed, so the speed is proportional to the distance already covered.' },
      { id: 'time', letter: 'C', name: 'Speed grows with time', text: 'Each equal interval of time adds the same amount of speed, so the speed is proportional to the time since release.' }
    ],

    manipulations: [
      {
        id: 'quarter', label: 'Time the full ramp and its first quarter (same slope and ball)', prompt: 'The time for the first quarter will be…',
        options: [{ id: 'quarter', text: 'About a quarter of the full time' }, { id: 'half', text: 'About half of the full time' }, { id: 'most', text: 'Most of the full time (about three quarters)' }],
        howTo: 'Run with the stop mark at 2.00 m, then at 0.50 m, changing nothing else.',
        evaluate(after, all) {
          const p = ratioPairs(all.filter(isReal), 'distance', 3.6, 4.4, dist).filter(([a, b]) => after.includes(a) || after.includes(b)).pop();
          if (!p) return { status: 'untested' };
          const [a, b] = p, r = tOf(a) / tOf(b);
          return { status: 'observed', outcome: r < 0.375 ? 'quarter' : r < 0.62 ? 'half' : 'most', detail: `${a.runId}: ${dist(a).toFixed(2)} m in ${tOf(a).toFixed(2)} s; ${b.runId}: ${dist(b).toFixed(2)} m in ${tOf(b).toFixed(2)} s (ratio ${r.toFixed(2)}).` };
        }
      },
      {
        id: 'double', label: 'Double the distance (same slope and ball)', prompt: 'Over twice the distance, the time will be…',
        options: [{ id: 'x2', text: 'Twice as long' }, { id: 'x14', text: 'About 1.4 times as long' }, { id: 'bit', text: 'Only a little longer (less than 1.2 times)' }],
        howTo: 'For example, run at 1.00 m and then at 2.00 m, changing nothing else.',
        evaluate(after, all) {
          const p = ratioPairs(all.filter(isReal), 'distance', 1.8, 2.2, dist).filter(([a, b]) => after.includes(a) || after.includes(b)).pop();
          if (!p) return { status: 'untested' };
          const [a, b] = p, r = tOf(b) / tOf(a);
          return { status: 'observed', outcome: r > 1.7 ? 'x2' : r >= 1.2 ? 'x14' : 'bit', detail: `${a.runId}: ${dist(a).toFixed(2)} m in ${tOf(a).toFixed(2)} s; ${b.runId}: ${dist(b).toFixed(2)} m in ${tOf(b).toFixed(2)} s (× ${r.toFixed(2)}).` };
        }
      },
      {
        id: 'ball', label: 'Swap the bronze ball for the much lighter oak ball (same distance and slope)', prompt: 'The oak ball’s time will be…',
        options: [{ id: 'longer', text: 'Much longer: lighter balls roll more slowly' }, { id: 'same', text: 'About the same' }, { id: 'shorter', text: 'Shorter' }],
        howTo: 'Run once with the bronze ball and once with the oak ball, changing nothing else.',
        evaluate(after, all) {
          const p = ADL.flow.isolatedPairs(def, all.filter(isReal), 'ball').filter(([a, b]) => after.includes(a) || after.includes(b)).pop();
          if (!p) return { status: 'untested' };
          let [a, b] = p;
          if (P.ballMass(a.controls.ball) < P.ballMass(b.controls.ball)) [a, b] = [b, a]; // a heavier
          const r = tOf(b) / tOf(a);
          return { status: 'observed', outcome: Math.abs(r - 1) < 0.03 ? 'same' : r > 1 ? 'longer' : 'shorter', detail: `${BALL(a.controls.ball)} (${a.runId}): ${timeText(a.results)}; ${BALL(b.controls.ball)} (${b.runId}): ${timeText(b.results)}.` };
        }
      },
      {
        id: 'steeper', label: 'Make the slope twice as steep, e.g. 2° → 4° (same distance and ball)', prompt: 'On the steeper ramp, the time will be…',
        options: [{ id: 'half', text: 'About half' }, { id: 'x07', text: 'About 0.7 of the time' }, { id: 'same', text: 'The same' }],
        howTo: 'Run at 2°, then at 4°, changing nothing else.',
        evaluate(after, all) {
          const p = ratioPairs(all.filter(isReal), 'angle', 1.8, 2.25, r => sinD(r.controls.angle)).filter(([a, b]) => after.includes(a) || after.includes(b)).pop();
          if (!p) return { status: 'untested' };
          const [a, b] = p, r = tOf(b) / tOf(a);
          return { status: 'observed', outcome: r < 0.6 ? 'half' : r < 0.9 ? 'x07' : 'same', detail: `${a.runId} at ${a.controls.angle}°: ${tOf(a).toFixed(2)} s; ${b.runId} at ${b.controls.angle}°: ${tOf(b).toFixed(2)} s (× ${r.toFixed(2)}).` };
        }
      }
    ],

    controls: [
      { id: 'distance', label: 'Stop mark (distance from release)', min: 0.25, max: 2, step: 0.05, value: 2, unit: 'm', digits: 2, help: 'Where the ball is stopped and the jet closed, measured along the groove.', fmt: v => v.toFixed(2) + ' m' },
      { id: 'angle', label: 'Slope of the ramp', min: 1, max: 8, step: 0.5, value: 2, unit: '°', digits: 1, help: 'Gentle slopes keep the motion slow enough to time.', fmt: v => v.toFixed(1) + '°' },
      { id: 'ball', type: 'select', label: 'Ball', value: 'bronze', options: Object.keys(P.BALLS).map(id => ({ value: id, label: `${BALL(id)} (${Math.round(P.ballMass(id) * 1000)} g)` })), fmt: v => BALL(v) }
    ],
    presets: [
      { label: 'Full ramp', values: { distance: 2, angle: 2, ball: 'bronze' } },
      { label: 'First quarter', values: { distance: 0.5, angle: 2, ball: 'bronze' } },
      { label: 'Light ball', values: { distance: 2, angle: 2, ball: 'oak' } }
    ],
    worlds: [{ id: 'real', label: 'Real world' }, { id: 'steady', label: 'What-if: steady speed (A)' }, { id: 'distance', label: 'What-if: speed grows with distance (B)' }],
    runLabel: 'Release the ball',

    simulate: (c, seed, world) => P.galileoSimulate({ distance: c.distance, angle: c.angle, ball: c.ball }, seed, world),
    summarize: r => ({
      status: r.status, waterMean: r.waterMean, tMean: r.tMean, tSd: r.tSd, tSe: r.tSe, vAvg: r.vAvg, mass_g: r.mass_g, water: r.water
    }),
    readouts: [
      { label: 'Water collected (average of 5)', get: s => `${s.waterMean.toFixed(2)} g` },
      { label: 'Time (water ÷ 4.0 g/s)', get: s => s.status === 'slow' ? 'over a minute' : `${s.tMean.toFixed(3)} ± ${s.tSe.toFixed(3)} s` },
      { label: 'Spread of 5 releases', get: s => `± ${s.tSd.toFixed(3)} s` },
      { label: 'Average speed (distance ÷ time)', unit: 'm/s', get: s => s.vAvg.toFixed(3) }
    ],
    runSummary: r => `${r.controls.distance.toFixed(2)} m at ${r.controls.angle.toFixed(1)}°, ${BALL(r.controls.ball).toLowerCase()} ball → ${r.results.waterMean.toFixed(2)} g of water, ${timeText(r.results)}`,
    tableCols: [
      { label: 'Distance', get: r => r.controls.distance.toFixed(2) + ' m' },
      { label: 'Slope', get: r => r.controls.angle.toFixed(1) + '°' },
      { label: 'Ball', get: r => BALL(r.controls.ball) },
      { label: 'Water (g)', get: r => r.results.waterMean.toFixed(2) },
      { label: 'Time (s)', get: r => r.results.tMean.toFixed(3) },
      { label: 'Avg speed (m/s)', get: r => r.results.vAvg.toFixed(3) }
    ],
    describe(sh) {
      const r = sh.result, c = sh.controls;
      const setup = `With the stop mark at ${c.distance.toFixed(2)} m on a ${c.angle.toFixed(1)}° slope, the ${BALL(c.ball).toLowerCase()} ball`;
      if (r.status === 'slow') return `${setup} crawled so slowly that over a minute of water ran out.`;
      return `${setup} filled the cup with ${r.waterMean.toFixed(2)} g of water on average over five releases: ${r.tMean.toFixed(2)} ± ${r.tSe.toFixed(2)} s, an average speed of ${r.vAvg.toFixed(3)} m/s.`;
    },
    idleCaption: 'Ball held at the top of the groove. Set the stop mark, slope and ball, then release it. The water clock runs while the ball rolls.',

    animDuration: 2600,
    draw(ctx, v) {
      const D = ADL.draw, C = D.colors(), w = v.w, hh = v.h;
      D.bg(ctx, w, hh);
      const c = v.controls;
      const vis = (6 + c.angle * 2.2) * Math.PI / 180;
      const floorY = hh * 0.9, x0 = w * 0.07, y0 = hh * 0.26;
      const Lpx = Math.min(w * 0.68 / Math.cos(vis), (floorY - 18 - y0) / Math.sin(vis));
      const ux = Math.cos(vis), uy = Math.sin(vis), nx = Math.sin(vis), ny = -Math.cos(vis);
      const at = s => [x0 + s / G.rampLength * Lpx * ux, y0 + s / G.rampLength * Lpx * uy];
      const [x1, y1] = at(G.rampLength);
      // floor, support and beam
      D.line(ctx, 0, floorY, w, floorY, C.dim, 1);
      ctx.fillStyle = '#4a3a28'; ctx.fillRect(x0 - 10, y0 + 6, 16, floorY - y0 - 6);
      ctx.fillStyle = '#7a5a36';
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x1, y1 + 12); ctx.lineTo(x0, y0 + 12); ctx.closePath(); ctx.fill();
      D.line(ctx, x0, y0, x1, y1, '#d8c39a', 2);
      if (y1 + 12 < floorY) { ctx.fillStyle = '#4a3a28'; ctx.fillRect(x1 - 8, y1 + 12, 12, floorY - y1 - 12); }
      // distance marks every 25 cm
      for (let s = 0.25; s <= G.rampLength + 1e-9; s += 0.25) {
        const [mx, my] = at(s), major = Math.abs(s * 2 - Math.round(s * 2)) < 1e-9;
        D.line(ctx, mx, my, mx + nx * (major ? 9 : 5), my + ny * (major ? 9 : 5), C.dim, 1);
        if (major) D.label(ctx, s.toFixed(1), mx - nx * 22, my - ny * 22 + 4, { color: C.dim, size: 12, align: 'center' });
      }
      D.label(ctx, 'metres along the groove', x1 - nx * 24 - 6, y1 - ny * 24 + 22, { color: C.dim, size: 12, align: 'right' });
      // stop mark
      const [sx, sy] = at(c.distance);
      D.line(ctx, sx, sy, sx + nx * 26, sy + ny * 26, C.brass, 3);
      D.label(ctx, `stop · ${c.distance.toFixed(2)} m`, sx + nx * 30, sy + ny * 30 - 2, { color: C.brass, size: 12, align: 'center' });
      D.label(ctx, `${c.angle.toFixed(1)}° slope`, x0 + 16, floorY - 10, { color: C.dim, size: 12 });
      if ((v.world || 'real') !== 'real') D.label(ctx, `What-if world: ${v.world === 'steady' ? 'A, steady speed' : 'B, speed grows with distance'}`, w / 2, hh - 8, { color: C.alpha, size: 12, align: 'center' });
      // water clock: vessel, jet, cup on a balance
      // keep room above the vessel for its 12 px label on small (phone-width) canvases
      const vx = w * 0.79, vy = Math.max(hh * 0.06, 22), vw = w * 0.13, vh = hh * 0.15;
      ctx.strokeStyle = C.dim; ctx.lineWidth = 1.5; ctx.strokeRect(vx, vy, vw, vh);
      ctx.fillStyle = 'rgba(110,170,230,0.45)'; ctx.fillRect(vx + 2, vy + vh * 0.25, vw - 4, vh * 0.75 - 2);
      D.label(ctx, 'water clock', vx + vw / 2, vy - 6, { color: C.dim, size: 12, align: 'center' });
      const jx = vx + vw / 2, cupTop = hh * 0.44, cupH = hh * 0.12, cupW = w * 0.06;
      D.line(ctx, jx - 3, vy + vh, jx - 3, vy + vh + 8, C.dim, 2);
      const sh = v.shown, res = sh && sh.result, prog = res && !v.stale ? v.progress : 0;
      const rolling = res && !v.stale && prog > 0 && prog < 1;
      if (rolling) D.line(ctx, jx - 3, vy + vh + 8, jx - 3, cupTop + cupH - 4, 'rgba(140,195,245,0.9)', 2);
      ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.strokeRect(jx - cupW / 2, cupTop, cupW, cupH);
      const grams = res && !v.stale ? res.waterMean * prog : 0;
      const fill = Math.min(1, grams / 30);
      ctx.fillStyle = 'rgba(110,170,230,0.6)'; ctx.fillRect(jx - cupW / 2 + 1.5, cupTop + cupH * (1 - fill), cupW - 3, cupH * fill - 1.5);
      ctx.fillStyle = '#6d7a85'; ctx.fillRect(jx - cupW * 0.9, cupTop + cupH, cupW * 1.8, 5); ctx.fillRect(jx - 3, cupTop + cupH + 5, 6, 14); ctx.fillRect(jx - cupW * 0.7, cupTop + cupH + 19, cupW * 1.4, 6);
      const balY = cupTop + cupH + 44;
      D.label(ctx, `${grams.toFixed(2)} g`, jx, balY, { color: C.ink, size: 14, weight: 600, align: 'center' });
      if (res && !v.stale && prog >= 1 && res.status !== 'slow') D.label(ctx, `= ${res.tMean.toFixed(2)} s`, jx, balY + 18, { color: C.glow, size: 13, align: 'center', weight: 600 });
      // the ball
      let s = 0;
      if (res && !v.stale) {
        const t = prog * res.tTrue, sm = res.samples;
        let i = 0; while (i < sm.length - 2 && sm[i + 1][0] < t) i++;
        const [ta, xa] = sm[i], [tb, xb] = sm[Math.min(i + 1, sm.length - 1)];
        s = tb > ta ? xa + (xb - xa) * Math.min(1, Math.max(0, (t - ta) / (tb - ta))) : xb;
        s = Math.min(s, sh.controls.distance);
      }
      const r = 7, [bx, by] = at(s);
      const ball = (sh && !v.stale ? sh.controls.ball : c.ball);
      D.dot(ctx, bx + nx * r, by + ny * r, r, BALL_COLOR[ball], 6);
      D.label(ctx, sh && sh.run ? sh.run.runId : sh && sh.demo ? 'Archival observation' : '', 12, 20, { color: C.ink, size: 12, weight: 600 });
      if (v.stale) D.label(ctx, 'Settings changed. Release the ball to measure.', w / 2, hh * 0.18, { color: C.ink, size: 13, align: 'center', weight: 600 });
    },

    charts: [
      {
        id: 'dt', label: 'Time vs distance', overlay: true,
        build({ runs, overlays }) {
          const rs = runs.filter(r => r.results.status === 'ok' && isReal(r));
          if (!rs.length) return { empty: 'Each run appears here: how far the ball rolled across, how long it took up the side.' };
          const groups = new Map(); rs.forEach(r => { const k = r.controls.angle; groups.set(k, (groups.get(k) || []).concat(r)); });
          const angles = [...groups.keys()].sort((a, b) => groups.get(b).length - groups.get(a).length).slice(0, 4);
          const cols = ['--chart-1', '--chart-2', '--chart-4', '--chart-3'], shapes = ['circle', 'square', 'diamond', 'triangle'];
          const series = angles.map((a, i) => ({ kind: 'points', shape: shapes[i], color: cols[i], label: `${a.toFixed(1)}° slope`, data: groups.get(a).map(r => [r.controls.distance, r.results.tMean, r.results.tSe]) }));
          const tMax = Math.max(...rs.map(r => r.results.tMean));
          if (overlays) {
            const g = groups.get(angles[0]), anchor = g.reduce((m, r) => (r.controls.distance > m.controls.distance ? r : m), g[0]);
            const dA = anchor.controls.distance, tA = anchor.results.tMean, ds = Array.from({ length: 41 }, (_, i) => 0.02 + i * 0.0495);
            series.push({ kind: 'line', color: '--chart-2', label: 'C predicts (speed grows with time)', data: ds.map(d => [d, tA * Math.sqrt(d / dA)]) });
            series.push({ kind: 'line', color: '--chart-3', dash: [6, 4], label: 'A predicts (steady speed)', data: ds.map(d => [d, tA * d / dA]) });
            series.push({ kind: 'line', color: '--ink-2', dash: [2, 4], label: 'B predicts (speed grows with distance)', data: ds.map(d => [d, tA * Math.log(d / 0.01) / Math.log(dA / 0.01)]) });
          }
          const yMax = Math.max(1, Math.ceil(tMax * 1.25));
          return {
            x: { min: 0, max: 2.1, label: 'Distance rolled (m)', ticks: [0, 0.5, 1, 1.5, 2] },
            y: { min: 0, max: yMax, label: 'Time from release (s)' },
            series, table: { head: ['Run', 'Distance', 'Slope', 'Ball', 'Time (s)'], rows: rs.map(r => [r.runId, r.controls.distance.toFixed(2) + ' m', r.controls.angle.toFixed(1) + '°', BALL(r.controls.ball), r.results.tMean.toFixed(3)]) },
            note: 'Each point is one run, the average of five releases. Bars show ± one standard error. Different slopes use different shapes.' + (overlays ? ' Prediction curves pass through your longest run on the most-used slope.' : ''),

      },
      {
        id: 'dt2', label: 'Distance vs time²', overlay: true,
        build({ runs, overlays }) {
          const rs = runs.filter(r => r.results.status === 'ok' && isReal(r));
          if (rs.length < 2) return { empty: 'With two or more runs, this graph tries a different scale: distance up the side, time squared across. A straight line through zero would mean distance grows with time squared.' };
          const groups = new Map(); rs.forEach(r => { const k = r.controls.angle; groups.set(k, (groups.get(k) || []).concat(r)); });
          const angles = [...groups.keys()].sort((a, b) => groups.get(b).length - groups.get(a).length).slice(0, 4);
          const cols = ['--chart-1', '--chart-2', '--chart-4', '--chart-3'], shapes = ['circle', 'square', 'diamond', 'triangle'];
          const series = angles.map((a, i) => ({ kind: 'points', shape: shapes[i], color: cols[i], label: `${a.toFixed(1)}° slope`, data: groups.get(a).map(r => [r.results.tMean * r.results.tMean, r.controls.distance]) }));
          const t2Max = Math.max(...rs.map(r => r.results.tMean * r.results.tMean));
          let note = 'Each point is one run.';
          if (overlays) {
            const fit = P.fitLine(groups.get(angles[0]).map(r => [r.results.tMean * r.results.tMean, r.controls.distance]), true);
            if (fit) {
              series.push({ kind: 'line', color: '--ink-2', dash: [5, 4], label: `Best line through zero (${angles[0].toFixed(1)}°)`, data: [[0, 0], [t2Max * 1.1, fit.m * t2Max * 1.1]] });
              note += ` The best line through zero for the ${angles[0].toFixed(1)}° runs has slope ${fit.m.toFixed(4)} m/s², so the acceleration (twice the slope) is ${(2 * fit.m).toFixed(4)} m/s².`;
            }
          }
          return {
            x: { min: 0, max: Math.ceil(t2Max * 1.15), label: 'Time squared (s²)' },
            y: { min: 0, max: 2.1, label: 'Distance rolled (m)', ticks: [0, 0.5, 1, 1.5, 2] },

    ],

    discriminators: [

      resolvedNote: 'Balls that differ in weight by up to twelve times take the same time, within a fraction of a percent. Galileo argued that without air all bodies would fall together; the tiny differences left come from air and rolling friction, which matter more for light objects. In 1971, on the airless Moon, Apollo 15 astronaut David Scott dropped a hammer and a falcon feather together, and they landed at the same moment.'

    reveal: {
      model: `<p>A ball released from rest speeds up <strong>steadily</strong>: in each equal interval of time it gains the same amount of speed. That is <strong>uniform acceleration</strong>. Because the speed grows in proportion to time, the distance grows with the <strong>square</strong> of the time, d = ½at². A quarter of the distance takes half the time, and the distances covered in successive equal times go 1 : 3 : 5 : 7, the odd numbers.</p>
        <p>The acceleration does not depend on the ball's weight. It depends on the slope: steeper ramps give bigger accelerations, and the vertical limit is free fall, about 9.8 m/s² near Earth's surface.</p>`,
      history: `<p>Galileo taught mathematics at Padua from 1592 to 1610. In 1604, in a letter to his friend Paolo Sarpi, he stated that distance grows as the square of time, but tried to derive it from the idea that speed grows with <em>distance</em>, your hypothesis B. He later saw that this could not be right and that speed grows with <em>time</em>.</p>
        <p>His working notes survive. On one sheet (folio 107v, from around 1604), the historian Stillman Drake found distances along a ramp at equal times: 33, 130, 298, 526, 824, 1192, 1620 and 2104, in Galileo's own unit (the <em>punto</em>, just under a millimetre). Compare 33 × 1, 4, 9, 16, 25, 36, 49, 64.</p>
        <p>He published the result in <em>Two New Sciences</em> (1638), written while he was under house arrest after his trial by the Inquisition and printed in Leiden, outside Italy. He describes a wooden beam about 12 cubits long with a straight, polished groove lined with parchment, a hard round bronze ball, and a water clock whose water was weighed on an accurate balance. He says the experiment was repeated many times, and that a quarter of the length always took half the time.</p>
        <p>For centuries some historians doubted the experiment could work as described. In 1961 Thomas Settle rebuilt it from Galileo's description and got times that fit the law well.</p>
        <p>Galileo built on others. In the 1330s scholars at Merton College, Oxford, worked out the “mean speed” rule for steadily changing speed, and Nicole Oresme in Paris proved it with a graph in the 1350s. In the 1550s the Spanish friar Domingo de Soto suggested that falling bodies speed up uniformly. In 1586 Simon Stevin and Jan Cornets de Groot dropped two lead balls, one ten times heavier than the other, from a church tower in Delft and heard them land together. The famous story of Galileo dropping balls from the Leaning Tower of Pisa comes from a biography by his student Vincenzo Viviani; no record from the time confirms it.</p>`,
      notEstablished: `<ul>
        <li><strong>Why</strong> the ball speeds up. Galileo described the motion exactly but had no theory of force. Isaac Newton supplied one in 1687: a steady force gives a steady acceleration.</li>
        <li>That rolling is the same as falling. Galileo treated a ramp as slowed-down falling, but a rolling ball also spins, and spinning takes up some of the energy. A solid ball accelerates at only 5/7 of the rate a frictionless sliding block would, a correction worked out long after his death.</li>
        <li>The value of free-fall acceleration. Galileo's ramps showed the pattern, not the number. Christiaan Huygens's work on pendulums (1673) made accurate measurements of g possible.</li>
        <li>What happens in air. Real objects in air do fall at different rates: a feather drifts. Galileo's law describes motion without air resistance.</li>
      </ul>`,
      later: `<p>Newton's laws of motion and gravity (1687) explain why weight doesn't matter: a heavier ball is pulled harder, but it is also harder to speed up, by exactly the same factor. Émilie du Châtelet's French translation of Newton's <em>Principia</em>, with her own commentary, carried these ideas across Europe; in Bologna, Laura Bassi became one of the first women to hold a university professorship and taught Newtonian physics with her own experiments.</p>
        <p>The equality of falling has been tested ever more precisely. Loránd Eötvös's torsion-balance experiments in Budapest (around 1906–1909) showed it held to a few parts in a billion, and in 1907 Albert Einstein made it the starting point of general relativity. The MICROSCOPE satellite, which carried two test masses around the Earth from 2016 to 2018, confirmed in 2022 that they fall alike to about one part in 10<sup>15</sup>.</p>`,
      today: `<p>Every phone carries an accelerometer: a microscopic silicon mass on tiny springs that measures acceleration, used to turn the screen and count steps, and in cars to fire airbags within milliseconds of a crash. Drop towers turn free fall into a laboratory: NASA's Zero Gravity Research Facility in Ohio drops experiments down a 132 m vacuum shaft for 5.2 seconds of weightlessness.</p>
        <p>Geophysicists measure g directly with absolute gravimeters that drop a mirror in a vacuum and time its fall with a laser, a direct descendant of Galileo's ramp. They detect differences of a few parts in a billion, enough to track groundwater, find buried ore and watch magma rise beneath volcanoes.</p>`,
      derivation: `<p>If the speed grows steadily, v = at. Over a time t the speed rises from 0 to at, so the average speed is at/2 (the Merton mean-speed rule). Distance is average speed × time:</p>
        <div class="eq">d = ½ a t²   so   t = √(2d / a)</div>
        <p>A quarter of the distance takes √(1/4) = ½ the time. In successive equal intervals the distances are ½a(1² − 0²), ½a(2² − 1²), ½a(3² − 2²)… in the ratio 1 : 3 : 5 : 7.</p>

      sources: [
        { label: 'NASA: the Apollo 15 hammer and feather drop', url: 'https://nssdc.gsfc.nasa.gov/planetary/lunar/apollo_15_feather_drop.html' },

<script>/* js/problems-mech.js */
/* Physics Discovery Lab · practice-problem templates for the mechanics unit
   Topics: motion, forces, energy, oscillations.
   Every template rotates among real-world contexts and draws all of its numbers from the
   seeded rng, so templateId + seed always regenerates the identical problem. Each problem
   also carries a `given` object (the generated inputs) so tests can recompute answers.
   Problems state g = 9.81 m/s², the value students use; answers are computed with it.
   DOM-free: loads in the browser (ADL.problemTemplates) and in Node (module.exports). */
(function (root) {
  'use strict';
  const ADL = root.ADL = root.ADL || {};
  const T = ADL.problemTemplates = ADL.problemTemplates || [];

  const G = 9.81;                 // m/s², as stated in every problem
  const DEG = Math.PI / 180;
  const KMH = 3.6;                // 1 m/s = 3.6 km/h

  /* ---------- Random draws ---------- */
  const pick = (rng, a) => a[Math.min(a.length - 1, Math.floor(rng.uniform() * a.length))];
  function decimals(step) { const s = String(step), i = s.indexOf('.'); return i < 0 ? 0 : s.length - i - 1; }
  // Uniform on the grid lo, lo+step, ..., hi, so the shown value is exactly the value used.
  function rnd(rng, lo, hi, step) {
    const n = Math.round((hi - lo) / step);
    const k = Math.min(n, Math.floor(rng.uniform() * (n + 1)));
    return Number((lo + k * step).toFixed(decimals(step)));
  }

  /* ---------- Number formatting (HTML) ---------- */
  const MINUS = '−';
  const sigR = (v, n) => (v === 0 || !isFinite(v)) ? v : Number(v.toPrecision(n));
  function sci(v, n = 3) {
    if (!isFinite(v)) return String(v);
    if (v === 0) return '0';
    let p = Math.floor(Math.log10(Math.abs(v)));
    let ms = (Math.abs(v) / Math.pow(10, p)).toFixed(n - 1);
    if (Number(ms) >= 10) { p += 1; ms = (Math.abs(v) / Math.pow(10, p)).toFixed(n - 1); }
    return (v < 0 ? MINUS : '') + ms + ' × 10<sup>' + (p < 0 ? MINUS + (-p) : String(p)) + '</sup>';
  }
  function num(v, n = 3) {
    if (!isFinite(v)) return String(v);
    if (v === 0) return '0';
    const a = Math.abs(v);
    if (a >= 1e6 || a < 1e-3) return sci(v, n);
    const r = Math.abs(sigR(v, n));
    let s = r.toFixed(Math.max(0, n - 1 - Math.floor(Math.log10(r))));
    if (r >= 1e4) s = s.replace(/^\d+/, d => d.replace(/\B(?=(\d{3})+(?!\d))/g, ','));
    return (v < 0 ? MINUS : '') + s;
  }
  function fix(v, d) { const s = Math.abs(v).toFixed(d); return (v < 0 && Number(s) !== 0 ? MINUS : '') + s; }
  const int = v => Math.round(v).toLocaleString('en-US');
  const P = s => '<p>' + s + '</p>';
  const EQ = s => '<div class="eq">' + s + '</div>';
  const UL = items => '<ul>' + items.map(i => '<li>' + i + '</li>').join('') + '</ul>';
  const gTxt = 'Use <em>g</em> = 9.81 m/s<sup>2</sup>.';

  /* ---------- Parts ---------- */
  function numPart(id, prompt, answer, unit, digits, tol) {
    const p = { id, prompt: P(prompt), type: 'number', answer, unit, digits };
    if (tol && tol.abs !== undefined) p.abs = tol.abs;
    else p.tol = tol && tol.tol !== undefined ? tol.tol : 0.02;
    return p;
  }
  // Unordered options: shuffled so the right answer is not always first.
  function mcq(rng, id, prompt, correct, wrong) {
    const opts = [correct].concat(wrong), idx = opts.map((_, i) => i);
    for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rng.uniform() * (i + 1)); const t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
    return { id, prompt: P(prompt), type: 'choice', options: idx.map(i => opts[i]), answer: idx.indexOf(0) };
  }
  // Ordered options (categories, scales): keep the natural order.
  const ordered = (id, prompt, options, answer) => ({ id, prompt: P(prompt), type: 'choice', options, answer });

  /* ---------- Template registration ---------- */
  function register(spec) {
    const tpl = {
      id: spec.id, topic: spec.topic, title: spec.title, fields: spec.fields.slice(), levels: ['hs', 'college'],
      contexts: spec.contexts.map(c => c.key),
      generate(rng, level) {
        const lv = level === 'college' ? 'college' : 'hs';
        const cx = pick(rng, spec.contexts);
        const b = cx.build(rng, lv === 'college');
        const copy = o => Object.assign({}, o);
        const sim = cx.sim || spec.sim;
        const p = {
          id: spec.id + '-' + (rng.seed !== undefined ? rng.seed : 0),
          templateId: spec.id, topic: spec.topic, level: lv,
          title: cx.title || spec.title, fields: (cx.fields || spec.fields).slice(),
          context: b.context, parts: b.parts, hints: b.hints, solution: b.solution,
          principle: copy(cx.principle || spec.principle), history: copy(cx.history || spec.history),
          applications: copy(cx.applications), careers: cx.careers.slice(),
          given: Object.assign({ ctx: cx.key }, b.given)
        };
        if (sim) p.sim = { id: sim };
        return p;
      }
    };
    T.push(tpl);
    return tpl;
  }

  /* ======================================================================
     MOTION
     ====================================================================== */

  /* ---------- motion-stopping: reaction distance + braking distance ---------- */
  const stopHistory = { year: '1954', who: 'John Paul Stapp', text: P('Before the 1950s many engineers assumed a sudden stop of more than about 18 <em>g</em> would kill a person. John Paul Stapp, a U.S. Air Force flight surgeon, tested the idea on himself. On 10 December 1954 his rocket sled reached 1,017 km/h (632 mph) and then stopped in about 1.4 seconds, a deceleration of 46.2 <em>g</em>. He survived, showing that people strapped in properly can live through enormous decelerations. Stapp then spent years campaigning for car seat belts and crash research; U.S. rules required seat belts in new cars from 1968.') };
  register({

      {

              context, given: { v1k, v2k, tr, a },
              parts: [numPart('a', `What is the total stopping distance at ${v1k} km/h?`, s1, 'm', 3),
                numPart('b', `What is the total stopping distance at ${v2k} km/h?`, s2, 'm', 3)],
              hints: [P('Stopping distance = distance during the reaction time + braking distance.'),
                P('Convert each speed to m/s (divide by 3.6). Reaction distance = <em>v t</em><sub>r</sub>; braking distance = <em>v</em><sup>2</sup>/(2<em>a</em>).'),

              solution: P('Add the reaction distance and the braking distance at each speed:') + line(v1k, v1, s1) + line(v2k, v2, s2) +
                P(`Going ${v2k - v1k} km/h faster adds <strong>${num(s2 - s1, 3)} m</strong>, about ${Math.round((s2 / s1 - 1) * 100)}% more distance, because the braking part grows with the square of the speed.`)
            };
          }
          const D = Math.round((s1 + s2) / 2);
          const rem = D - v2 * tr, vhit = Math.sqrt(v2 * v2 - 2 * a * rem) * KMH;
          return {
            context: context + P(`A child runs out ${D} m in front of the car.`),

            hints: [P('During the reaction time the car covers <em>v t</em><sub>r</sub> at full speed. Only the rest of the distance is available for braking.'),

              P(`At ${v2k} km/h the reaction distance is ${num(v2 * tr, 3)} m, leaving ${num(rem, 3)} m of braking. For (c), compare the stopping distance at ${v1k} km/h (${num(s1, 3)} m) with ${D} m.`)],
            solution: P('(a) Reaction plus braking at the higher speed:') + line(v2k, v2, s2) +
